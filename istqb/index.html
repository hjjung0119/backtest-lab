<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ISTQB CTFL v4.0 실전 퀴즈 · D-1 · 지옥 킬러</title>
<style>
:root{
  --bg:#f1f3f7; --card:#ffffff; --ink:#15171c; --ink2:#3d4351; --muted:#7a8296;
  --line:#e4e7ee; --line2:#eef0f5;
  --brand:#3b5bdb; --brand-2:#5b7bf0; --brand-soft:#eef2fe;
  --ok:#0d8f5b; --ok-soft:#e9f8f1; --ok-line:#8fd9bb;
  --bad:#d33a3a; --bad-soft:#fdeeee; --bad-line:#f0b4b4;
  --warn:#8a6100; --warn-soft:#fff7e0;
  --shadow:0 1px 2px rgba(18,24,40,.05), 0 8px 24px -12px rgba(18,24,40,.14);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --card:#171b21; --ink:#e9edf5; --ink2:#c3cad8; --muted:#8b94a6;
    --line:#262c36; --line2:#1e242c;
    --brand:#6d87ff; --brand-2:#8aa0ff; --brand-soft:#1a2233;
    --ok:#37c98a; --ok-soft:#12261e; --ok-line:#2a6b51;
    --bad:#ff7a7a; --bad-soft:#2a1618; --bad-line:#6d3232;
    --warn:#e5b95c; --warn-soft:#241f12;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.6; letter-spacing:-0.01em;
  overscroll-behavior-y:none;
}
#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
main{flex:1;padding:0 16px calc(32px + env(safe-area-inset-bottom));}
#app.has-nav main{padding-bottom:calc(112px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
strong{font-weight:700;color:var(--ink);}

/* ---------- HOME ---------- */
.hero{padding:26px 4px 18px;}
.dday{display:inline-block;background:var(--brand-soft);color:var(--brand);
  font-size:12.5px;font-weight:800;letter-spacing:.02em;padding:5px 11px;border-radius:999px;margin-bottom:12px;}
.dday .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:6px;vertical-align:1px;}
.hero h1{margin:0 0 8px;font-size:26px;line-height:1.25;letter-spacing:-.03em;font-weight:800;}
.hero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55;}
.hero .sub2{margin-top:6px;font-size:13px;color:var(--muted);}
.hero .sub2 b{color:var(--ink2);}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px;}
.sec-title h2{margin:0;flex:0 0 auto;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;}
.sec-title span{flex:0 0 auto;font-size:12.5px;color:var(--muted);white-space:nowrap;}

.mode{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 60px 15px 66px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
}
.mode:active{transform:scale(.985);}
.mode .num{
  position:absolute;left:15px;top:15px;width:38px;height:38px;border-radius:12px;
  line-height:38px;text-align:center;
  font-size:15px;font-weight:800;background:var(--brand-soft);color:var(--brand);
}
.mode .body{display:block;}
.mode .t{font-size:15.5px;font-weight:700;letter-spacing:-.02em;}
.mode .s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
.mode .cnt{position:absolute;right:14px;top:50%;transform:translateY(-50%);white-space:nowrap;
  font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  padding:4px 9px;border-radius:999px;}
.mode.disabled{opacity:.5;}
.mode.resume .num{background:var(--warn-soft);color:var(--warn);}
.mode.resume .cnt{background:var(--warn-soft);color:var(--warn);}

.statrow{display:flex;gap:8px;margin:4px 0 0;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.stat .k{font-size:11.5px;color:var(--muted);margin-top:2px;}

.footnote{margin:18px 4px 0;font-size:12px;color:var(--muted);line-height:1.6;}
.footnote b{color:var(--ink2);}
.resetline{display:flex;justify-content:center;margin:18px 0 6px;}
.resetline button{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;white-space:nowrap;}

/* ---------- CHAPTER PICK ---------- */
.chlist{display:flex;flex-direction:column;gap:9px;}
.chitem{position:relative;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 54px 14px 62px;box-shadow:var(--shadow);text-align:left;width:100%;}
.chitem:active{transform:scale(.985);}
.chitem .cno{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:10px;
  line-height:34px;text-align:center;font-weight:800;font-size:13px;
  background:var(--brand-soft);color:var(--brand);}
.chitem .ct{display:block;}
.chitem .ct b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;}
.chitem .ct i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;}
.chitem .acc{position:absolute;right:14px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--muted);}

/* ---------- QUIZ ---------- */
.qbar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;}
.qbar .row{display:flex;align-items:center;gap:9px;}
.qbar .back{flex:0 0 34px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;color:var(--ink2);}
.qbar .back:active{background:var(--line2);}
.qbar .prog{flex:0 0 auto;font-size:13px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
.qbar .prog em{font-style:normal;color:var(--muted);font-weight:700;}
.qbar .timer{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:999px;white-space:nowrap;}
.qbar .spacer{flex:1 1 auto;min-width:0;}
.qbar .mini{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.qbar .mini b{color:var(--ok);}
.qbar .mini i{font-style:normal;color:var(--bad);}
.pbar{height:4px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden;}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-2));
  transition:width .25s ease;}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 16px;
  box-shadow:var(--shadow);margin-top:12px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.badge{font-size:11px;font-weight:800;letter-spacing:.01em;padding:3.5px 8px;border-radius:7px;
  background:var(--line2);color:var(--muted);}
.badge.ch{background:var(--brand-soft);color:var(--brand);}
.badge.tp{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:700;}
.qtopic{font-size:12.5px;font-weight:800;color:var(--brand);margin:0 0 7px;letter-spacing:-.01em;}
.qtext{font-size:16.5px;line-height:1.62;font-weight:600;letter-spacing:-.02em;word-break:keep-all;}
.qhtml{margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.quote{border-left:3px solid var(--line);background:var(--line2);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:14.5px;line-height:1.68;color:var(--ink2);word-break:keep-all;}
.code{background:#1b2330;color:#e3e9f5;border:1px solid #2b3648;border-radius:12px;padding:13px 14px;
  font-size:13px;line-height:1.72;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:0;white-space:pre;-webkit-overflow-scrolling:touch;}
@media (prefers-color-scheme: dark){ .code{background:#0a0d12;border-color:#242c3a;} }
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.5;
  border:1px solid var(--line);border-radius:10px;}
.tbl th,.tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 9px;text-align:left;
  white-space:nowrap;}
.tbl td.wrap{white-space:normal;}
.tbl th{background:var(--line2);font-weight:800;font-size:12px;color:var(--ink2);}
.tbl tr:last-child td{border-bottom:0;}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.opt{position:relative;display:block;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px 13px 51px;
  font-size:15px;line-height:1.55;letter-spacing:-.02em;word-break:keep-all;color:var(--ink2);
  transition:background .12s ease, border-color .12s ease, transform .1s ease;}
.opt:active{transform:scale(.99);}
.opt .lbl{position:absolute;left:14px;top:12px;width:25px;height:25px;border-radius:50%;
  line-height:25px;text-align:center;
  font-size:12px;font-weight:800;background:var(--line2);color:var(--muted);}
.opt .txt{display:inline;}
.opts.locked .opt{cursor:default;}
.opt.correct{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ink);}
.opt.correct .lbl{background:var(--ok);color:#fff;}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft);color:var(--ink);}
.opt.wrong .lbl{background:var(--bad);color:#fff;}
.opt.dim{opacity:.5;}
.opt .mark{margin-left:5px;font-size:13px;font-weight:800;}

.exp{margin-top:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);overflow:hidden;
  box-shadow:var(--shadow);animation:slidein .22s ease;}
@keyframes slidein{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.exp .head{position:relative;display:block;padding:12px 96px 12px 15px;font-weight:800;font-size:14px;letter-spacing:-.02em;}
.exp .head.ok{background:var(--ok-soft);color:var(--ok);}
.exp .head.no{background:var(--bad-soft);color:var(--bad);}
.exp .head .sub{position:absolute;right:15px;top:13px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--muted);}
.exp .body{padding:2px 15px 15px;}
.blk{margin-top:13px;}
.blk h4{margin:0 0 5px;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}
.blk p{margin:0;font-size:14.5px;line-height:1.68;color:var(--ink2);word-break:keep-all;}
.blk.trap p{background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:var(--ink2);}
.chips4{display:flex;flex-wrap:wrap;gap:5px;}
.chips4 span{font-size:11.5px;font-weight:700;background:var(--brand-soft);color:var(--brand);
  padding:3.5px 8px;border-radius:7px;letter-spacing:.01em;}
.owlist{margin-top:2px;}
.ow{display:flex;gap:7px;font-size:13.5px;line-height:1.62;padding:7px 9px;border-radius:9px;margin-top:5px;
  color:var(--ink2);word-break:keep-all;}
.ow .lbl{flex:0 0 15px;font-weight:800;font-size:12px;color:var(--muted);padding-top:1px;}
.ow.ok{background:var(--ok-soft);}
.ow.ok .lbl{color:var(--ok);}
.ow.no{background:var(--line2);}
.ow .tx b{font-size:11px;font-weight:800;margin-right:3px;}
.ow.ok .tx b{color:var(--ok);}
.ow.no .tx b{color:var(--bad);}
.rmrow{margin-top:14px;display:flex;gap:8px;align-items:center;}
.rmrow button{font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;}
.rmrow button:active{background:var(--line2);}
.rmrow .hint{font-size:12px;color:var(--muted);}

/* ---------- BOTTOM NAV ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
.nav .in{max-width:736px;margin:0 auto;display:flex;gap:8px;}
.btn{border-radius:12px;padding:12px 8px;font-size:14px;font-weight:800;letter-spacing:-.02em;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:active{background:var(--brand-2);}
.btn:active{transform:scale(.99);}
.btn:disabled{opacity:.38;}
.nav .in .btn{flex:1;min-width:0;}
.nav .in .btn.wide{flex:1.4;}

/* ---------- RESULT ---------- */
.scorecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;
  box-shadow:var(--shadow);text-align:center;margin-top:14px;}
.verdict{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:800;padding:5px 13px;border-radius:999px;margin-bottom:12px;}
.verdict.pass{background:var(--ok-soft);color:var(--ok);}
.verdict.fail{background:var(--bad-soft);color:var(--bad);}
.bignum{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1;}
.bignum small{font-size:17px;font-weight:700;color:var(--muted);letter-spacing:-.02em;}
.scoreline{margin-top:9px;font-size:13.5px;color:var(--muted);}
.bars{margin-top:18px;text-align:left;}
.bar{margin-top:11px;}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;}
.bar .bl span{white-space:nowrap;}
.bar .bl span:last-child{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
.bar .bt{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;}
.bar .bt i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .4s ease;}
.bar .bt i.low{background:var(--bad);}
.bar .bt i.mid{background:#e2a300;}

.wronglist{margin-top:16px;}
.wrongrow{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px 11px 58px;margin-bottom:8px;text-align:left;width:100%;}
.wrongrow .wr-no{position:absolute;left:13px;top:11px;font-size:12px;font-weight:800;color:var(--bad);white-space:nowrap;font-variant-numeric:tabular-nums;}
.wrongrow .wr-t{font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.45;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.empty{text-align:center;padding:54px 20px;color:var(--muted);}
.empty .ico{font-size:34px;margin-bottom:10px;}
.empty h3{margin:0 0 6px;font-size:16px;font-weight:800;color:var(--ink2);}
.empty p{margin:0;font-size:13.5px;line-height:1.6;}
.center-actions{display:block;margin-top:18px;}
.center-actions .btn{display:block;width:100%;margin-bottom:9px;}
.center-actions .btn:last-child{margin-bottom:0;}

.hintbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  background:#15171c;color:#fff;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:999px;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s ease;white-space:nowrap;}
.hintbar.on{opacity:.94;}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
</div>
<div id="hint" class="hintbar"></div>
<noscript><div style="padding:24px;font:16px -apple-system,sans-serif">이 퀴즈 앱은 JavaScript가 필요합니다. 브라우저 설정에서 스크립트를 허용해 주세요.</div></noscript>
<script>
"use strict";
const QUESTIONS = [{"id":"H01","src":"H","no":1,"ch":1,"topic":"7원칙 · 원칙의 예외와 한계","klevel":"K2","key":["Testing shows presence of defects","Absence-of-errors fallacy","Pesticide paradox","Defect clustering","Testing is context dependent"],"q":"테스팅의 7원칙에 대한 설명으로 **옳은 것을 모두 고른** 것은?\nㄱ. 테스팅은 소프트웨어에 결함이 있음을 보여줄 수 있지만, 결함이 없음을 증명할 수는 없다.\nㄴ. 모든 요구사항을 충족해도 사용자의 기대를 충족하지 못하면 품질이 부족한 것이다.\nㄷ. 같은 테스트를 반복하면 새로운 결함을 찾을 확률이 낮아지므로 테스트를 정기적으로 검토·갱신해야 한다.\nㄹ. 결함은 사용자가 늘어날수록 여러 모듈에 고르게 분산되므로 모듈별 결함 수는 비슷해진다.\nㅁ. 테스트 활동은 제품 유형·위험·SDLC 같은 상황에 따라 달라진다.","opts":["ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㅁ","ㄱ, ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ"],"answer":2,"why":"ㄱ은 '테스팅은 결함의 존재를 보여준다', ㄴ은 '결함 부재의 오류(absence-of-errors fallacy)', ㄷ은 '살충제 패러독스', ㅁ은 '테스팅은 정황에 의존한다' 원칙이다. ㄹ만 틀렸다. 결함 군집(defect clustering) 원칙은 결함이 소수 모듈에 집중되는 경향을 말하므로, 여러 모듈에 고르게 분산된다는 설명은 정반대다.","trap":"ㄹ 하나만 보고 나머지를 흘려 읽으면 ㄱ·ㄴ·ㄷ이 모두 맞아 보여 ㄹ을 뺀 보기를 고르기 쉽다. 군집 원칙은 '몰려서 나타난다'이고 '고르게 분산'은 그 반대다. 또 ㅁ(정황 의존적)도 7원칙이라는 점을 놓치면 ㅁ을 뺀 조합으로 흔들린다.","optwhy":["ㄹ이 들어 있어 오답이다. 결함 군집은 결함이 일부 모듈에 집중되는 현상이지, 고르게 분산되는 현상이 아니다.","ㄷ(살충제 패러독스)을 빠뜨렸다. 같은 테스트의 반복은 새 결함을 찾지 못하므로 테스트를 갱신해야 한다는 것도 7원칙이다.","정답. ㄱ(결함의 존재를 보여줄 뿐 부재를 증명하지 못함), ㄴ(결함 부재의 오류), ㄷ(살충제 패러독스), ㅁ(정황 의존적)이 모두 7원칙이다.","ㄷ까지는 맞지만 ㅁ(정황 의존적)을 빠뜨렸다. v4.0의 7원칙에 '테스팅은 정황에 의존한다'가 포함된다."]},{"id":"H02","src":"H","no":2,"ch":1,"topic":"QA vs QC vs Testing 경계","klevel":"K2","key":["Quality assurance","Quality control","Process-oriented","Product-oriented","Dynamic testing"],"q":"품질 보증(QA)·품질 제어(QC)·테스팅의 역할 구분으로 **가장 적절한** 것은?","opts":["QA는 프로세스 지향으로 결함 발생을 예방하는 활동이고, QC는 제품 지향으로 결함을 탐지하는 활동이며, 테스팅은 QC의 한 형태다.","QA는 완성된 제품을 검사해 결함을 찾는 활동이고, QC는 그 결과를 보고서로 정리하는 활동이다.","QC는 개발 프로세스를 개선해 결함이 생기지 않도록 하는 예방 활동이며, 테스팅은 QC와 무관한 별개 활동이다.","테스팅은 QA와 같은 말이며, 테스트를 많이 수행할수록 품질 보증 수준이 자동으로 높아진다."],"answer":0,"why":"QA는 '어떻게 일하는가'(프로세스)를 다루며 결함이 생기지 않도록 예방하고, QC는 '만들어진 제품'을 다루며 결함을 탐지한다. 테스팅은 제품을 실행해 결과를 확인하는 동적 활동이면서 리뷰·정적 분석 같은 정적 활동도 포함하는 QC의 한 형태다. 테스트를 통과했다고 품질이 '보증'되는 것은 아니다.","trap":"QA·QC·테스팅을 모두 '결함을 찾는 일'로 뭉뚱그리면 ②·③이 그럴듯해진다. 정오를 가르는 축은 '프로세스(예방) = QA / 제품(탐지) = QC / 실행해서 확인 = 테스팅'이다. '테스트를 많이 하면 품질이 보증된다'는 ④도 결함 부재의 오류와 QA·QC 혼동을 겹쳐 놓은 함정이다.","optwhy":["정답. 프로세스 지향·예방이 QA, 제품 지향·탐지가 QC, 테스팅이 QC의 한 형태라는 경계를 정확히 그었다.","QA와 QC를 뒤집었다. 제품을 검사해 결함을 찾는 것은 QC이고, 보고서 정리는 QC의 산출물 관리일 뿐 QA의 정의가 아니다.","QC에 예방이라는 정의를 붙였다. 프로세스 개선으로 결함을 예방하는 것은 QA이며, 테스팅이 QC와 무관하다는 설명도 틀렸다.","테스팅과 QA를 동일시했고, 테스트 통과가 품질 보증을 뜻하지도 않는다. 테스팅은 결함의 존재를 보여줄 뿐 부재를 증명하지 못한다."]},{"id":"H03","src":"H","no":3,"ch":1,"topic":"테스트 프로세스 7활동 · 산출물 매핑","klevel":"K2","key":["Test analysis","Test design","Test implementation","Test execution","Test monitoring and control","Test completion"],"q":"테스트 프로세스의 활동과 그 활동에서 수행하는 일의 연결로 **옳은 것을 모두 고른** 것은?\nㄱ. 테스트 베이시스를 분석해 테스트 컨디션을 식별하고 우선순위를 정한다 — 테스트 분석\nㄴ. 테스트 컨디션에서 테스트 케이스와 테스트 케이스 집합을 도출하고, 필요한 테스트 데이터·환경 요구사항을 식별한다 — 테스트 설계\nㄷ. 테스트 절차를 작성하고 테스트 스위트와 테스트 하네스를 준비한다 — 테스트 구현\nㄹ. 테스트를 실행하고 실제 결과를 기록하며, 이상 결과를 분석해 결함 보고서를 작성한다 — 테스트 실행\nㅁ. 테스트 진행 상황과 편차를 측정하고, 편차를 줄이기 위한 조치를 결정한다 — 테스트 완료","opts":["ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":3,"why":"테스트 프로세스는 계획 → 모니터링·제어 → 분석 → 설계 → 구현 → 실행 → 완료의 7활동이다. 진행 상황과 편차를 측정하고 조치를 결정하는 것은 '테스트 모니터링·제어'이며, 테스트 완료는 완료 보고서 작성, 테스트웨어 아카이빙, 교훈 기록, 후속 조치 정리다. 따라서 ㅁ만 틀렸다.","trap":"ㅁ은 문장 자체는 교과서적인 '제어' 설명이라 읽는 순간 맞다고 느껴진다. 그러나 활동 이름이 '테스트 완료'로 붙어 있어 오답이다. 모니터링·제어는 모든 활동과 병행하는 횡단 활동이며, 완료 활동과 혼동시키는 것이 이 문항의 장치다.","optwhy":["ㅁ이 들어 있어 오답이다. 편차 측정과 조치 결정은 테스트 모니터링·제어이지 테스트 완료가 아니다.","ㄱ(테스트 분석)이 빠졌다. 테스트 컨디션 식별은 테스트 분석의 핵심 활동이므로 뺄 수 없다.","ㄷ(테스트 구현)이 빠졌고 ㅁ이 들어 있다. 절차·스위트·하네스 준비는 테스트 구현이다.","정답. ㄱ~ㄹ은 분석·설계·구현·실행의 정의와 정확히 일치한다."]},{"id":"H04","src":"H","no":4,"ch":1,"topic":"테스트 프로세스의 조정 · 추적성 · 반복성","klevel":"K2","key":["Test process","Traceability","Test monitoring and control","Iterative test planning"],"q":"테스트 프로세스가 프로젝트 안에서 운영되는 방식에 대한 설명으로 **옳은 것을 모두 고른** 것은?\nㄱ. 테스트 활동과 산출물은 프로젝트의 SDLC와 조직 정책에 맞게 조정되며, 모든 프로젝트에 같은 순서와 산출물을 강제하지 않는다.\nㄴ. 테스트 모니터링과 제어는 다른 테스트 활동과 병행하며 지속적으로 수행된다.\nㄷ. 테스트 계획은 프로젝트 초반에 한 번 수립하면 이후에는 변경하지 않는 것이 원칙이다.\nㄹ. 테스트 산출물은 테스트 베이시스와 상호 추적 가능하게 관리되어 영향도 분석과 커버리지 보고에 쓰인다.\nㅁ. 각 활동에서 나온 정보는 이해관계자의 판단과 테스트 제어의 입력으로 활용된다.","opts":["ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ, ㅁ"],"answer":1,"why":"테스트 프로세스는 조직·SDLC·제품 맥락에 맞게 조정되는 것이며(ㄱ), 모니터링·제어는 전 활동과 병행한다(ㄴ). 산출물의 양방향 추적성은 영향도 분석과 커버리지 보고의 근거가 되고(ㄹ), 그 정보는 이해관계자의 판단과 제어 활동에 쓰인다(ㅁ). ㄷ만 틀렸다. 테스트 계획은 반복적이며, 진척·리스크 변화에 따라 갱신된다.","trap":"ㄷ은 '계획은 초반에 확정'이라는 실무 관행처럼 들려 자연스럽다. 그러나 ISTQB의 테스트 계획은 반복적(iterative)이며 리스크·피드백에 따라 계속 조정된다. ㅁ을 빼먹으면 정답 조합을 놓친다.","optwhy":["ㅁ을 빠뜨렸다. 활동에서 나온 정보가 이해관계자 판단과 제어의 입력이 된다는 것도 프로세스 운영의 일부다.","정답. ㄱ·ㄴ·ㄹ·ㅁ이 모두 옳고, ㄷ(계획의 1회 확정)만 틀렸다.","ㄷ이 들어 있어 오답이다. 테스트 계획은 반복적으로 갱신되는 산출물이다.","ㄷ이 들어 있고 ㄱ이 빠졌다. 맥락에 따른 조정은 프로세스 운영의 출발점이다."]},{"id":"H05","src":"H","no":5,"ch":1,"topic":"오류·결함·장애 · 베이시스 결함","klevel":"K3","key":["Error","Defect","Failure","Root cause","Test basis"],"q":"요구사항 명세에 '잔액이 0원이면 출금할 수 있다'라고 적혀 있었고, 개발자는 그대로 구현했다. 출시 후 고객이 잔액 0원에서 출금해 마이너스 잔액이 발생했고, 회계 감사에서 문제가 되었다. 이 상황에 대한 설명으로 **옳은** 것은?","opts":["결함은 요구사항 명세(테스트 베이시스)에 있고, 마이너스 잔액이라는 실제 동작은 장애(failure)다.","코드가 명세대로 동작했으므로 결함도 장애도 아니다.","장애(failure)는 요구사항 문장이고, 결함(defect)은 마이너스 잔액이 발생한 사건이다.","오류(error)·결함(defect)·장애(failure)는 같은 현상을 가리키는 다른 이름이다."],"answer":0,"why":"결함은 작업 산출물(여기서는 요구사항 명세)에 존재하는 불완전성이고, 장애는 실행 중에 관찰된 잘못된 동작이다. 코드가 명세를 그대로 따랐더라도 명세 자체가 틀렸다면 결함은 명세에 있다. 근본 원인은 요구사항을 검토하지 않은 판단(오류)과 인수 조건·리뷰 절차의 부재다. 검증(verification)에는 통과했지만 검증(validation)에서 실패한 사례다.","trap":"'개발자가 명세대로 구현했다'는 문장이 ②를 강하게 유인한다. 코드가 명세를 따랐다는 사실은 코드에 결함이 없다는 뜻일 뿐, 명세에 결함이 없다는 뜻이 아니다. ③은 장애와 결함의 정의를 맞바꾼 함정이다.","optwhy":["정답. 베이시스(요구사항)의 잘못이 결함, 실행 중 드러난 마이너스 잔액이 장애다.","명세를 따랐다는 이유로 결함·장애를 부정했다. 명세 자체가 틀렸으므로 결함이 있고, 마이너스 잔액은 장애다.","장애와 결함의 정의를 뒤집었다. 장애는 실행 중 관찰되는 사건이고, 결함은 산출물에 내재한 불완전성이다.","세 용어는 원인·산출물·현상으로 층이 다르다. 같은 현상의 다른 이름이 아니다."]},{"id":"H06","src":"H","no":6,"ch":1,"topic":"테스트 독립성의 득실","klevel":"K3","key":["Test independence","Domain knowledge","Bias","Collaboration"],"q":"제품 테스트를 외부 전문 업체에 맡겼다(독립성 최고 수준). 그러나 업체는 도메인 지식이 부족했고, 개발팀과의 소통이 늦어 결함 수정이 지연되었으며, 개발팀은 업체의 보고를 비난으로 받아들였다. 테스트 독립성에 대한 설명으로 **가장 적절한** 것은?","opts":["독립성은 개발자가 자신의 코드를 테스트할 때 가장 높아진다.","독립 테스트 조직을 도입하면 테스터 교육과 도메인 지식 전수는 불필요해진다.","독립성 수준이 높을수록 언제나 더 효과적이므로 도메인 지식 부족은 감수해야 한다.","독립성이 높으면 작성자의 편향에서 벗어날 수 있지만 도메인 지식과 의사소통이 약해질 수 있으므로, 도메인 전문가·개발자와의 협업과 지식 이전이 함께 필요하다."],"answer":3,"why":"독립성은 수준이 높을수록 편향이 줄어 결함을 더 잘 찾을 수 있지만, 제품·도메인 맥락과 개발 정보에서 멀어지고 의사소통 비용이 커진다. 개발자도 자기 코드에서 상당수 결함을 찾을 수 있으므로 독립성은 '높을수록 무조건 좋다'가 아니라 균형의 문제다. 독립성은 협업과 비난 없는 문화로 보완해야 한다.","trap":"'외부 업체 = 최고 독립성 = 최고 효과'라는 공식이 ③을 유인한다. 정답은 독립성의 장점과 비용을 함께 보는 문장이다. ①은 독립성 단계를 거꾸로 뒤집은 함정이고, ②는 독립성과 지식 이전을 대립시킨 함정이다.","optwhy":["독립성 단계를 뒤집었다. 개발자 본인이 자기 코드를 테스트하는 것이 가장 낮은 독립성이다.","독립 조직일수록 도메인 지식 전수가 더 중요하다. 교육과 지식 이전이 불필요해지지 않는다.","독립성의 비용(도메인 지식·소통)을 무시했다. 높은 독립성이 항상 더 효과적이라는 보장은 없다.","정답. 편향 감소라는 이득과 도메인 지식·의사소통의 손실을 함께 제시하고 협업으로 보완한다고 했다."]},{"id":"H07","src":"H","no":7,"ch":1,"topic":"불완전한 테스트 베이시스","klevel":"K3","key":["Test basis","Prototype","Risk","Exploratory testing"],"q":"스타트업이 문서화된 요구사항 없이 구두 설명과 클릭 가능한 프로토타입만으로 기능을 개발했다. 테스트 베이시스 관점에서 **가장 적절한** 대응은?","opts":["테스트 베이시스가 문서로 존재하지 않으므로 테스트를 시작할 수 없다.","프로토타입·사용자 스토리·도메인 지식 등 가용한 베이시스를 사용해 테스트를 설계하되, 베이시스의 불완전성을 리스크로 기록하고 추적한다.","소스 코드를 베이시스로 삼아 화이트박스 테스팅만 수행한다.","요구사항이 문서화될 때까지 테스트를 보류하고 일정을 연기한다."],"answer":1,"why":"테스트 베이시스는 요구사항 명세만이 아니라 프로토타입, 사용자 스토리, 모델, 계약서, 도메인 지식 등 테스트 근거가 되는 모든 정보다. 베이시스가 불완전하면 누락·모순 결함을 놓칠 리스크가 커지므로, 이를 리스크로 기록하고 탐색적·경험 기반 기법을 병행하며 보완한다.","trap":"'베이시스 = 요구사항 문서'라는 고정관념이 ①·④를 유인한다. ③은 코드를 베이시스로 삼으면 사용자 기대를 검증(validation)할 수 없다는 점을 놓친 함정이다. 정답은 '가용한 베이시스 + 리스크 기록'이다.","optwhy":["베이시스의 범위를 문서로 좁혔다. 프로토타입과 도메인 지식도 베이시스다.","정답. 가용한 베이시스를 쓰되 불완전성을 리스크로 관리하는 것이 ISTQB의 권고다.","코드만 보면 명세와 사용자 기대의 불일치를 찾지 못한다. 검증(validation)이 사라진다.","베이시스가 완벽해질 때까지 기다리는 것은 조기 테스팅 원칙과 위험 관리에 어긋난다."]},{"id":"H08","src":"H","no":8,"ch":1,"topic":"테스팅의 목적과 이해관계자","klevel":"K2","key":["Test objectives","Provide information to stakeholders","Confidence","Contractual requirements"],"q":"같은 릴리스에 대해 경영진은 '출시해도 되는지' 판단할 정보를, 운영팀은 '장애 발생 시 복구 절차가 검증되었는지'를, 규제 기관은 '법규 준수 증거'를 요구한다. 테스팅의 목적에 대한 설명으로 **가장 적절한** 것은?","opts":["테스팅은 품질을 보증하는 활동이므로 테스트를 통과하면 품질이 보장된다.","테스팅의 목적은 결함을 찾는 것 하나뿐이므로 세 요구는 모두 같은 정보를 뜻한다.","테스팅은 결함 발견 외에도 품질에 대한 확신 형성, 계약·법규 요구사항 검증, 이해관계자의 의사결정에 필요한 정보 제공 등 여러 목적을 가지며, 이해관계자마다 필요한 정보가 다르다.","규제 준수 확인은 테스팅의 목적이 아니라 감사 부서의 업무다."],"answer":2,"why":"테스트의 일반적 목적에는 작업 산출물 평가, 결함 발견과 장애 유발, 요구된 커버리지 확보, 품질 부족 리스크 감소, 계약·법규 요구사항 검증, 이해관계자에 정보 제공, 품질에 대한 확신 형성, 완성도 검증이 포함된다. 이해관계자마다 의사결정에 필요한 정보가 다르므로 테스트 보고도 그에 맞춰야 한다.","trap":"'테스팅 = 결함 찾기'라는 축소가 ②를 유인한다. ④는 규제 준수 검증이 목적에서 빠진다고 단정한 함정이고, ①은 테스팅과 품질 보증(QA)을 혼동시킨 함정이다.","optwhy":["테스트 통과는 품질을 '보증'하지 않는다. 테스팅은 결함의 존재를 보여줄 뿐 부재를 증명하지 못한다.","목적을 결함 발견 하나로 축소했다. 확신 형성, 계약·법규 검증, 정보 제공도 목적이다.","정답. 목적이 다원적이고 이해관계자별 정보 요구가 다르다는 점을 정확히 설명했다.","계약·법규 요구사항 검증은 v4.0이 명시한 테스트 목적 중 하나다."]},{"id":"H09","src":"H","no":9,"ch":2,"topic":"순차적 SDLC와 테스트 시점","klevel":"K3","key":["Sequential development model","Shift left","Regression testing","Feedback loop"],"q":"요구사항이 자주 바뀌고 릴리스 주기가 2주인 프로젝트에, 단계별 산출물이 확정된 뒤 다음 단계로 넘어가는 순차적(폭포수) 개발 모델을 적용하려 한다. 이 결정이 테스트에 주는 영향과 보완책으로 **가장 적절한** 것은?","opts":["각 단계가 확정된 뒤 진행되므로 회귀 테스팅이 필요 없다.","순차적 모델에서는 테스트 레벨을 정의할 필요가 없다.","테스트는 릴리스 직전에 한 번만 수행하면 충분하다.","테스트가 개발 후반에 몰려 초기 피드백이 어려워지고 늦게 발견된 요구사항·설계 결함의 재작업 비용이 커지므로, 요구사항·설계 리뷰를 앞당기고 자동화된 회귀 테스트를 준비해 변경에 대응한다."],"answer":3,"why":"순차적 모델은 테스트가 후반부에 집중되어 피드백이 늦고, 늦게 발견된 결함의 수정 비용이 크다. 요구사항이 자주 바뀌는 상황에서는 그 위험이 더 커지므로 리뷰·정적 분석으로 조기에 검증하고, 자동화된 회귀 테스트로 변경의 부작용을 빠르게 확인하는 보완이 필요하다. 테스트 레벨과 회귀 테스팅은 어떤 SDLC에서도 필요하다.","trap":"'단계가 확정되면 변경이 없다'는 순차 모델의 가정이 ①·③을 유인한다. 그러나 요구사항이 자주 바뀌는 프로젝트에 순차 모델을 적용하면 그 가정이 깨지고, 늦은 피드백과 회귀 위험이 가장 큰 문제가 된다.","optwhy":["변경이 생기면 회귀 테스팅은 필수다. 순차 모델이라고 면제되지 않는다.","테스트 레벨은 SDLC와 무관하게 테스트 대상·목표·베이시스로 정의된다.","릴리스 직전 1회 수행은 결함을 늦게 발견해 비용을 키운다.","정답. 순차 모델의 구조적 약점(늦은 피드백·재작업 비용)과 보완책(조기 리뷰·회귀 자동화)을 함께 제시했다."]},{"id":"H10","src":"H","no":10,"ch":2,"topic":"테스트 레벨 5단계 특성","klevel":"K2","key":["Component testing","Component integration testing","System testing","System integration testing","Acceptance testing"],"q":"테스트 레벨에 대한 설명으로 **옳은 것을 모두 고른** 것은?\nㄱ. 컴포넌트 테스팅의 테스트 베이시스는 상세 설계와 코드다.\nㄴ. 컴포넌트 통합 테스팅은 컴포넌트 사이의 인터페이스와 상호작용에서 생기는 결함에 초점을 둔다.\nㄷ. 시스템 테스팅은 시스템 요구사항을 기반으로 하며, 주로 화이트박스 기법을 적용한다.\nㄹ. 시스템 통합 테스팅은 시스템과 외부 시스템(외부 서비스·API) 사이의 인터페이스를 검증한다.\nㅁ. 인수 테스팅은 사용자 요구와 비즈니스 프로세스의 충족 여부를 확인하며, 신뢰 형성과 적합성 판단에 초점을 둔다.","opts":["ㄱ, ㄴ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ"],"answer":0,"why":"시스템 테스팅은 시스템 요구사항·비즈니스 규칙을 베이시스로 하며 주로 블랙박스 기법을 쓴다. 화이트박스 기법은 컴포넌트 테스팅처럼 코드 구조를 볼 수 있는 레벨에서 주로 쓰인다. 따라서 ㄷ만 틀렸고 ㄱ·ㄴ·ㄹ·ㅁ이 옳다.","trap":"ㄷ의 '주로 화이트박스'가 함정이다. 시스템 테스팅에서도 내부 구조를 활용할 수는 있지만 대표 기법은 블랙박스다. ㄴ과 ㄹ(컴포넌트 통합 vs 시스템 통합)의 경계도 함께 흔든다.","optwhy":["정답. ㄱ·ㄴ·ㄹ·ㅁ이 옳고, 시스템 테스팅을 화이트박스로 단정한 ㄷ만 틀렸다.","ㄷ이 들어 있고 ㄴ·ㅁ이 빠졌다. 통합의 초점과 인수 테스팅의 목적이 모두 옳은 설명이다.","ㄱ(컴포넌트 테스팅의 베이시스)이 빠졌다. 상세 설계와 코드는 컴포넌트 테스팅의 베이시스다.","ㄷ이 들어 있어 오답이다. 시스템 테스팅의 대표 기법은 블랙박스다."]},{"id":"H11","src":"H","no":11,"ch":2,"topic":"기능·비기능·확인·회귀 테스팅 구분","klevel":"K2","key":["Functional testing","Non-functional testing","Confirmation testing","Regression testing","Test type vs test level"],"q":"다음 활동에 대한 설명으로 **옳은** 것은?\n㉠ 할인 계산 규칙이 요구사항대로 동작하는지 확인한다.\n㉡ 1,000명 동시 접속에서 평균 응답시간을 측정한다.\n㉢ 방금 수정된 결함이 실제로 해결되었는지 그 테스트를 다시 실행한다.\n㉣ 수정된 코드가 기존 기능을 깨뜨리지 않았는지 자동화 스위트를 재실행한다.","opts":["㉢은 회귀 테스팅, ㉣은 확인(confirmation) 테스팅이다.","㉠은 기능 테스팅, ㉡은 비기능 테스팅이며, ㉢은 확인 테스팅, ㉣은 회귀 테스팅이다.","㉠은 비기능 테스팅, ㉡은 기능 테스팅이다.","㉢과 ㉣은 같은 활동이며, 테스트 유형은 테스트 레벨과 1대1로 대응한다."],"answer":1,"why":"요구사항이 '무엇을 하는가'를 확인하면 기능 테스팅, '얼마나 잘 하는가'(성능·보안·사용성 등)를 확인하면 비기능 테스팅이다. 확인 테스팅은 결함 수정 자체가 제대로 되었는지 확인하고, 회귀 테스팅은 변경이 다른 부분에 부정적 영향을 주지 않았는지 확인한다. 테스트 유형은 테스트 레벨과 1대1로 대응하지 않고 여러 레벨에 적용될 수 있다.","trap":"㉢과 ㉣은 둘 다 '다시 실행'이라 같은 활동처럼 보인다. 확인은 '그 결함', 회귀는 '다른 기능'이 대상이라는 점이 정오를 가른다. ④의 '유형=레벨 1대1'도 흔한 오해다.","optwhy":["㉢과 ㉣을 맞바꿨다. 수정된 결함의 재확인이 확인 테스팅, 부작용 확인이 회귀 테스팅이다.","정답. 기능/비기능과 확인/회귀의 정의를 모두 정확히 배치했다.","㉠과 ㉡을 뒤집었다. 할인 규칙은 기능, 응답시간은 비기능이다.","두 활동은 대상이 다르고, 테스트 유형은 테스트 레벨과 1대1 대응하지 않는다."]},{"id":"H12","src":"H","no":12,"ch":2,"topic":"유지보수 테스팅 · 영향도 분석","klevel":"K3","key":["Maintenance testing","Impact analysis","Data migration","Regression scope"],"q":"운영 중인 쇼핑몰이 결제 대행사(PG)를 교체하고, 회원 데이터를 새 스키마로 이관한다. 유지보수 테스팅 관점에서 **가장 적절한** 계획은?","opts":["데이터 이관은 개발 작업이므로 테스트 대상에서 제외한다.","변경된 결제 모듈만 테스트하면 되므로 다른 기능은 테스트하지 않는다.","영향도 분석(impact analysis)으로 변경의 영향 범위를 파악하고, 이관 데이터의 완전성·정합성 테스트와 기존 기능에 대한 회귀 테스팅을 함께 수행한다.","유지보수 테스팅은 신규 개발과 같으므로 인수 테스팅만 수행하면 된다."],"answer":2,"why":"유지보수 테스팅의 범위는 변경의 크기와 영향도로 정해진다. 영향도 분석으로 변경이 닿는 영역을 찾고, 데이터 이관은 이관 후 완전성·정합성(필드 매핑, 누락·중복, 이관 후 조회·계산)을 확인해야 하며, 변경이 기존 기능을 깨뜨리지 않았는지 회귀 테스트를 수행해야 한다. 유지보수 테스팅은 수정·이관·폐기(은퇴) 같은 유지보수 유형에서 모두 발생한다.","trap":"'결제만 바뀌었으니 결제만'이 ②를 유인한다. PG 교체는 결제·정산·환불·알림 등 여러 흐름에 영향을 준다. ①은 데이터 이관이 유지보수 테스팅의 대표 트리거라는 점을 놓친 함정이다.","optwhy":["데이터 이관은 유지보수 테스팅의 대표적 트리거이며, 완전성·정합성 검증이 필수다.","변경의 영향 범위를 좁게 봤다. PG 교체는 정산·환불·알림 등 연쇄 영향을 준다.","정답. 영향도 분석 + 이관 데이터 검증 + 회귀 테스팅을 함께 세웠다.","유지보수 테스팅도 영향 범위에 따라 레벨과 유형을 조합한다. 인수 테스팅만으로는 부족하다."]},{"id":"H13","src":"H","no":13,"ch":2,"topic":"DevOps · CI에서의 Shift-Left와 운영 모니터링","klevel":"K2","key":["Shift left","Continuous testing","Continuous integration","Feedback loop","Exploratory testing"],"q":"팀이 CI/CD 파이프라인을 운영한다. 커밋마다 정적 분석과 단위 테스트, 야간에 API 회귀 스위트, 릴리스 전 수동 탐색적 테스팅과 성능 테스트를 수행하고, 배포 후 모니터링으로 이상 징후를 감시한다. 이에 대한 설명으로 **가장 적절한** 것은?","opts":["이것은 테스트를 개발 초기로 옮기는 shift-left와 배포 후 운영 모니터링을 함께 쓰는 방식으로, 빠른 피드백을 위해 자동화된 테스트를 파이프라인에 통합하고 운영 모니터링으로 배포 후 정보를 얻는다.","shift-left는 모든 테스트를 운영 환경에서 수행하는 것을 뜻한다.","CI에서 단위 테스트를 자동화하면 탐색적 테스팅은 불필요해진다.","DevOps에서는 테스트 계획과 리스크 분석을 생략한다."],"answer":0,"why":"shift-left는 테스트·리뷰·정적 분석을 개발 초기로 옮겨 빠른 피드백을 얻는 접근이고, 배포 후 운영 모니터링·텔레메트리로 정보를 얻는 것은 그 반대편(shift-right)에 해당한다. DevOps는 자동화된 지속적 테스트를 강조하지만 계획·리스크 분석·탐색적 테스팅을 없애지 않는다. 자동화는 사람이 설계한 확인만 반복할 뿐, 새로운 위험을 발견하는 탐색을 대체하지 못한다.","trap":"'자동화 = 사람 불필요'가 ③을 유인한다. 또한 shift-left를 '운영으로 옮긴다'로 뒤집은 ②, DevOps를 '계획 없음'으로 오해한 ④가 함께 흔든다.","optwhy":["정답. 조기 자동화·피드백(shift-left)과 배포 후 운영 모니터링을 구분해 설명했다.","shift-left는 반대다. 테스트를 더 이르게(왼쪽으로) 옮기는 접근이다.","탐색적 테스팅은 자동화가 놓치는 영역을 사람이 찾는 활동으로, 자동화와 대체 관계가 아니다.","DevOps에서도 계획과 리스크 분석은 테스트 전략의 출발점이다."]},{"id":"H14","src":"H","no":14,"ch":2,"topic":"테스트 레벨의 정의와 결합","klevel":"K2","key":["Test level","Test object","Test basis","Combining test levels"],"q":"테스트 레벨을 정의하는 요소와 프로젝트 적용에 대한 설명으로 **옳은** 것은?","opts":["모든 프로젝트는 컴포넌트·통합·시스템·인수 테스팅을 순서대로 반드시 수행해야 한다.","테스트 레벨은 사용하는 테스트 도구의 종류에 따라 결정된다.","테스트 레벨이 높을수록 화이트박스 기법의 비중이 커진다.","테스트 레벨은 테스트 대상, 목표, 베이시스, 발견하려는 결함, 접근법과 책임으로 정의되며, 프로젝트 규모와 맥락에 따라 결합하거나 생략할 수 있다."],"answer":3,"why":"테스트 레벨은 테스트 대상(test object), 테스트 목표, 테스트 베이시스, 발견하려는 결함의 종류, 접근법과 책임으로 정의된다. 프로젝트 규모가 작거나 맥락상 불필요하면 레벨을 결합하거나 생략할 수 있다. 레벨이 높아질수록(시스템·인수) 블랙박스 비중이 커지는 것이 일반적이다.","trap":"'5단계를 모두 수행'이 ①을 유인한다. ISTQB는 레벨의 결합·생략을 허용한다. ③은 레벨과 기법의 관계를 반대로 뒤집었다.","optwhy":["레벨은 결합·생략될 수 있다. 모두 순서대로 수행해야 하는 것은 아니다.","레벨은 테스트 대상·목표·베이시스로 정의되지 도구로 결정되지 않는다.","레벨이 높아질수록 블랙박스 비중이 커진다. 화이트박스는 낮은 레벨의 특징이다.","정답. 레벨의 정의 요소와 결합·생략 가능성을 정확히 서술했다."]},{"id":"H15","src":"H","no":15,"ch":3,"topic":"리뷰 역할 경계 (Manager·Leader·Moderator·Scribe·Author)","klevel":"K2","key":["Manager","Review leader","Moderator","Scribe","Author"],"q":"한 공식 리뷰가 다음과 같이 진행되었다.\n· A는 어떤 산출물을 리뷰할지 정하고 리뷰 자원과 일정을 배정했다.\n· B는 리뷰 전반의 책임을 지고 누가 어떤 역할을 맡을지 정했다.\n· C는 리뷰 회의를 진행하며 참가자 간 의견 충돌을 중재했다.\n· D는 발견된 이상과 결정 사항을 기록하고 회의록을 정리했다.\n· E는 발견된 결함을 수정했다.\n역할 연결로 **옳지 않은** 것은?","opts":["B — 리뷰 리더(Review Leader)","C — 리뷰 리더(Review Leader)","D — 기록자(Scribe)","A — 관리자(Manager)"],"answer":1,"why":"관리자는 리뷰 대상 결정과 자원·일정 배정을 맡고(대상 산출물 선택), 리뷰 리더는 리뷰 전반의 책임과 역할 배정을 맡는다. 회의를 진행하고 의견 충돌을 중재하는 것은 조정자(Moderator/Facilitator)다. 기록자는 이상과 결정 사항을 기록하고, 작성자(Author)가 결함을 수정한다. 따라서 C의 역할은 리뷰 리더가 아니라 조정자다.","trap":"리뷰 리더와 조정자의 경계가 함정이다. '전반 책임·역할 배정 = 리더', '회의 진행·중재 = 조정자'로 갈라야 한다. 회의를 이끄는 사람을 자연스럽게 '리더'로 읽는 것이 이 문항의 장치다.","optwhy":["옳은 연결이다. 리뷰 전반의 책임과 역할 배정은 리뷰 리더의 몫이다.","옳지 않은 연결이다. 회의 진행과 의견 충돌 중재는 조정자(Moderator)의 몫이지 리뷰 리더가 아니다.","옳은 연결이다. 발견된 이상과 결정 사항의 기록은 기록자의 몫이다.","옳은 연결이다. 리뷰 대상 결정과 자원·일정 배정은 관리자의 몫이다."]},{"id":"H16","src":"H","no":16,"ch":3,"topic":"리뷰 4유형의 목적·주도자·형식성","klevel":"K2","key":["Informal review","Walkthrough","Technical review","Inspection","Formality"],"q":"리뷰 유형에 대한 설명으로 **옳은 것을 모두 고른** 것은?\nㄱ. 비공식 리뷰는 정해진 절차나 문서화 없이 저비용으로 수행할 수 있다.\nㄴ. 워크스루는 작성자가 주도하며, 참가자의 이해도 향상과 합의를 목적으로 한다.\nㄷ. 기술 리뷰는 조정자가 주도하는 가장 공식적인 리뷰로, 규칙·체크리스트·측정 지표를 사용한다.\nㄹ. 인스펙션은 개별 준비가 필수이며, 결함을 최대한 많이 발견하는 것을 목적으로 한다.\nㅁ. 리뷰는 형식성이 높을수록 좋으므로 상황과 무관하게 인스펙션을 선택해야 한다.","opts":["ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄹ, ㅁ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"answer":2,"why":"기술 리뷰는 기술 전문가(동료)가 참여해 기술적 결함과 합의를 도출하는 중간 형식성의 리뷰이고, 조정자가 주도하며 규칙·체크리스트·측정 지표를 쓰는 가장 공식적인 리뷰는 인스펙션이다. 따라서 ㄷ은 인스펙션의 설명을 기술 리뷰에 붙인 것이고, ㅁ은 형식성이 항상 좋다는 오해다. ㄱ·ㄴ·ㄹ이 옳다.","trap":"ㄷ은 문장의 절반(체크리스트·측정 지표)이 인스펙션 설명이라 매우 그럴듯하다. '가장 공식적 = 인스펙션'을 기억하지 못하면 ④를 고르게 된다. ㅁ은 '형식성이 높을수록 좋다'는 그럴듯한 원칙처럼 포장한 함정이다.","optwhy":["ㅁ이 들어 있어 오답이다. 목적과 상황에 맞는 유형을 골라야 하며, 형식성이 높은 리뷰가 항상 낫지는 않다.","ㄱ이 빠졌고 ㅁ이 들어 있다. 비공식 리뷰의 저비용·무절차 특성도 옳은 설명이다.","정답. 비공식·워크스루·인스펙션의 설명이 모두 옳고, 기술 리뷰를 인스펙션처럼 서술한 ㄷ과 형식성 만능론 ㅁ을 걸러냈다.","ㄷ이 들어 있어 오답이다. 조정자 주도·체크리스트·측정 지표는 인스펙션의 특성이다."]},{"id":"H17","src":"H","no":17,"ch":3,"topic":"리뷰의 성공 요인","klevel":"K3","key":["Review success factors","Small chunks","Preparation time","Blameless culture"],"q":"200페이지 설계서를 하루 만에 리뷰했고, 결함 지적이 작성자에 대한 비난으로 받아들여졌으며, 리뷰 목적이 '결함 발견'인지 '승인'인지 참가자마다 달랐다. 리뷰의 개선 방향으로 **가장 적절한** 것은?","opts":["문서를 작은 단위로 나누고 충분한 준비 시간을 주며, 리뷰 목적과 진입·출구 기준을 명확히 하고 비난 없는 문화를 만든다.","비공식 리뷰를 인스펙션으로 바꾸면 세 문제가 모두 해결된다.","리뷰어 수를 늘리고 리뷰 시간을 더 줄인다.","리뷰에서 결함을 찾지 말고 동적 테스트로만 찾는다."],"answer":0,"why":"리뷰의 성공 요인은 명확한 목적, 적합한 리뷰 유형, 작은 단위로 나눈 산출물, 충분한 준비 시간과 교육, 경영진 지원, 체크리스트, 비난 없는 문화다. 이 사례는 크기·준비 시간·목적 불명확·비난 문화가 겹친 것이므로 네 가지를 함께 고쳐야 한다. 형식성을 높이는 것만으로는 해결되지 않는다.","trap":"'형식성이 높으면 좋다'는 발상이 ②를 유인한다. 인스펙션은 준비 시간과 교육이 더 필요하므로 이 사례에서는 문제를 키울 수 있다. ③은 리뷰어를 늘리면 오히려 준비 부담과 소통 비용이 커진다는 점을 놓쳤다.","optwhy":["정답. 크기 축소, 준비 시간, 목적·기준 명확화, 비난 없는 문화라는 성공 요인을 모두 건드렸다.","리뷰 유형만 바꿔서는 목적 불명확·비난 문화·준비 부족이 해결되지 않는다.","리뷰어를 늘리면 조정 비용이 커지고, 시간을 줄이면 준비가 더 부족해진다.","리뷰는 동적 테스트보다 앞선 시점에 결함을 찾는 활동으로, 동적 테스트로 대체할 수 없다."]},{"id":"H18","src":"H","no":18,"ch":3,"topic":"정적 분석의 특성과 오탐 · 리뷰와의 관계","klevel":"K3","key":["Static analysis","False positive","Cyclomatic complexity","Coding standard","Human review"],"q":"CI 파이프라인에 정적 분석 도구를 붙였더니 빌드마다 경고가 300건 나왔다. 팀은 모든 경고를 오류로 처리해 빌드를 막으려 한다. 정적 분석 도구의 특성과 적절한 활용으로 **가장 알맞은** 것은?","opts":["정적 분석은 테스트 케이스를 실행해 실제 결과와 기대 결과를 비교하는 도구다.","정적 분석 경고는 모두 실제 결함이므로 전부 즉시 수정해야 한다.","정적 분석은 사람 리뷰를 대체하므로 코드 리뷰를 없앨 수 있다.","정적 분석은 코드를 실행하지 않고 표준 위반·도달 불가 코드·복잡도 등을 찾으며, 오탐이 있으므로 위험도 높은 규칙을 선별해 게이트로 쓰고 나머지는 검토 대상으로 관리한다."],"answer":3,"why":"정적 분석은 실행 없이 코드·모델을 분석해 코딩 표준 위반, 도달 불가 코드, 널 포인터, 자료·제어 흐름 오류, 순환 복잡도, 보안 취약점 등을 찾는다. 도구는 오탐(false positive)을 내므로 심각도·규칙을 선별해 게이트로 쓰고, 나머지는 리뷰·수정 계획으로 관리한다. 정적 분석은 사람 리뷰를 대체하지 못한다.","trap":"'경고 300건 = 결함 300건'이 ②를 유인한다. 오탐·미탐 때문에 도구 결과는 선별이 필요하다. ①은 정적 분석과 동적 테스트를 혼동시킨 함정이다.","optwhy":["정적 분석은 코드를 실행하지 않는다. 실행 결과 비교는 동적 테스팅이다.","오탐이 섞여 있어 전부 결함이 아니다. 전부 빌드 차단하면 개발 흐름이 멈춘다.","도구는 판단·맥락·설계 의도를 읽지 못한다. 사람 리뷰를 대체하지 못한다.","정답. 실행하지 않는 분석, 오탐 가능성, 규칙 선별 게이트라는 세 요소를 모두 담았다."]},{"id":"H19","src":"H","no":19,"ch":4,"topic":"동등 분할 · 다중 필드 최소 테스트 케이스","klevel":"K3","key":["Equivalence partitioning","Valid partitions","Minimum test cases","Combining values"],"q":"배송 주문 화면에 두 개의 입력 필드가 있다.\n· **배송 지역**: 수도권 / 충청권 / 영남권 / 호남권 / 제주·도서 — 5개 선택지, 지역마다 배송비가 다르다.\n· **결제 수단**: 신용카드 / 계좌이체 / 간편결제 — 3개 선택지, 수단마다 수수료가 다르다.\n두 필드에 **동등 분할**만 적용해 모든 **유효** 동등 파티션을 최소 테스트 케이스로 커버하려면 몇 개가 필요한가?","opts":["3개","5개","8개","15개"],"answer":1,"why":"배송 지역의 유효 파티션은 5개, 결제 수단은 3개다. 하나의 테스트 케이스가 두 필드의 값 하나씩을 동시에 가지므로 최소 테스트 케이스 수는 각 필드 파티션 수의 최댓값인 max(5, 3) = 5개다. 파티션마다 대표값 1개씩만 쓰면 되고, 5개 케이스로 지역 5개와 수단 3개를 모두 한 번 이상 커버한다.","trap":"합(8)과 곱(15)이 모두 그럴듯하다. 동등 분할은 조합을 모두 만들지 않고 파티션 대표값을 쓰므로 곱이 아니고, 한 케이스가 두 필드를 함께 가지므로 합도 아니다. 최댓값이 정답이다.","optwhy":["3개는 결제 수단의 파티션 수다. 이 경우 지역 파티션 2개가 커버되지 않는다.","정답. max(5, 3) = 5개로 두 필드의 모든 유효 파티션을 커버한다.","8개는 5 + 3의 합이다. 한 케이스가 두 필드의 값을 함께 가지므로 필드별 케이스를 더할 필요가 없다.","15개는 5 × 3의 전체 조합 수다. 동등 분할은 조합 전수가 아니라 파티션 대표값으로 커버한다."]},{"id":"H20","src":"H","no":20,"ch":4,"topic":"다중 구간 경계값 분석 · 2-value vs 3-value 개수","klevel":"K3","key":["Boundary value analysis","Two-value BVA","Three-value BVA","Boundary","Adjacent partition"],"q":"회원 할인액을 계산하는 [누적 구매액] 필드는 **0원 이상 1,000원 이하**만 유효하고, 다음 세 구간으로 처리된다.\n· 0 ~ 99원: 할인 없음   · 100 ~ 499원: 5% 할인   · 500 ~ 1,000원: 10% 할인\n경계값 분석을 적용할 때 **2-value와 3-value에서 사용하는 테스트 값의 개수**로 옳은 것은?\n(경계값은 0, 99, 100, 499, 500, 1000이다. 2-value는 경계값과 인접 파티션의 값 하나, 3-value는 경계값−1·경계값·경계값+1을 쓰고, 서로 같은 값은 한 번만 센다.)","opts":["2-value 6개, 3-value 12개","2-value 12개, 3-value 18개","2-value 8개, 3-value 14개","2-value 8개, 3-value 18개"],"answer":2,"why":"2-value: 0은 −1과, 99와 100은 서로를, 499와 500은 서로를, 1000은 1001과 짝지어 −1, 0, 99, 100, 499, 500, 1000, 1001의 8개가 된다. 3-value: 0은 −1·0·1, 99는 98·99·100, 100은 99·100·101, 499는 498·499·500, 500은 499·500·501, 1000은 999·1000·1001이므로 겹치는 값을 한 번만 세면 14개다.","trap":"경계 6개 × 3 = 18개로 계산하면 ④를 고르게 된다. 99와 100, 499와 500처럼 맞닿은 경계는 이웃값이 겹치므로 중복을 빼야 한다. 또한 구간이 3개라고 경계를 3개로 세면 ①이 된다.","optwhy":["6개·12개는 경계를 3개로 센 결과다. 구간이 3개여도 경계값은 6개(0, 99, 100, 499, 500, 1000)다.","2-value는 경계당 2개라 최대 12개지만, 같은 값이 겹쳐 8개다.","정답. 2-value 8개(−1, 0, 99, 100, 499, 500, 1000, 1001), 3-value 14개(중복 제거 후).","18개는 6 × 3의 단순 곱이다. 맞닿은 경계(99·100, 499·500)에서 98·101·498·501이 겹쳐 14개가 된다."]},{"id":"H21","src":"H","no":21,"ch":4,"topic":"구문·분기 커버리지 최소 테스트 케이스 (단독 if + 중첩 if-else + 조기 return)","klevel":"K3","key":["Statement coverage","Branch coverage","Nested if-else","Early return","Minimum test cases"],"q":"다음 의사코드에는 단독 if, 중첩 if-else, 조기 return이 섞여 있다. 실행 가능한 문장은 2, 6, 9, 13, 15번이다. 테스트 케이스를 최소로 설계할 때, **구문 커버리지 100%** 에 필요한 케이스 수와 **분기 커버리지 100%** 에 필요한 케이스 수의 조합으로 옳은 것은?","opts":["구문 3개, 분기 4개","구문 2개, 분기 3개","구문 3개, 분기 3개","구문 4개, 분기 5개"],"answer":0,"why":"구문: 2는 A>0, 6은 B>0이고 C>0, 9는 B>0이고 C≤0이고 D>0, 13은 B≤0, 15는 B>0이고 C≤0이고 D≤0일 때 실행된다. TC1(A>0, B>0, C>0)로 2·6, TC2(B>0, C≤0, D>0)로 9·15, TC3(B≤0)로 13을 덮어 3개면 100%다. 분기: (A>0)·(B>0)·(C>0)·(D>0)의 참·거짓 8개가 필요하다. TC1이 A참·B참·C참, TC2가 A거짓·C거짓·D참, TC3이 B거짓을 덮지만 D거짓이 남아 TC4(B>0, C≤0, D≤0)가 필요하다. 따라서 4개다.","trap":"조기 return 때문에 한 케이스가 여러 문장을 동시에 덮지 못한다는 점, 그리고 분기 커버리지가 구문 커버리지보다 케이스를 더 많이 요구할 수 있다는 점이 함정이다. 문장 수만 세어 '구문 5개'로 가거나, TC2가 15번까지 간다는 사실을 놓치면 오답이 된다.","optwhy":["정답. TC1·TC2·TC3으로 문장 5개를 모두 덮고, D거짓을 위해 TC4가 하나 더 필요하다.","구문 2개는 불가능하다. B>0 경로는 6과 9를 동시에 지날 수 없고, 13은 B≤0 케이스가 따로 필요하다.","D>0의 거짓 분기를 덮는 케이스가 빠졌다. TC1·TC2·TC3은 D참 또는 D 미평가만 만든다.","문장 5개를 케이스마다 하나씩 센 과대 계산이다. 한 케이스가 여러 문장을 덮을 수 있다."],"html":"<pre class=\"code\">1  IF (A &gt; 0) THEN\n2      X = 1\n3  END IF\n4  IF (B &gt; 0) THEN\n5      IF (C &gt; 0) THEN\n6          RETURN \"OK\"\n7      ELSE\n8          IF (D &gt; 0) THEN\n9              X = 2\n10         END IF\n11     END IF\n12 ELSE\n13     RETURN \"NO\"\n14 END IF\n15 RETURN \"END\"</pre>"},{"id":"H22","src":"H","no":22,"ch":4,"topic":"상태 전이 · 0-switch vs 1-switch (자기 전이·무효 전이 포함)","klevel":"K3","key":["State transition testing","0-switch coverage","1-switch coverage","Self-loop","Invalid transition"],"q":"다음 주문 처리 시스템의 유효 전이와 무효 전이가 주어졌다. **0-switch(유효 전이) 커버리지**와 **1-switch 커버리지**를 100% 달성하기 위해 각각 실행해야 하는 전이(시퀀스)의 개수로 옳은 것은?","opts":["0-switch 12개, 1-switch 20개","0-switch 9개, 1-switch 17개","0-switch 12개, 1-switch 17개","0-switch 9개, 1-switch 20개"],"answer":1,"why":"0-switch는 모든 유효 전이를 한 번씩 실행하므로 9개다. 1-switch는 연결된 전이 쌍의 수이므로 각 전이의 도착 상태에서 나가는 유효 전이 수를 세어 더한다. S1→S2 뒤 2개, S1→S1 뒤 2개, S2→S3 뒤 2개, S2→S4 뒤 1개, S3→S3 뒤 2개, S3→S1 뒤 2개, S4→S5 뒤 2개, S5→S2 뒤 2개, S5→S1 뒤 2개로 합계 17개다.","trap":"무효 전이 3개를 커버리지 분자·분모에 넣으면 12개·20개가 된다. 무효 전이는 오류 처리 확인용이며 유효 전이 커버리지에 포함하지 않는다. 자기 전이(S1→S1, S3→S3)를 '전이가 아니다'라며 빼면 쌍의 수가 줄어 15개가 되는데, 자기 전이도 유효 전이이자 다음 전이의 시작점이다.","optwhy":["무효 전이를 0-switch와 1-switch 양쪽에 넣은 결과다. 둘 다 제외해야 한다.","정답. 유효 전이 9개, 연결된 유효 전이 쌍 17개.","12개는 무효 전이 3개를 0-switch에 더한 값이다. 무효 전이는 커버리지 계산에서 제외한다.","20개는 무효 전이까지 전이 쌍에 넣은 값이다. 17 + 3 = 20으로 계산한 함정이다."],"html":"<table class=\"tbl\"><tr><th>구분</th><th>전이</th></tr><tr><td>유효</td><td class=\"wrap\">S1→S2, S1→S1(자기 자신), S2→S3, S2→S4, S3→S3(자기 자신), S3→S1, S4→S5, S5→S2, S5→S1</td></tr><tr><td>무효</td><td class=\"wrap\">S1→S3, S2→S2, S4→S1</td></tr></table>"},{"id":"H23","src":"H","no":23,"ch":4,"topic":"결정 테이블 축소 · 모순 규칙 판별","klevel":"K3","key":["Decision table","Don't care","Inconsistent rules","Duplicate rules","Collapsing"],"q":"주문 할인 규칙을 결정 테이블로 작성했다. C1=VIP 회원, C2=구매액 10만원 이상, C3=쿠폰 사용.\n· R1: Y, Y, Y → A1   · R2: Y, Y, N → A1   · R3: Y, N, Y → A2   · R4: Y, N, N → A3\n· R5: N, Y, Y → A3   · R6: N, Y, Y → A2   · R7: N, N, Y → A4   · R8: N, N, N → A4\n이 테이블에 대한 설명으로 **옳은** 것은?","opts":["R1·R2와 R5·R6을 모두 합칠 수 있어 축소 후 규칙은 5개다.","R5와 R6은 완전히 중복된 규칙이므로 하나를 삭제하면 되고, 축소 후 규칙은 5개다.","모순이 있는 테이블은 축소할 수 없으므로 규칙은 8개 그대로다.","R1과 R2는 C3만 다르고 액션이 같으므로 C3을 '–'로 축소할 수 있고, R5와 R6은 조건이 같지만 액션이 달라 모순이므로 축소 전에 규칙을 확정해야 한다. 축소 후 규칙은 6개다."],"answer":3,"why":"무관 조건('–')으로 합칠 수 있는 것은 '조건 하나만 다르고 나머지 조건과 액션이 모두 같은' 규칙이다. R1·R2는 C3만 다르고 액션이 A1으로 같아 하나가 되고, R7·R8도 C3만 다르고 A4로 같아 하나가 된다. R5·R6은 조건이 완전히 같은데 액션이 A3과 A2로 달라 모순(inconsistent)이므로, 어느 쪽이 맞는지 비즈니스 결정으로 확정하기 전에는 합칠 수 없다. 그래서 8 − 2 = 6개다.","trap":"R5·R6을 '중복이니 하나 삭제'로 처리하면 ②가 된다. 조건이 같고 액션이 다르면 중복이 아니라 모순이며, 임의로 하나를 지우면 잘못된 규칙이 남을 수 있다. ①은 모순 규칙까지 축소된다고 본 함정이다.","optwhy":["R5·R6은 액션이 달라 합칠 수 없다. 조건이 같고 액션이 다르면 모순이다.","모순 규칙은 중복이 아니다. 하나를 지우면 어느 액션이 옳은지 확인하지 않은 채 규칙이 사라진다.","모순 규칙이 있어도 나머지 규칙은 축소할 수 있다. 축소 가능 여부는 규칙별로 판단한다.","정답. R1·R2와 R7·R8만 합쳐 6개가 되고, R5·R6은 모순이라 확정이 필요하다."]},{"id":"H24","src":"H","no":24,"ch":4,"topic":"블랙박스·화이트박스·경험 기반·협업 기반 분류","klevel":"K2","key":["Black-box technique","White-box technique","Experience-based technique","Collaboration-based approach","Checklist-based testing"],"q":"다음 테스트 활동을 기법 분류와 연결한 것으로 **옳은 것을 모두 고른** 것은?\nㄱ. 소스 코드의 분기문이 참·거짓으로 실행되었는지 측정한다 — 화이트박스\nㄴ. 요구사항의 상태 다이어그램에서 모든 유효 전이를 실행한다 — 블랙박스\nㄷ. 과거 결함 이력과 도메인 경험으로 결함이 의심되는 입력을 집중 공략한다 — 경험 기반\nㄹ. 사용자 스토리의 인수 조건을 개발자·테스터·비즈니스가 함께 합의한다 — 협업 기반\nㅁ. 체크리스트 기반 테스팅은 명세에서 파티션을 도출하므로 블랙박스 기법이다.","opts":["ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"answer":2,"why":"화이트박스는 코드 구조를 근거로 하고(ㄱ), 상태 전이는 명세의 상태 모델을 근거로 하는 블랙박스 기법이다(ㄴ). 경험 기반은 테스터의 경험·직관을 근거로 하고(ㄷ), 협업 기반은 인수 조건을 함께 합의하는 접근이다(ㄹ). 체크리스트 기반 테스팅은 경험 기반 기법이지 블랙박스가 아니므로 ㅁ은 틀렸다.","trap":"ㅁ은 '체크리스트 = 명세 확인'처럼 들려 블랙박스로 분류하기 쉽다. ISTQB의 4분류에서 체크리스트 기반은 경험 기반 기법이다. ㅁ을 넣은 ④가 가장 흔한 오답이다.","optwhy":["ㄴ(상태 전이 = 블랙박스)이 빠졌다. 상태 전이 테스팅은 명세 기반 블랙박스 기법이다.","ㄱ이 빠졌고 ㅁ이 들어 있다. 분기 실행 측정은 화이트박스의 대표 예이고, 체크리스트는 블랙박스가 아니다.","정답. ㄱ~ㄹ의 분류가 모두 정확하다.","ㅁ이 들어 있어 오답이다. 체크리스트 기반은 경험 기반 기법이다."]},{"id":"H25","src":"H","no":25,"ch":4,"topic":"경계값 분석 · 값의 단위(날짜·문자 수·소수·정수)","klevel":"K3","key":["Boundary value","Granularity","Integer boundary","Decimal boundary"],"q":"경계값 분석에서 **경계와 인접값을 고르는 방식**으로 **옳지 않은** 것은?\n(정수 필드는 ±1, 소수 둘째 자리 필드는 ±0.01을 인접값으로 본다.)","opts":["나이(정수 1~120): 0.5, 1, 120, 120.5","가입일(유효 2026-01-01 ~ 2026-12-31, 일 단위): 2025-12-31, 2026-01-01, 2026-12-31, 2027-01-01","닉네임 길이(8~20자): 7, 8, 20, 21","상품 가격(0.00 ~ 999.99, 소수 둘째 자리): -0.01, 0.00, 999.99, 1000.00"],"answer":0,"why":"경계의 인접값은 그 필드가 받아들이는 값의 단위로 정한다. 나이는 정수 필드이므로 경계 1과 120의 인접값은 0과 121이어야 한다. 0.5나 120.5는 정수 필드에 존재할 수 없는 값이라 경계 직전·직후를 검증하지 못한다. 날짜는 일 단위, 길이는 문자 수, 소수 둘째 자리 가격은 0.01 간격이므로 나머지 세 보기는 옳다.","trap":"'경계 바로 바깥'이라는 말에 끌려 정수 필드에 0.5를 넣는 것이 함정이다. 반대로 소수 필드에 ±1을 쓰는 것도 틀린다. 필드가 허용하는 값의 단위가 인접값의 간격을 결정한다.","optwhy":["옳지 않은 예시다. 정수 필드의 인접값은 0과 121이어야 하며, 0.5와 120.5는 입력 자체가 불가능한 값이다.","옳은 예시다. 일 단위 필드이므로 경계 하루 전후(2025-12-31, 2027-01-01)를 쓴다.","옳은 예시다. 길이는 문자 수 단위이므로 7자와 21자가 경계 인접값이다.","옳은 예시다. 소수 둘째 자리 필드이므로 0.01 간격의 -0.01과 1000.00을 쓴다."]},{"id":"H26","src":"H","no":26,"ch":4,"topic":"경험 기반 기법의 적용과 한계","klevel":"K2","key":["Error guessing","Exploratory testing","Checklist-based testing","Session-based test management","Test charter"],"q":"경험 기반 기법에 대한 설명으로 **옳은 것을 모두 고른** 것은?\nㄱ. 오류 추정은 과거 결함 데이터·체크리스트·도메인 경험을 근거로 결함이 의심되는 영역을 집중 공략한다.\nㄴ. 탐색적 테스팅은 차터와 타임박스로 관리하고, 세션 시트와 디브리핑으로 결과를 남긴다.\nㄷ. 체크리스트 기반 테스팅은 체크리스트 항목이 없으면 결함을 찾을 수 없으므로 커버리지를 측정할 필요가 없다.\nㄹ. 경험 기반 기법은 테스터의 역량에 의존하므로 재현성과 커버리지 측정이 어려울 수 있다.\nㅁ. 경험 기반 기법은 명세를 근거로 하므로 블랙박스 기법의 한 종류다.","opts":["ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"answer":3,"why":"오류 추정은 경험·결함 이력으로 의심 지점을 공략하고(ㄱ), 탐색적 테스팅은 차터·타임박스·세션 시트·디브리핑으로 관리한다(ㄴ). 경험 기반은 테스터 역량 의존도가 높아 재현성과 커버리지 측정이 어렵다(ㄹ). 체크리스트 기반도 경험 기반 기법이며 커버리지 측정이 불가능한 것은 아니고(ㄷ 오류), 명세 근거가 아니므로 블랙박스로 분류하지 않는다(ㅁ 오류).","trap":"ㄷ은 '체크리스트에 없으면 못 찾는다'는 그럴듯한 문장 뒤에 '커버리지를 측정할 필요가 없다'를 붙여 놓았다. 경험 기반이라도 차터·체크리스트 단위로 커버리지와 진행을 관리할 수 있다. ㅁ은 분류를 흔드는 함정이다.","optwhy":["ㄷ이 들어 있어 오답이다. 경험 기반 기법도 체크리스트·차터 단위로 커버리지를 측정·관리한다.","ㅁ이 들어 있어 오답이다. 경험 기반은 명세 기반(블랙박스)과 별개의 분류다.","ㄴ(탐색적 테스팅의 관리 방식)이 빠졌고 ㄷ이 들어 있다. 차터·타임박스·세션 시트는 옳은 설명이다.","정답. ㄱ·ㄴ·ㄹ이 옳고, ㄷ·ㅁ이 틀렸다."]},{"id":"H27","src":"H","no":27,"ch":4,"topic":"동등 분할 커버리지 계산 · 무효값 분리 원칙","klevel":"K3","key":["Equivalence partition coverage","Invalid partition","Masking","Test case design"],"q":"[주문 수량] 필드는 정수 1~100만 유효하다. 동등 분할로 유효 파티션 3개(1~33, 34~66, 67~100)와 무효 파티션 2개(0 이하, 101 이상)를 식별했고, 다음 4개의 테스트 케이스를 실행했다.\n· TC1: 수량 10   · TC2: 수량 40   · TC3: 수량 0과 150을 함께 입력   · TC4: 수량 80\n**동등 분할 커버리지**와 이에 대한 판단으로 **옳은** 것은?","opts":["60% — 무효 파티션은 유효 파티션의 절반 무게로 계산한다.","80% — 무효 파티션은 한 테스트 케이스에 하나씩만 넣어야 하므로 TC3을 0과 150으로 분리해야 한다.","100% — 다섯 파티션을 모두 실행했으므로 추가 테스트가 필요 없다.","80% — 무효 파티션은 커버리지 계산에서 제외하므로 실제 커버리지는 100%다."],"answer":1,"why":"TC1·TC2·TC4가 유효 파티션 3개를 덮고, TC3은 0(0 이하)만 검증하게 되어 무효 파티션 1개를 덮는다. 따라서 5개 중 4개로 4 ÷ 5 = 80%다. 무효값을 한 케이스에 여러 개 넣으면 첫 오류에서 검증이 멈춰 나머지 무효값이 검증되지 않을 수 있으므로(masking), 무효 파티션은 하나씩 분리해 테스트해야 한다.","trap":"TC3에 0과 150이 모두 들어 있으니 두 파티션을 덮었다고 세면 100%가 된다(③). 동등 분할의 '무효값은 한 번에 하나씩' 원칙을 알아야 80%로 계산한다. ④는 무효 파티션을 분모에서 빼는 꼼수다.","optwhy":["동등 분할에는 파티션별 가중치 개념이 없다. 모든 파티션은 동등하게 1개로 센다.","정답. 4/5 = 80%이고, 무효값 결합은 마스킹 때문에 분리해야 한다.","TC3은 첫 오류에서 멈출 수 있어 두 무효 파티션을 모두 검증했다고 볼 수 없다.","무효 파티션도 커버리지 분모에 포함한다. 제외하면 커버리지를 과대평가한다."]},{"id":"H28","src":"H","no":28,"ch":4,"topic":"결정 테이블 · 무관 조건이 겹칠 때 최소 테스트 케이스","klevel":"K3","key":["Decision table","Don't care","Overlapping rules","Minimum test cases"],"q":"조건 3개로 만든 결정 테이블을 무관 조건('–')으로 축소한 결과다.\n· R1: C1=Y, C2=–, C3=Y → A1\n· R2: C1=Y, C2=Y, C3=– → A1\n· R3: C1=Y, C2=N, C3=N → A2\n· R4: C1=N, C2=–, C3=– → A3\n모든 규칙을 커버하는 **최소 테스트 케이스 수**와 그 근거로 옳은 것은?","opts":["2개 — R3과 R4는 하나의 케이스로 커버된다.","4개 — 규칙마다 테스트 케이스 1개가 필요하다.","3개 — C1=Y, C2=Y, C3=Y인 케이스가 R1과 R2를 동시에 커버하므로 3개면 된다.","6개 — 무관 조건 자리에 들어갈 수 있는 값 조합을 모두 채워야 한다."],"answer":2,"why":"R1은 C1=Y이고 C3=Y인 모든 조합을, R2는 C1=Y이고 C2=Y인 모든 조합을 포함한다. C1=Y, C2=Y, C3=Y인 한 케이스가 두 규칙을 동시에 만족한다. R3은 C1=Y, C2=N, C3=N으로 따로, R4는 C1=N인 아무 조합(예: N, N, N)으로 커버되므로 최소 3개다. 축소된 규칙 수와 최소 테스트 케이스 수가 항상 같지는 않다.","trap":"'규칙 4개 = 케이스 4개'가 ②를 유인한다. 무관 조건 때문에 규칙이 서로 겹칠 수 있고, 한 케이스가 여러 규칙을 만족하면 케이스 수가 줄어든다. ①은 R3(Y,N,N)과 R4(N,–,–)가 C1에서 이미 갈리므로 성립하지 않는다.","optwhy":["R3은 C1=Y, R4는 C1=N이라 한 케이스가 둘을 동시에 만족할 수 없다.","규칙 수와 케이스 수를 같다고 본 계산이다. R1과 R2는 한 케이스로 함께 커버된다.","정답. (Y,Y,Y)가 R1·R2를 동시에 덮고, R3은 (Y,N,N), R4는 (N,N,N)으로 3개다.","무관 조건의 모든 조합을 채우는 것은 결정 테이블 테스팅의 요구가 아니다. 규칙당 한 번이면 충분하다."]},{"id":"H29","src":"H","no":29,"ch":4,"topic":"상황별 테스트 기법 선택","klevel":"K3","key":["Technique selection","Decision table","State transition","Boundary value analysis","Error guessing"],"q":"다음 네 상황에 가장 적합한 기법을 연결한 것으로 **옳은** 것은?\n㉠ 자동차 보험료: 운전 경력(3년 미만/3년 이상), 사고 이력(0회/1회 이상), 차량 등급(1~3등급)의 조합마다 보험료와 가입 가능 여부가 달라진다.\n㉡ 엘리베이터 제어: 정지·문 열림·이동·고장 상태에서 버튼과 센서 입력에 따라 다음 상태가 정해진다.\n㉢ 비밀번호 필드: 8~20자이면서 대문자와 숫자를 각각 1개 이상 포함해야 한다.\n㉣ 결제 모듈: 과거 결함의 70%가 0원·음수 금액과 날짜 말일에서 발생했다는 이력이 있다.","opts":["㉠ 동등 분할 · ㉡ 상태 전이 · ㉢ 동등 분할 · ㉣ 체크리스트 기반","㉠ 결정 테이블 · ㉡ 결정 테이블 · ㉢ 경계값 분석 · ㉣ 탐색적 테스팅","㉠ 경계값 분석 · ㉡ 상태 전이 · ㉢ 결정 테이블 · ㉣ 사용자 스토리 기반","㉠ 결정 테이블 · ㉡ 상태 전이 · ㉢ 경계값 분석+동등 분할 · ㉣ 오류 추정"],"answer":3,"why":"조건 조합이 결과를 결정하면 결정 테이블(㉠), 상태와 이벤트로 다음 상태가 정해지면 상태 전이(㉡), 길이 경계와 문자 종류 조건이 겹치면 경계값 분석+동등 분할(㉢), 과거 결함 이력으로 의심 지점을 공략하면 오류 추정(㉣)이다. ㉠은 조합이 핵심이라 동등 분할만으로는 규칙 간 상호작용을 놓친다.","trap":"㉠을 '등급·경력의 파티션'으로 보고 동등 분할이라 답하면 ①이 된다. 조합별 결과가 다를 때는 결정 테이블이 맞다. ㉣을 '탐색적'으로 보는 ②도 그럴듯하지만, 이력이라는 근거가 있으므로 오류 추정이 더 정확하다.","optwhy":["㉠의 조합 상호작용을 동등 분할로는 잡지 못하고, ㉢도 문자 종류 조건을 놓친다.","㉡은 상태 기반이므로 결정 테이블이 아니고, ㉣은 이력 기반이라 탐색적보다 오류 추정이 맞다.","㉠·㉢을 뒤바꿨다. 보험료는 조합 규칙, 비밀번호는 길이·문자 조건이다.","정답. 조합→결정 테이블, 상태→상태 전이, 길이·문자 조건→경계값+동등 분할, 결함 이력→오류 추정."]},{"id":"H30","src":"H","no":30,"ch":5,"topic":"3점 추정(PERT) · 표준편차 · 95% 신뢰구간 판단","klevel":"K3","key":["Three-point estimation","PERT","Standard deviation","Confidence interval"],"q":"테스트 실행 기간을 3점 추정으로 산정했다. 낙관치 4일, 최빈치 10일, 비관치 28일이고, 팀은 계획에 20일을 넣으려 한다. **PERT 기대 기간**·**표준편차**·**95% 신뢰구간**과 20일 계획에 대한 판단으로 옳은 것은?\n(E = (O + 4M + P) / 6, σ = (P − O) / 6, 95% 신뢰구간 = E ± 2σ)","opts":["12일 · σ 4일 · 4~20일 — 20일은 95% 구간의 상한이므로 계획 기간으로 삼을 수 있다","12일 · σ 4일 · 8~16일 — 20일은 구간을 넘으므로 위험한 계획이다","14일 · σ 4일 · 6~22일 — 20일은 구간 안이므로 안전한 계획이다","12일 · σ 2일 · 8~16일 — 20일은 구간을 넘으므로 위험한 계획이다"],"answer":0,"why":"E = (4 + 4×10 + 28) / 6 = 72 / 6 = 12일이다. σ = (28 − 4) / 6 = 4일이고, 95% 신뢰구간은 E ± 2σ = 12 ± 8이므로 4일에서 20일이다. 20일은 이 구간의 상한과 같으므로 95% 신뢰 수준에서 계획 기간으로 삼을 수 있는 범위의 끝이다. 표준편차를 6이 아니라 2로 나누거나, 신뢰구간에 σ를 한 번만 더하면 오답이 된다.","trap":"E는 맞게 구하고 신뢰구간에 ±σ만 적용하면 8~16일이 되어 20일을 '위험'으로 잘못 판정한다. σ를 (P−O)/2로 계산하는 함정도 있고, 최빈치를 4배가 아니라 4M으로 넣는 과정을 건너뛰면 14일이 나온다.","optwhy":["정답. E 12일, σ 4일, 12 ± 2×4 = 4~20일이며 20일은 구간 상한이다.","σ는 맞지만 95% 구간에 2σ가 아니라 σ를 한 번만 적용했다.","E 계산이 틀렸다. (4+40+28)/6 = 12이며 14가 아니다.","σ를 (P−O)/2로 계산했다. 표준편차는 (비관치 − 낙관치)/6 = 4일이다."]},{"id":"H31","src":"H","no":31,"ch":5,"topic":"애자일 테스팅 사분면 Q1~Q4 경계","klevel":"K2","key":["Agile testing quadrants","Technology-facing","Business-facing","Supporting the team","Critiquing the product"],"q":"애자일 테스팅 사분면(Q1~Q4)에 테스트 활동을 배치한 것으로 **옳지 않은** 것은?","opts":["Q2(비즈니스 지향·팀 지원): 사용자 스토리 인수 조건 테스트, 프로토타입 검증, 기능 테스트","Q3(비즈니스 지향·제품 비평): 탐색적 테스팅, 사용성 테스트, 사용자 수용 테스트","Q4(기술 지향·제품 비평): 부하 테스트, 침투(보안) 테스트, 사용성 테스트","Q1(기술 지향·팀 지원): 단위 테스트, 컴포넌트 통합 테스트, 자동화된 회귀 테스트"],"answer":2,"why":"Q1은 팀을 지원하는 기술 지향(단위·컴포넌트 통합·자동화), Q2는 팀을 지원하는 비즈니스 지향(스토리 인수 조건·프로토타입·기능), Q3은 제품을 비평하는 비즈니스 지향(탐색적·사용성·UAT), Q4는 제품을 비평하는 기술 지향(성능·부하·보안·복구성)이다. 사용성 테스트는 Q3이므로 Q4에 넣은 ③이 틀렸다.","trap":"Q4에 '사용성'을 넣는 것이 가장 흔한 함정이다. 사용성은 사용자가 느끼는 품질이라 비즈니스 지향(Q3)으로 간다. 또 Q1의 '자동화된 회귀 테스트'를 Q2로 옮기고 싶은 유혹도 있다.","optwhy":["옳은 배치다. 스토리 인수 조건과 프로토타입 검증은 비즈니스 지향·팀 지원(Q2)이다.","옳은 배치다. 탐색적·사용성·UAT는 제품을 비평하는 비즈니스 지향(Q3)이다.","옳지 않은 배치다. 부하·침투는 Q4가 맞지만 사용성 테스트는 Q3이다.","옳은 배치다. 낮은 수준의 기술 지향 테스트는 팀을 지원하는 Q1에 속한다."]},{"id":"H32","src":"H","no":32,"ch":5,"topic":"리스크 대응 전략 (완화·수용·전이·회피)","klevel":"K3","key":["Product risk","Project risk","Mitigation","Acceptance","Transference","Avoidance"],"q":"리스크 유형과 대응(대응 전략)의 연결로 **옳지 않은** 것은?","opts":["규제 변경으로 인한 재설계 가능성(프로젝트 리스크) — 위험을 감수하기로 하고 비상 예비비만 확보한다: 수용(acceptance)","테스트 환경 부족(프로젝트 리스크) — 테스트 범위를 오히려 늘려 더 많이 테스트한다: 회피(avoidance)","공급업체 납기 지연(프로젝트 리스크) — 위약 조항이 있는 계약을 체결해 손실을 외부로 옮긴다: 전이(transference)","결제 모듈의 보안 취약점(제품 리스크) — 침투 테스트와 코드 리뷰를 추가로 수행한다: 완화(mitigation)"],"answer":1,"why":"전이는 계약·보험으로 손실을 제3자에게 옮기는 것, 완화는 발생 가능성이나 영향을 줄이는 활동, 수용은 리스크를 인정하고 예비비·대안으로 감당하는 것이다. 회피는 리스크의 원인을 제거해 발생 자체를 없애는 것(예: 해당 기능을 릴리스 범위에서 제외)이다. ②는 원인을 없애지도, 가능성·영향을 줄이지도 않으므로 회피가 아니며 오히려 리스크를 키운다.","trap":"②는 '회피'라는 용어가 붙어 있어 전략 이름만 보면 맞는 것처럼 보인다. 판단 기준은 이름이 아니라 '원인을 제거했는가'다. 또 ③의 전이를 '완화'로, ①의 수용을 '회피'로 바꿔 놓는 변형도 자주 나온다.","optwhy":["옳은 연결이다. 예비비 확보 후 감수하는 것은 수용이다.","옳지 않은 연결이다. 범위를 늘리는 행동은 회피가 아니라 리스크를 키우는 대응이며, 회피는 원인을 제거하는 것이다.","옳은 연결이다. 계약으로 손실을 제3자에게 옮기는 전이의 전형이다.","옳은 연결이다. 침투 테스트·리뷰는 발생 가능성과 영향을 줄이는 완화다."]},{"id":"H33","src":"H","no":33,"ch":5,"topic":"테스트 계획서 vs 진행 보고서 vs 완료 보고서","klevel":"K2","key":["Test plan","Test progress report","Test completion report","Test summary"],"q":"테스트 계획서, 테스트 진행(상태) 보고서, 테스트 완료 보고서의 내용을 구분한 것으로 **옳은 것을 모두 고른** 것은?\nㄱ. 테스트 계획서 — 테스트 범위, 테스트 접근법, 진입·출구 기준, 일정과 자원, 리스크\nㄴ. 테스트 진행 보고서 — 계획 대비 실행률·통과율, 편차와 그 원인, 차단 요소와 완화 조치\nㄷ. 테스트 완료 보고서 — 테스트 요약, 결함 요약과 잔여 결함, 출구 기준 충족 여부, 교훈과 후속 조치\nㄹ. 테스트 계획서 — 테스트 중 발견된 결함의 상세 목록과 수정 담당자\nㅁ. 테스트 진행 보고서 — 프로젝트가 끝난 뒤 회고에서 한 번만 작성한다","opts":["ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ","ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ"],"answer":3,"why":"계획서는 '무엇을 어떻게, 언제까지, 무엇을 기준으로'를 사전에 정하고(ㄱ), 진행 보고서는 계획 대비 실제의 편차와 차단 요소를 알린다(ㄴ). 완료 보고서는 결과를 요약하고 출구 기준 충족 여부·잔여 결함·교훈을 남긴다(ㄷ). 결함 상세 목록은 계획서가 아니라 결함 관리·보고 산출물이고(ㄹ), 진행 보고서는 프로젝트 중 반복적으로 작성한다(ㅁ).","trap":"ㄹ은 '테스트 계획서에 결함 목록도 들어가면 좋겠다'는 실무 감각을 건드린다. 계획서는 사전 문서이므로 실행 중 발견된 결함 목록은 들어가지 않는다. ㅁ은 진행 보고서와 완료 보고서를 섞은 함정이다.","optwhy":["ㄹ이 들어 있어 오답이다. 결함 상세 목록은 계획서가 아니라 실행·보고 산출물이다.","ㄹ과 ㅁ이 들어 있어 오답이다. 진행 보고서는 회고 때 한 번 쓰는 문서가 아니다.","ㄱ이 빠졌고 ㅁ이 들어 있다. 범위·접근법·기준은 계획서의 핵심이다.","정답. ㄱ·ㄴ·ㄷ이 각 보고서의 고유 내용과 정확히 맞는다."]},{"id":"H34","src":"H","no":34,"ch":5,"topic":"테스트 피라미드와 자동화 배치","klevel":"K2","key":["Test pyramid","Ice-cream cone","Test automation","Service level"],"q":"테스트 피라미드(test pyramid)에 대한 설명으로 **옳은** 것은?","opts":["아래층(단위·컴포넌트)에 테스트를 많이 두고 위층(UI·E2E)으로 갈수록 적게 두며, 낮은 층은 자동화해 빠르게 실행되도록 구성한다.","위층(UI)에 테스트를 가장 많이 두고 아래층은 최소화한다.","모든 층의 테스트 수를 동일하게 유지하는 모델이다.","테스트 레벨의 수행 순서를 정한 일정 모델이다."],"answer":0,"why":"테스트 피라미드는 빠르고 안정적인 낮은 수준(단위·컴포넌트) 테스트를 많이, 느리고 깨지기 쉬운 UI·E2E 테스트를 적게 두는 모델이다. 반대로 UI 테스트가 많은 형태는 업계에서 '아이스크림 콘'이라 부르는 안티패턴으로, 유지보수 비용과 실행 시간이 커진다. 피라미드는 테스트 배치 모델이지 일정·순서 모델이 아니다.","trap":"UI 테스트가 '사용자 관점이라 더 좋다'는 인식이 ②를 유인한다. UI 테스트는 느리고 변경에 취약해 비중을 줄이는 것이 정석이다. ③·④는 피라미드를 수량 균등·일정 모델로 오해한 함정이다.","optwhy":["정답. 아래층 다수·위층 소수, 낮은 층 자동화라는 피라미드의 핵심을 정확히 서술했다.","아이스크림 콘 안티패턴이다. UI 테스트를 많이 두면 느리고 깨지기 쉬워 유지비가 커진다.","피라미드는 층별 테스트 수의 비중을 말하며 균등 분배가 아니다.","피라미드는 테스트 배치·자동화 전략 모델이며 일정 순서 모델이 아니다."]},{"id":"H35","src":"H","no":35,"ch":5,"topic":"결함 탐지율(DDP) 계산","klevel":"K3","key":["Defect detection percentage","Test metrics","Escaped defects"],"q":"릴리스 전 테스트에서 결함 120건을 발견했고, 릴리스 후 3개월 동안 운영에서 결함 30건이 추가로 보고되었다. **결함 탐지율(Defect Detection Percentage)** 은?","opts":["150%","75%","80%","25%"],"answer":2,"why":"DDP = 테스트에서 발견한 결함 ÷ (테스트에서 발견한 결함 + 릴리스 후 발견한 결함) × 100이다. 120 ÷ (120 + 30) = 120 ÷ 150 = 80%다. 테스트가 전체 결함의 80%를 걸러냈고 20%가 운영으로 흘러나갔다는 뜻이다.","trap":"분모를 테스트 결함만 두고 180/120 = 150%로 계산하거나(①), 릴리스 후 결함만 분자로 쓰는 25%(④)가 함정이다. 분모는 '테스트가 잡은 것 + 놓친 것' 전체다.","optwhy":["150%는 180/120으로, 분모를 테스트 결함만 둔 값이다.","75%는 분모에 다른 항목을 넣은 값이다. DDP의 분모는 테스트 발견 + 릴리스 후 발견이다.","정답. 120 / 150 = 80%.","25%는 30/120으로, 분자와 분모를 뒤집은 값이다."]},{"id":"H36","src":"H","no":36,"ch":5,"topic":"추적성 기반 영향도 분석과 회귀 범위","klevel":"K3","key":["Traceability","Impact analysis","Regression scope","Coverage reporting"],"q":"요구사항 관리 도구에 요구사항–테스트 케이스–결함이 연결되어 있다. 릴리스 3일 전, [배송비 정책] 요구사항이 변경되었다. **가장 적절한** 조치와 그 근거는?","opts":["추적성은 문서 작성을 돕는 것이므로 변경 영향도 분석에는 쓰지 않는다.","추적성 정보로 이 요구사항을 검증하는 테스트 케이스와 관련 결함을 찾아, 영향받는 케이스만 선별해 재실행하고 회귀 범위를 정한다.","모든 테스트 케이스를 처음부터 다시 실행한다.","요구사항 변경은 개발 영역이므로 테스트 계획을 변경하지 않는다."],"answer":1,"why":"양방향 추적성은 요구사항–테스트 케이스–결함의 연결을 보여 주므로, 변경된 요구사항이 어느 케이스와 결함에 닿는지 바로 찾을 수 있다. 이를 근거로 영향도 분석을 하고, 위험에 비례해 회귀 범위를 정한다. 릴리스 3일 전에는 특히 선별적 회귀가 현실적이다.","trap":"'안전하게 전부 다시'가 ③을 유인한다. 전수 재실행은 시간이 없고, 실제로는 영향 범위를 모르는 것이 문제이므로 추적성으로 범위를 좁히는 것이 정답이다. ①은 추적성의 목적을 문서화로 축소한 함정이다.","optwhy":["추적성의 핵심 용도가 영향도 분석과 커버리지 보고다.","정답. 추적성으로 영향 케이스·결함을 찾아 선별 회귀하는 것이 목적에 맞다.","전수 재실행은 릴리스 3일 전 일정에서 비현실적이고, 범위 판단을 대신하지 못한다.","요구사항 변경은 테스트 범위·일정·회귀 전략을 바꾸는 대표적 트리거다."]},{"id":"H37","src":"H","no":37,"ch":5,"topic":"테스트 실행 노력 계산(자동화 비중)","klevel":"K3","key":["Test execution effort","Automation ratio","Estimation"],"q":"테스트 케이스 480개를 실행해야 한다. 60%는 자동화되어 있고, 자동 케이스 1개당 실행·확인에 3분, 나머지 수동 케이스 1개당 20분이 걸린다. 총 실행 시간은? (휴게·재실행 시간은 제외)","opts":["64시간","78.4시간","92.8시간","160시간"],"answer":1,"why":"자동 480 × 0.6 = 288개 × 3분 = 864분(14.4시간), 수동 480 × 0.4 = 192개 × 20분 = 3,840분(64시간)이다. 합계 4,704분 = 78.4시간이다. 자동화 비중을 반대로 적용하거나 자동 1건 시간을 과대 계산하면 오답이 된다.","trap":"수동만 계산하면 ①(64시간)이 나오고, 자동 1건을 6분으로 잡으면 ③(92.8시간)이 된다. 480개 전부를 수동으로 보면 ④(160시간)다. 자동화 60%를 '수동 60%'로 뒤집는 실수도 흔하다.","optwhy":["64시간은 수동 192개만 계산한 값이다. 자동 288개의 14.4시간이 빠졌다.","정답. 14.4시간 + 64시간 = 78.4시간.","92.8시간은 자동 1건을 6분으로 계산한 값이다(28.8 + 64).","160시간은 480개 전부를 수동(20분)으로 계산한 값이다."]},{"id":"H38","src":"H","no":38,"ch":5,"topic":"출구 기준 미충족 시 릴리스 판단","klevel":"K3","key":["Exit criteria","Residual risk","Release decision","Stakeholder"],"q":"출구 기준은 '치명 결함 0건, 미해결 결함 5건 이하, 실행률 100%, 통과율 90% 이상'이다. 현재 실행률 100%, 통과율 92%, 치명 결함 0건이지만 미해결 결함이 7건이고 그중 2건이 결제 관련이다. 릴리스 결정으로 **가장 적절한** 것은?","opts":["통과율이 90%를 넘었으므로 기준을 모두 충족한 것으로 보고 릴리스한다.","출구 기준은 권고 사항이므로 무시하고 릴리스한다.","미해결 결함 7건을 모두 수정할 때까지 일정과 무관하게 릴리스를 보류한다.","출구 기준의 수치를 충족하지 못했으므로, 결함의 심각도·영향과 잔여 리스크를 평가해 이해관계자와 함께 릴리스 여부를 결정한다."],"answer":3,"why":"출구 기준은 리스크 기반 판단의 입력이다. 미해결 결함 수가 기준을 넘었으므로 기준 미충족이며, 결제 관련 결함의 심각도와 영향, 잔여 리스크를 평가해 이해관계자와 함께 릴리스 여부를 결정한다. 테스트 완료는 기준 충족만으로 기계적으로 결정되지 않는다.","trap":"통과율 92%만 보고 ①을 고르기 쉽다. 출구 기준은 여러 항목의 AND 조건이며, 하나라도 미충족이면 '충족'이 아니다. ③은 리스크 평가 없이 일정을 무시하는 반대쪽 극단이다.","optwhy":["미해결 결함 7건은 기준(5건 이하)을 넘었다. 통과율만으로 충족이라 할 수 없다.","출구 기준을 무시하는 것은 리스크 관리가 아니다.","결함 심각도·영향 평가 없이 전면 보류하는 것도 리스크 기반 판단이 아니다.","정답. 기준 미충족을 인정하고 잔여 리스크 평가와 이해관계자 판단으로 넘겼다."]},{"id":"H39","src":"H","no":39,"ch":6,"topic":"테스트 자동화의 유지보수 비용과 ROI","klevel":"K3","key":["Test automation","Maintenance cost","Return on investment","Brittle tests"],"q":"팀이 3년간 UI 자동화 스크립트 800개를 유지했지만, 화면 개편 때마다 30%가 깨져 수정에 릴리스마다 3일이 들고, 실제로 결함을 잡는 비율은 낮다. **가장 적절한** 개선 방향은?","opts":["위험과 변경 빈도가 높은 핵심 흐름만 UI 자동화로 남기고, 안정적인 API·단위 수준으로 자동화를 옮기며, 깨지기 쉬운 스크립트는 유지보수 비용을 기준으로 폐기한다.","자동화 스크립트를 더 많이 만들어 수동 테스트를 완전히 없앤다.","UI 자동화는 유지보수가 필요 없으므로 그대로 두고 수동 테스트만 줄인다.","자동화를 모두 폐기하고 수동 테스트만 수행한다."],"answer":0,"why":"자동화는 초기 투자와 유지보수 비용이 계속 드는 자산이다. UI는 변경에 취약해 깨지기 쉬우므로, 안정적인 낮은 수준(API·단위)으로 옮기고 핵심 흐름만 UI에 남기며, 비용 대비 효익이 낮은 스크립트는 폐기하는 것이 맞다. 자동화의 가치는 '실행 횟수'가 아니라 '잡아낸 결함과 절감된 노력'으로 판단한다.","trap":"'자동화를 늘리면 좋다'는 ②, '자동화는 유지보수가 필요 없다'는 ③이 대표적 함정이다. ④는 반대로 자동화의 이점을 전부 버리는 극단이다.","optwhy":["정답. 피라미드 방향으로 자동화를 재배치하고, 유지보수 비용 대비 효익으로 스크립트를 선별·폐기한다.","깨지기 쉬운 UI 스크립트를 늘리면 유지보수 비용이 더 커진다. 수동 테스트를 완전히 없앨 수도 없다.","UI 자동화는 화면 변경에 매우 취약하다. 유지보수가 필요 없다는 전제가 틀렸다.","자동화의 이점(반복 실행·회귀)까지 버리는 극단적 처방이다."]},{"id":"H40","src":"H","no":40,"ch":6,"topic":"테스트 도구 도입 실패 원인과 조직 준비도","klevel":"K3","key":["Tool support","Pilot project","Interoperability","Training","Process fit"],"q":"테스트 관리 도구를 도입했지만 6개월 만에 사용이 중단되었다. 도구 기능은 요구에 맞았으나, 교육 없이 전 팀에 일괄 적용했고, 기존 엑셀 자료 이관이 되지 않았으며, 도구가 기존 이슈 트래커와 연동되지 않았다. **가장 적절한** 분석은?","opts":["테스트 관리 도구는 자동화 도구가 아니므로 실패한 것은 당연하다.","교육은 필요 없고 도구 사용을 의무화하면 해결된다.","도구의 기술적 적합성뿐 아니라 조직의 준비도(교육·파일럿), 기존 도구·데이터와의 상호운용성, 프로세스 적합성을 함께 평가했어야 한다.","도구의 기능이 부족했으므로 더 비싼 도구를 도입해야 한다."],"answer":2,"why":"도구 도입은 기술 평가만으로 끝나지 않는다. 파일럿으로 적합성을 확인하고, 교육과 멘토링을 제공하며, 기존 도구·데이터와의 상호운용성(이관·연동), 라이선스·벤더 지원, 프로세스 적합성, 오픈소스 리스크를 함께 평가해야 한다. 도구는 사람과 프로세스를 대체하지 못한다.","trap":"'기능은 맞았는데 실패'라는 문장이 ④를 유인한다. 실패 원인은 기능이 아니라 조직 준비도·상호운용성·프로세스 적합성이다. ①은 테스트 관리 도구의 역할을 자동화 도구로 축소한 함정이다.","optwhy":["테스트 관리 도구는 요구사항·케이스·결과·추적성 관리를 지원하는 정당한 도구 유형이다.","교육 없이 의무화하면 저항과 우회 사용이 늘어 실패 가능성이 커진다.","정답. 준비도·상호운용성·프로세스 적합성이라는 비기술적 요인을 짚었다.","기능은 요구에 맞았다고 했으므로 더 비싼 도구가 해법이 아니다."]},{"id":"F01","src":"F","no":1,"ch":1,"topic":"테스트 프로세스 · 테스트 설계 활동","klevel":"K2","key":["Test design","Test implementation","Test condition","Test suite"],"q":"다음 중 ISTQB 테스트 프로세스의 **테스트 설계(Test Design)** 활동에 해당하는 것은?","opts":["테스트 베이스에서 테스트 컨디션을 식별하고, 리스크와 우선순위에 따라 순서를 정한다","테스트 컨디션에서 테스트 케이스를 도출하고, 필요한 테스트 데이터와 테스트 환경 요구사항을 식별한다","테스트 케이스를 실행 순서대로 묶어 테스트 스위트를 만들고 테스트 하네스를 준비한다","테스트 결과를 기록하고, 실제 결과와 기대 결과를 비교한다"],"answer":1,"why":"테스트 설계는 '어떻게 테스트할 것인가'를 정하는 활동이다. 설계 기법을 써서 테스트 컨디션을 테스트 케이스와 테스트 케이스 집합으로 바꾸고, 그 실행에 필요한 테스트 데이터와 테스트 환경 요구사항을 식별한다. 그 뒤 테스트 구현에서 케이스·절차를 구체화하고 스위트와 하네스를 준비한다.","trap":"가장 많이 헷갈리는 경계는 설계와 구현이다. '테스트 케이스를 도출한다'는 설계, '스위트·절차·하네스·스크립트를 준비한다'는 구현이다. '테스트 컨디션을 식별한다'는 분석이므로, 세 활동을 한 줄씩 섞어 놓고 하나만 고르게 만든다."},{"id":"F02","src":"F","no":2,"ch":1,"topic":"테스트 절차 · 용어 구분","klevel":"K2","key":["Test procedure","Test case","Test suite","Test condition"],"q":"다음 중 **테스트 절차(Test Procedure)** 에 대한 설명으로 옳은 것은?","opts":["테스트 베이스에서 식별된, 테스트할 수 있는 컴포넌트나 시스템의 측면","실행 순서대로 나열된 테스트 케이스의 연속과, 실행 전 사전 조건 설정 및 실행 후 정리 활동","입력값, 사전 조건, 기대 결과, 실제 결과로 구성되는 테스트의 기본 단위","실행 목적에 따라 묶인 테스트 케이스나 테스트 절차의 집합"],"answer":1,"why":"테스트 절차(테스트 스크립트)는 실행 순서대로 나열한 테스트 케이스의 연속이며, 시작 전 사전 조건 세팅과 종료 후 정리 활동까지 포함한다.","trap":"나머지는 모두 다른 용어의 정의다. 차례로 테스트 컨디션, 테스트 케이스, 테스트 스위트다. 용어 정의 네 개를 서로 바꿔 놓는 유형이므로, '실행 순서(sequence)'라는 말이 있으면 테스트 절차로 본다."},{"id":"F03","src":"F","no":3,"ch":1,"topic":"오류·결함·장애·근본 원인","klevel":"K2","key":["Root cause","Error","Defect","Failure"],"q":"은행 앱의 이체 화면에서 소수점이 있는 금액을 입력하면 앱이 강제 종료되었다. 조사 결과 소수점 금액을 받을 수 없는 정수형 변수를 쓴 코드가 있었고, 요구사항 검토와 코드 리뷰 절차가 팀에 아예 없어서 이 문제가 걸러지지 않았다.\n위 상황에서 **근본 원인(root cause)** 에 해당하는 것은?","opts":["금액 변수를 정수형으로 선언한 코드 한 줄","앱이 강제 종료된 사건","개발자가 요구사항의 소수점 처리 조건을 확인하지 않은 것","요구사항 검토와 코드 리뷰 절차가 팀에 없어 결함이 걸러지지 않은 것"],"answer":3,"why":"근본 원인은 결함을 만들어 낸 가장 근본적인 이유로, 대개 프로세스·조직·환경의 문제다. 리뷰 절차의 부재는 결함이 만들어지고도 발견되지 않은 구조적 원인이다.","trap":"오류(error)·결함(defect)·장애(failure)도 모두 이 상황에 등장한다. 사람이 잘못 판단한 것이 오류, 코드에 남은 것이 결함, 실행 중 드러난 것이 장애다. 근본 원인은 이 셋보다 한 단계 위의 '왜 생겼는가'다."},{"id":"F04","src":"F","no":4,"ch":1,"topic":"7원칙 · 전체 테스팅은 불가능","klevel":"K2","key":["Exhaustive testing is impossible","Risk-based testing","Defect clustering"],"q":"한정된 인력과 기간 때문에 모든 기능을 같은 깊이로 테스트할 수 없어, 결제·환불·정산처럼 자금이 오가는 기능에는 촘촘한 테스트를 배분하고 위험이 낮은 배너 노출 기능에는 소수의 테스트만 수행했다.\n이 결정의 근거가 되는 테스팅 원칙으로 가장 적절한 것은?","opts":["결함 집중(Defect clustering)","살충제 패러독스(Pesticide paradox)","전체 테스팅은 불가능하다(Exhaustive testing is impossible)","정황에 따라 다르다(Context dependent)"],"answer":2,"why":"모든 입력과 조합을 테스트하는 것은 불가능하므로 리스크와 우선순위에 따라 테스트를 배분한다. 자원이 한정된 상황에서 위험 기반으로 범위를 정하는 것이 이 원칙의 실천이다.","trap":"'결제 기능에 집중'이라는 표현 때문에 결함 집중을 고르기 쉽다. 결함 집중은 이미 결함이 많이 발견된 모듈에 테스트를 더 넣는 것이고, 여기서는 결함 분포가 아니라 위험을 근거로 배분했다. 정황에 따라 다르다는 제품 성격(안전 필수·게임 등)에 따라 접근법이 달라진다는 뜻이라 이 상황과 다르다."},{"id":"F05","src":"F","no":5,"ch":1,"topic":"테스팅의 심리적 측면","klevel":"K2","key":["Psychology of testing","Defect report","Communication"],"q":"테스팅의 심리적 측면에 대한 설명으로 **옳지 않은** 것은?","opts":["테스터는 결함을 발견했을 때 그것을 개발자에 대한 비판이 아니라 제품 품질을 위한 정보로 전달해야 한다","결함 보고는 사람이 아니라 제품에 초점을 맞추고, 사실과 근거를 중심으로 작성한다","개발자는 자신이 작성한 산출물의 결함을 스스로 찾기 어려운 경향이 있어 독립적인 테스터가 도움이 된다","테스팅은 개발자의 업무를 평가하는 활동이므로, 발견된 결함은 개인의 성과 평가 자료로 활용하는 것이 효과적이다"],"answer":3,"why":"테스팅은 사람을 평가하는 활동이 아니라 제품의 결함을 찾아 품질을 높이는 활동이다. 결함을 개인 성과 평가에 쓰면 개발자가 결함을 숨기게 되어 오히려 품질이 나빠진다.","trap":"'평가', '성과', '책임 추궁'처럼 사람을 대상으로 하는 표현이 들어가면 오답이다. 나머지는 교과서에 나오는 커뮤니케이션 원칙 그대로라 옳은 설명으로 보인다."},{"id":"F06","src":"F","no":6,"ch":1,"topic":"테스터의 필수 역량","klevel":"K1","key":["Generic skills","Analytical thinking","Critical thinking","Domain knowledge"],"q":"ISTQB에서 개인 테스터에게 필요한 일반적 역량으로 **가장 거리가 먼** 것은?","opts":["세심함, 호기심, 상세한 부분까지 주의를 기울이는 태도","분석적 사고, 비판적 사고, 창의성","기술적 지식과 제품 도메인 지식, 그리고 의사소통 능력","결함을 만든 담당자를 가려내기 위한 인사 평가 기준을 설계하는 능력"],"answer":3,"why":"테스터에게 필요한 역량은 테스팅 지식, 세심함·호기심·주의력, 분석적·비판적 사고, 창의성, 기술적·도메인 지식, 의사소통 능력이다. 인사 평가 기준의 설계는 테스터의 역량이 아니다.","trap":"의사소통 능력과 도메인 지식은 테스터에게도 중요한 역량이라 오답처럼 보이지 않게 만든 보기다. '사람을 평가'하는 보기가 섞여 있으면 그것이 답이다."},{"id":"F07","src":"F","no":7,"ch":1,"topic":"테스트 독립성 수준","klevel":"K2","key":["Test independence"],"q":"테스트 독립성 수준을 **낮은 것에서 높은 것 순서**로 바르게 나열한 것은?\nㄱ. 개발팀 내 동료 개발자  ㄴ. 개발자 본인  ㄷ. 조직 외부의 독립된 테스트 전문 업체  ㄹ. 조직 내 별도의 테스트 팀","opts":["ㄴ → ㄱ → ㄹ → ㄷ","ㄴ → ㄹ → ㄱ → ㄷ","ㄱ → ㄴ → ㄹ → ㄷ","ㄴ → ㄱ → ㄷ → ㄹ"],"answer":0,"why":"독립성은 개발자 본인 → 같은 팀 동료 → 조직 내 다른 팀(별도 테스트 팀) → 조직 외부 순으로 높아진다.","trap":"외부 업체와 조직 내 별도 테스트 팀의 순서를 뒤집는 보기가 함정이다. 외부 업체는 조직 밖이므로 조직 내 별도 테스트 팀보다 독립성이 높다. '동료'를 '본인'보다 낮게 놓는 실수도 자주 나온다."},{"id":"F08","src":"F","no":8,"ch":1,"topic":"테스트 베이시스","klevel":"K1","key":["Test basis","Testware","Test condition"],"q":"다음 중 테스트 베이시스(Test basis)로 활용하기에 **가장 적절하지 않은** 것은?","opts":["요구사항 명세서와 사용자 스토리","상세 설계서와 소스 코드","위험 분석 보고서와 비즈니스 프로세스 명세","이전 릴리스에서 테스터가 기록한 테스트 실행 결과 로그"],"answer":3,"why":"테스트 베이시스는 테스트 컨디션을 도출하는 근거가 되는 정보원이다. 요구사항, 사용자 스토리, 설계서, 코드, 비즈니스 프로세스, 위험 분석 결과, 사용자 매뉴얼 등이 해당한다. 테스트 실행 결과 로그는 테스트 과정에서 만들어진 산출물이지 베이시스가 아니다.","trap":"위험 분석 보고서가 베이시스가 될 수 있다는 점을 모르면 그것을 의심하게 된다. 리스크 분석 결과는 테스트 대상과 우선순위를 정하는 근거로 쓰이는 정당한 베이시스다. 반대로 테스트 산출물(결과 로그·결함 보고서)은 베이시스가 아니다."},{"id":"F09","src":"F","no":9,"ch":2,"topic":"ISO/IEC 25010 · 사용성","klevel":"K2","key":["ISO/IEC 25010","Usability","Functional suitability"],"q":"다음 요구사항이 ISO/IEC 25010의 어느 품질 특성에 해당하는가?\n「사용자는 별도 교육 없이 첫 화면에서 세 번 이내의 조작으로 원하는 메뉴에 도달할 수 있어야 하며, 오류 메시지는 이해하기 쉽고 문제 해결 방법을 안내해야 한다.」","opts":["기능 적합성(Functional suitability)","유지보수성(Maintainability)","사용성(Usability)","성능 효율성(Performance efficiency)"],"answer":2,"why":"사용성은 사용자가 정해진 맥락에서 효과적·효율적·만족스럽게 목표를 달성할 수 있는 정도다. 학습 용이성, 조작성, 사용자 오류 보호, 접근성 등이 포함된다.","trap":"오류 메시지가 제대로 나오는지를 묻는 것처럼 보여 기능 적합성으로 끌린다. 여기서는 오류가 났을 때 사용자가 이해하고 회복할 수 있는지를 묻고 있으므로 사용성이다."},{"id":"F10","src":"F","no":10,"ch":2,"topic":"통합 테스팅","klevel":"K2","key":["Component integration testing","System integration testing","Interface"],"q":"컴포넌트 통합 테스팅과 시스템 통합 테스팅에 대한 설명으로 **옳지 않은** 것은?","opts":["컴포넌트 통합 테스팅은 컴포넌트 사이의 인터페이스와 상호작용에서 생기는 결함을 찾는다","시스템 통합 테스팅은 테스트 대상 시스템과 외부 시스템·서비스 사이의 인터페이스를 테스트한다","통합 테스팅은 인터페이스 오류, 데이터 흐름 오류, 타이밍 문제를 발견하는 데 효과적이다","시스템 통합 테스팅은 하나의 시스템 안에 있는 모든 컴포넌트를 합친 뒤 처음 수행하는 테스트 레벨이다"],"answer":3,"why":"모든 컴포넌트를 합친 뒤 시스템 전체를 대상으로 처음 수행하는 레벨은 시스템 테스팅이다. 시스템 통합 테스팅은 여러 시스템(또는 외부 서비스)을 서로 연결할 때의 인터페이스를 다룬다.","trap":"'시스템'이라는 단어가 두 번 나와 헷갈린다. 컴포넌트 통합은 한 시스템 내부 부품의 연결, 시스템 통합은 서로 다른 시스템의 연결, 시스템 테스팅은 완성된 한 시스템의 전체 동작과 비기능 특성이다."},{"id":"F11","src":"F","no":11,"ch":2,"topic":"인수 테스팅 유형","klevel":"K2","key":["Operational acceptance testing","Contractual and regulatory acceptance testing","Alpha testing","Beta testing"],"q":"인수 테스팅 유형에 대한 설명으로 옳은 것은?","opts":["운영 인수 테스팅(Operational acceptance testing)은 백업·복구, 재해 복구, 보안 취약점, 성능 같은 운영 준비성을 확인한다","계약 및 규제 인수 테스팅은 개발팀이 자체적으로 정한 체크리스트로만 수행한다","알파 테스팅은 개발 조직이 통제할 수 없는 실제 사용 환경에서 잠재 사용자가 수행한다","베타 테스팅은 개발자 사무실에서 잠재 사용자가 수행한다"],"answer":0,"why":"인수 테스팅은 사용 인수, 운영 인수, 계약 및 규제 인수, 알파·베타로 나뉜다. 운영 인수는 백업·복구·재해 복구·보안·성능 등 운영 환경에서의 준비 상태를 확인한다.","trap":"알파와 베타의 장소를 바꿔 놓는 것이 단골 함정이다. 알파는 개발 측 시설에서 잠재 사용자가, 베타는 개발 조직이 통제할 수 없는 실제 사용 환경에서 사용자가 수행한다. 계약 및 규제 인수는 계약서나 법규의 기준으로 수행하므로 개발팀 자체 체크리스트로는 부족하다."},{"id":"F12","src":"F","no":12,"ch":2,"topic":"V모델 · 순차적 개발 모델","klevel":"K2","key":["V-model","Sequential development model","Early testing"],"q":"V모델(순차적 개발 모델)에 대한 설명으로 옳은 것은?","opts":["요구사항 단계에서는 테스트를 전혀 고려하지 않고, 코드가 완성된 뒤에야 모든 테스트 활동을 시작한다","반복 주기마다 동작하는 소프트웨어를 인도하는 것을 핵심 목표로 한다","각 개발 단계에 대응하는 테스트 레벨이 짝을 이루며, 요구사항 단계에서 이미 인수 테스팅을 위한 테스트 컨디션을 준비한다","테스트 레벨을 컴포넌트 테스팅 하나로 단순화한 모델이다"],"answer":2,"why":"V모델은 개발 단계와 테스트 레벨을 짝지어 놓은 순차적 모델이다. 요구사항 단계에서 인수 테스팅을, 설계 단계에서 시스템·통합 테스팅의 기반을 미리 준비해 조기 테스팅을 가능하게 한다.","trap":"반복 주기마다 동작하는 소프트웨어를 인도하는 설명은 애자일·점진적 개발 모델의 특징이고, 코드 완성 후에야 테스트를 시작한다는 설명은 V모델의 장점(조기 테스트 준비)을 정반대로 뒤집은 것이다. V모델은 순차적이지만 테스트를 뒤로 미루지 않는다."},{"id":"F13","src":"F","no":13,"ch":2,"topic":"반복적·점진적 개발에서의 테스팅","klevel":"K2","key":["Iterative development","Regression testing","Continuous integration"],"q":"반복적·점진적 개발에서의 테스팅에 대한 설명으로 **옳지 않은** 것은?","opts":["반복마다 기능이 추가되므로 리그레션 테스팅의 비중이 커지고 자동화의 가치가 높아진다","짧은 반복 안에서 빠르게 피드백을 주고받아야 하므로 지속적 통합과 자동화 테스트가 중요하다","반복이 끝날 때마다 동작하는 소프트웨어를 인도하므로 각 반복 안에서 테스트가 수행된다","테스트 문서를 상세하게 작성해야만 테스트를 수행할 수 있으므로, 문서화 수준이 낮으면 반복 개발에서는 테스팅이 불가능하다"],"answer":3,"why":"반복적 개발에서는 문서보다 동작하는 소프트웨어와 빠른 피드백을 중시하므로 테스트 문서를 가볍게 유지하고 자동화로 보완한다. 문서화 수준이 테스트 수행의 전제 조건은 아니다.","trap":"'문서'를 전제로 세운 단계적이고 엄격한 표현은 애자일·점진적 개발의 특성과 반대다. 다만 테스트 문서를 전혀 만들지 않는다는 뜻은 아니며, 필요한 만큼만 유지한다는 점을 구분한다."},{"id":"F14","src":"F","no":14,"ch":2,"topic":"기능 테스팅 vs 비기능 테스팅","klevel":"K2","key":["Functional testing","Non-functional testing","Usability","Performance efficiency"],"q":"다음 중 **비기능 테스팅**에 해당하는 것만 짝지은 것은?\nㄱ. 동시 접속자 1,000명일 때 평균 응답 시간이 2초 이내인지 확인한다\nㄴ. 이미 가입된 이메일로 가입을 시도하면 오류 메시지가 표시되는지 확인한다\nㄷ. 신규 사용자가 첫 화면에서 로그인까지 도달하는 데 걸리는 시간과 이탈률을 확인한다\nㄹ. 할인 정책에 따라 결제 금액과 적립 포인트가 정확히 계산되는지 확인한다","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"answer":1,"why":"비기능 테스팅은 '얼마나 잘 하는가'(성능, 사용성, 신뢰성, 보안 등)를 확인한다. 응답 시간(ㄱ)과 사용자가 과업을 완수하는 데 걸리는 시간·이탈률(ㄷ)은 비기능이다.","trap":"ㄴ과 ㄹ은 시스템이 '무엇을 하는가'를 확인하는 기능 테스팅이다. 사용성(ㄷ)을 기능 확인으로 착각하기 쉽지만, 사용성은 ISO/IEC 25010의 비기능 품질 특성이다."},{"id":"F15","src":"F","no":15,"ch":3,"topic":"리뷰 역할과 책임","klevel":"K2","key":["Review leader","Moderator","Scribe","Author","Reviewer"],"q":"공식 리뷰의 역할과 책임의 연결로 **옳지 않은** 것은?","opts":["작성자(Author) — 리뷰 대상 작업 산출물을 작성하고, 발견된 결함을 수정한다","중재자(Moderator) — 리뷰 회의를 진행하고, 참가자들이 리뷰 결과에 합의하도록 이끈다","기록자(Scribe) — 리뷰 중 발견된 이상과 결정 사항을 기록하고 회의록을 정리한다","리뷰 리더(Review Leader) — 리뷰에서 발견된 결함을 직접 수정해 산출물에 반영한다"],"answer":3,"why":"리뷰 리더는 리뷰를 계획하고 참가자를 선정하며 회의를 주관하고 결과를 후속 조치로 연결한다. 결함 수정은 작성자의 책임이다.","trap":"'리더'라는 이름 때문에 회의 진행과 수정을 모두 하는 것으로 보인다. 회의 진행은 리뷰 리더(또는 중재자)의 몫이지만, 산출물을 고치는 것은 언제나 작성자다."},{"id":"F16","src":"F","no":16,"ch":3,"topic":"리뷰 프로세스 활동 순서","klevel":"K2","key":["Review process","Individual review","Communication and analysis","Fixing and reporting"],"q":"공식 리뷰 프로세스의 활동을 순서대로 바르게 나열한 것은?\nㄱ. 개별 리뷰  ㄴ. 수정 및 보고  ㄷ. 리뷰 착수(kick-off)  ㄹ. 계획  ㅁ. 의사소통 및 분석","opts":["ㄹ → ㄷ → ㄱ → ㅁ → ㄴ","ㄷ → ㄹ → ㄱ → ㅁ → ㄴ","ㄹ → ㄱ → ㄷ → ㅁ → ㄴ","ㄹ → ㄷ → ㅁ → ㄱ → ㄴ"],"answer":0,"why":"공식 리뷰는 계획 → 리뷰 착수 → 개별 리뷰 → 의사소통 및 분석 → 수정 및 보고 순으로 진행된다.","trap":"개별 리뷰와 의사소통·분석의 순서를 뒤집는 보기가 함정이다. 참가자가 각자 산출물을 읽고 이상을 찾는 것이 개별 리뷰이고, 그 결과를 모아 논의·분류하는 것이 의사소통 및 분석이다. 착수 회의는 계획 다음에 온다."},{"id":"F17","src":"F","no":17,"ch":3,"topic":"정적 분석 (도구 기반 정적 테스팅)","klevel":"K2","key":["Static analysis","Static testing","Coding standard","Cyclomatic complexity"],"q":"정적 분석(Static analysis)에 대한 설명으로 가장 적절한 것은?","opts":["소프트웨어를 실행하지 않고 도구로 코드를 분석해 코딩 표준 위반, 널 포인터 역참조, 보안 취약점, 순환 복잡도 같은 문제를 찾는다","테스트 케이스를 실행해 실제 결과와 기대 결과를 비교한다","참가자들이 회의에서 산출물을 직접 읽으며 결함을 찾는다","운영 환경의 로그를 수집해 응답 시간 병목을 찾는다"],"answer":0,"why":"정적 분석은 도구가 코드를 실행하지 않고 분석해 결함과 취약점을 찾는 정적 테스팅 기법이다. 코딩 표준 위반, 사용되지 않는 변수, 널 포인터, 보안 취약점, 복잡도 등을 찾는다.","trap":"회의에서 사람이 산출물을 읽는 것도 정적 테스팅(리뷰)이라 '정적'이라는 단어에 끌린다. 정적 분석은 사람이 아니라 도구가 수행한다는 점이 구분점이다. 테스트를 실행하거나 로그를 수집하는 것은 동적 테스팅이다."},{"id":"F18","src":"F","no":18,"ch":3,"topic":"리뷰 유형 구분 (Informal·Walkthrough·Technical·Inspection)","klevel":"K2","key":["Informal review","Walkthrough","Technical review","Inspection"],"q":"다음 중 리뷰 유형의 특성에 대한 설명으로 **옳은** 것은?","opts":["비공식 리뷰(Informal review)는 정해진 프로세스나 문서화가 필요 없는 가장 가벼운 리뷰로, 다른 리뷰 유형보다 형식적 결함 발견 비용이 낮다","워크스루(Walkthrough)는 훈련된 중재자가 이끄는 가장 격식 있는 리뷰로, 측정 지표를 수집하고 출구 기준을 적용한다","기술 리뷰(Technical review)는 작성자가 문서를 낭독하며 참가자에게 정보를 전달하는 것이 주된 목적이다","인스펙션(Inspection)은 작성자가 주도하는 비공식 리뷰로, 교육과 정보 공유를 목적으로 한다"],"answer":0,"why":"리뷰 유형은 격식의 정도에 따라 비공식 리뷰 → 워크스루 → 기술 리뷰 → 인스펙션 순으로 무거워진다. 비공식 리뷰는 규정된 프로세스와 산출물이 필요 없어 비용이 가장 낮고, 어떤 리뷰든 형식적 결함 발견 비용은 비공식 리뷰에서 가장 낮다.","trap":"나머지 설명은 모두 다른 유형의 특징을 가져다 붙인 것이다. 중재자가 이끌고 지표·출구 기준을 쓰는 가장 격식 있는 리뷰는 인스펙션, 작성자가 낭독하며 정보를 전달하는 것은 워크스루, 작성자 주도의 비공식 리뷰는 비공식 리뷰(또는 워크스루)다. '주도자가 누구인가'와 '얼마나 격식적인가' 두 축으로 판별한다."},{"id":"F19","src":"F","no":19,"ch":4,"topic":"동등 분할 · 클래스 개수","klevel":"K3","key":["Equivalence partitioning","Valid partition","Invalid partition"],"q":"배송비 계산 시스템의 [주문 금액] 필드는 다음과 같이 동작한다.\n· 0원 이상 50,000원 미만: 배송비 3,000원\n· 50,000원 이상 1,000,000원 이하: 무료 배송\n· 0원 미만이거나 1,000,000원 초과: 입력 오류\n**동등 분할(Equivalence Partitioning)** 로 유효 동등 클래스와 무효 동등 클래스를 식별할 때, 그 개수로 옳은 것은?","opts":["유효 2개, 무효 1개","유효 2개, 무효 2개","유효 3개, 무효 2개","유효 1개, 무효 3개"],"answer":1,"why":"같은 처리 결과를 내는 입력을 하나로 묶는다. 유효 클래스는 3,000원 구간(0~49,999)과 무료 구간(50,000~1,000,000)의 2개, 무효 클래스는 0 미만과 1,000,000 초과의 2개다.","trap":"'배송비 3,000원'과 '무료'를 하나의 유효 클래스로 묶으면 1개가 되어 버린다. 처리(결과)가 다르면 다른 클래스다. 음수와 초과를 '오류' 하나로 묶는 실수도 흔한데, 입력 범위가 서로 다른 두 구간이므로 각각 별도 클래스다."},{"id":"F20","src":"F","no":20,"ch":4,"topic":"경계값 분석 · 2-value vs 3-value","klevel":"K2","key":["Boundary value analysis","2-value BVA","3-value BVA"],"q":"어떤 입력 필드의 유효 범위가 '정수 10 이상 50 이하'일 때, **2-value 경계값 분석**과 **3-value 경계값 분석**에 사용하는 테스트 값으로 옳은 것은? (범위 밖은 경계에 인접한 값까지만 고려한다)","opts":["2-value: 10, 11, 49, 50 / 3-value: 9, 10, 11, 49, 50, 51","2-value: 9, 10, 50, 51 / 3-value: 10, 11, 49, 50","2-value: 9, 10, 50, 51 / 3-value: 9, 10, 11, 49, 50, 51","2-value: 10, 50 / 3-value: 9, 10, 50, 51"],"answer":2,"why":"2-value는 각 경계값과 인접한 다른 파티션의 값 하나씩을 쓴다(9, 10과 50, 51). 3-value는 경계값 양옆을 모두 써서 9, 10, 11과 49, 50, 51을 쓴다.","trap":"경계 안쪽 두 값만 쓰는 조합(10, 11과 49, 50)은 경계를 '유효 구간의 양 끝'으로만 본 답이다. 경계값 분석의 목적은 경계를 넘나들 때 처리가 바뀌는지 확인하는 것이므로, 3-value는 유효·무효를 모두 넘나들며 경계 양옆 3개씩을 확인한다."},{"id":"F21","src":"F","no":21,"ch":4,"topic":"경계값 커버리지 계산","klevel":"K3","key":["Boundary value coverage","3-value BVA"],"q":"유효 범위가 '정수 18 이상 70 이하'인 나이 필드에 **3-value 경계값 분석**을 적용했다. 경계값은 17, 18, 19, 69, 70, 71의 6개다. 테스트 값 {11, 17, 18, 69, 70, 71}을 실행했을 때 **경계값 커버리지**는?","opts":["50%","67%","83%","100%"],"answer":2,"why":"6개 경계값 가운데 17, 18, 69, 70, 71의 5개를 실행했으므로 5 ÷ 6 ≈ 83%다. 19는 실행하지 않았다.","trap":"테스트 값이 6개라 100%로 보이기 쉽다. 커버리지의 분자는 '실행한 테스트 값의 개수'가 아니라 '실행한 경계값의 개수'다. 11은 경계값이 아니므로 분자에 넣지 않는다."},{"id":"F22","src":"F","no":22,"ch":4,"topic":"구문 커버리지 계산","klevel":"K3","key":["Statement coverage"],"q":"다음 의사코드에 테스트 케이스 TC1(A=5, B=3)과 TC2(A=-5, B=3)을 실행했다. **구문 커버리지(Statement coverage)** 와 실행되지 않은 문장으로 옳은 것은?","html":"<pre class='code'>1  read A, B\n2  if (A &gt; 0) then\n3      C = A + B\n4  else\n5      C = A - B\n6  end if\n7  if (C &gt; 10) then\n8      print \"HIGH\"\n9  end if\n10 print C</pre>","opts":["구문 커버리지 86%, 실행되지 않은 문장은 8번","구문 커버리지 86%, 실행되지 않은 문장은 4번","구문 커버리지 100%, 실행되지 않은 문장은 없음","구문 커버리지 71%, 실행되지 않은 문장은 5번"],"answer":0,"why":"실행 가능한 문장은 1, 2, 3, 5, 7, 8, 10의 7개다. TC1은 A가 0보다 크므로 1·2·3을 지나 C=8이 되고, C가 10보다 크지 않으므로 8번을 실행하지 않는다. TC2는 1·2·5·7·10을 지난다. 두 케이스로 실행된 문장은 6개이므로 6 ÷ 7 ≈ 86%이고, 남은 문장은 8번이다.","trap":"'else' 줄과 'end if' 줄을 실행 문장으로 세면 분모가 늘어 71% 같은 값이 나온다. 이 줄들은 조건에 따라 선택되는 키워드일 뿐 실행 문장이 아니다. 또 두 케이스를 실행했으니 100%라고 넘겨짚는 실수가 흔한데, 'HIGH'를 출력하는 경우가 하나도 없었다는 점을 놓친 탓이다."},{"id":"F23","src":"F","no":23,"ch":4,"topic":"분기 커버리지 계산","klevel":"K3","key":["Branch coverage","Decision coverage"],"q":"다음 의사코드에 테스트 케이스 두 개를 실행했다. **분기 커버리지(Branch coverage)** 로 옳은 것은?\n· TC1: X = 120, Y = 5\n· TC2: X = 50, Y = 5","html":"<pre class='code'>1  read X, Y\n2  if (X &gt;= 0 and Y &gt;= 0) then\n3      Z = X + Y\n4  else\n5      Z = 0\n6  end if\n7  if (Z &gt; 100) then\n8      print \"OVER\"\n9  end if\n10 print Z</pre>","opts":["50%","75%","86%","100%"],"answer":1,"why":"분기는 2번 조건문의 참·거짓과 7번 조건문의 참·거짓으로 모두 4개다. TC1은 2번이 참이고 Z=125라 7번도 참이며, TC2는 2번이 참이고 Z=55라 7번은 거짓이다. 실행한 분기는 3개이므로 3 ÷ 4 = 75%다.","trap":"86%는 이 두 케이스의 **구문** 커버리지(7문장 중 6문장)다. 분기 커버리지를 물었는데 구문 커버리지를 계산해 고르는 것이 대표적 실수다. 두 케이스 모두 2번 조건이 참이었으므로 else 쪽 분기는 한 번도 실행되지 않았다."},{"id":"F24","src":"F","no":24,"ch":4,"topic":"상태 전이 · 커버리지 수준(0/1/N-switch)","klevel":"K2","key":["N-switch coverage","0-switch coverage","All states coverage"],"q":"상태 전이 테스팅의 커버리지 수준에 대한 설명으로 **옳은** 것은?","opts":["0-switch 커버리지는 모든 상태를 최소 한 번 방문하는 것이다","N-switch 커버리지는 N+1개의 연속된 전이로 이루어진 시퀀스를 모두 실행하는 것이며, N이 커질수록 더 엄격하다","N-switch 커버리지에서 N은 테스트 케이스의 개수를 뜻한다","1-switch 커버리지를 100% 달성하면 2-switch 커버리지도 자동으로 100% 달성된다"],"answer":1,"why":"커버리지 수준은 약한 것에서 강한 것 순으로 모든 상태 → 0-switch → 1-switch → … → N-switch다. 0-switch는 모든 유효 전이(길이 1)를, 1-switch는 연결된 전이 쌍(길이 2)을, N-switch는 길이 N+1의 시퀀스를 모두 실행하는 것을 뜻하며, N이 커질수록 요구하는 조합이 늘어 더 엄격해진다.","trap":"모든 상태를 최소 한 번 방문하는 것은 전이를 보지 않는 가장 약한 수준인 '모든 상태(all states)' 커버리지다. 커버리지 수준은 낮은 쪽을 달성해도 높은 쪽이 자동으로 달성되지 않는다 — 0-switch를 100% 해도 1-switch가 되지 않고, 1-switch를 100% 해도 2-switch가 되지 않는다. 반대 방향(높은 수준 → 낮은 수준)만 성립한다."},{"id":"F25","src":"F","no":25,"ch":4,"topic":"상태 전이 · 전이 커버리지 계산","klevel":"K3","key":["State transition testing","Transition coverage","0-switch coverage"],"q":"어떤 주문 처리 시스템의 유효 전이는 다음과 같다.\nS1→S2, S2→S3, S3→S1, S3→S4, S4→S2, S4→S5, S5→S1\n테스트 케이스 두 개를 실행했다.\n· TC1: S1 → S2 → S3 → S4 → S5 → S1\n· TC2: S1 → S2 → S3 → S1\n**유효 전이 커버리지**와 실행되지 않은 전이로 옳은 것은?","opts":["71%, S3→S1","86%, S3→S3","100%, 없음","86%, S4→S2"],"answer":3,"why":"7개 전이 가운데 S1→S2, S2→S3, S3→S4, S4→S5, S5→S1(TC1)과 S3→S1(TC2)의 6개가 실행되어 6 ÷ 7 ≈ 86%다. TC1은 S4에서 S5로 갔고 TC2는 S2에서 S3로만 갔으므로, S4에서 S2로 돌아가는 전이는 실행되지 않았다.","trap":"두 케이스가 같은 전이를 여러 번 지나므로 '전이를 세면 더 나온다'고 착각하기 쉽다. 커버리지는 중복 없이 센 '서로 다른 전이의 개수'다. 71%는 TC1만 실행했을 때의 값이다. 전이 커버리지는 상태가 아니라 전이를 세는 지표라는 점도 기억한다."},{"id":"F26","src":"F","no":26,"ch":4,"topic":"결정 테이블 축소","klevel":"K3","key":["Decision table","Don't care","Rule merging"],"q":"쿠폰 발급 규칙을 결정 테이블로 작성했다.\n· R1: C1=Y, C2=Y, C3=Y → A1(10% 쿠폰)\n· R2: C1=Y, C2=Y, C3=N → A1(10% 쿠폰)\n· R3: C1=Y, C2=N, C3=Y → A2(5% 쿠폰)\n· R4: C1=Y, C2=N, C3=N → A3(쿠폰 없음)\n무관 조건(don't care, '–')을 사용해 테이블을 축소할 때, 옳은 것은?","opts":["R1과 R2는 C3만 다르고 액션이 같으므로 C3를 '–'로 하여 하나로 합칠 수 있고, 축소 후 규칙은 3개가 된다","R1과 R3은 C1이 같으므로 C1을 '–'로 하여 하나로 합칠 수 있고, 축소 후 규칙은 3개가 된다","R2와 R4는 C3이 N으로 같으므로 C3을 '–'로 하여 하나로 합칠 수 있고, 축소 후 규칙은 3개가 된다","액션이 다른 규칙만 있으므로 합칠 수 있는 규칙이 없어 규칙은 4개 그대로다"],"answer":0,"why":"무관 조건으로 합칠 수 있는 것은 '조건 하나만 다르고 나머지 조건과 액션이 모두 같은' 규칙이다. R1과 R2는 C3만 다르고 액션이 A1으로 같으므로 C3를 '–'로 표시해 하나의 규칙으로 합친다. 남는 규칙은 3개다.","trap":"조건 하나가 같은 것만 보고 합치면 안 된다. R1과 R3은 액션부터 다르고, R2와 R4는 C2와 액션이 모두 다르다. 축소는 '액션이 같고, 조건 하나만 다른' 쌍에서만 성립한다."},{"id":"F27","src":"F","no":27,"ch":4,"topic":"탐색적 테스팅 · 테스트 차터","klevel":"K2","key":["Exploratory testing","Test charter","Session-based test management"],"q":"탐색적 테스팅을 관리하는 방식인 **세션 기반 테스트 관리**에서 테스트 차터(Test charter)에 대한 설명으로 옳은 것은?","opts":["테스트 케이스의 입력값과 기대 결과를 표로 상세히 기술한 문서다","테스터가 하루 동안 실행해야 하는 테스트 케이스의 개수를 정한 할당표다","테스트 세션에서 다룰 테스트의 목적과 범위를 한두 문장으로 기술한 것으로, 테스터는 그 안에서 설계와 실행을 동시에 수행한다","결함의 재현 절차와 심각도를 기록하는 보고서다"],"answer":2,"why":"탐색적 테스팅을 관리하려고 세션 단위로 시간을 정하고, 차터에 그 세션의 테스트 목적과 범위를 적는다. 차터는 상세 절차가 아니라 방향을 제시하는 문장이며, 테스터는 그 안에서 학습·설계·실행을 동시에 한다.","trap":"차터를 '상세 테스트 케이스'로 착각하면 표 형식 보기를 고른다. 차터는 자유도를 남겨 두는 목적 기술이고, 탐색적 테스팅의 핵심은 설계와 실행을 동시에 한다는 점이다."},{"id":"F28","src":"F","no":28,"ch":4,"topic":"협업 기반 테스팅 · BDD","klevel":"K2","key":["BDD","Given/When/Then","Acceptance criteria","ATDD"],"q":"협업 기반 테스트 접근법에서 사용자 스토리의 인수 조건을 **Given / When / Then** 형식으로 표현하는 방식과 가장 관련 깊은 것은?","opts":["TDD(테스트 주도 개발)","BDD(행위 주도 개발)","체크리스트 기반 테스팅","오류 추정(Error guessing)"],"answer":1,"why":"Given(사전 조건) / When(행위) / Then(기대 결과)은 BDD의 행위 시나리오 형식이다. BDD는 인수 조건을 행위 중심으로 표현해 개발자·테스터·비즈니스가 같은 언어로 대화하게 한다.","trap":"ATDD와 BDD를 같은 것으로 보는 것이 함정이다. ATDD는 인수 조건을 먼저 합의하고 그것을 통과하도록 개발하는 접근법이고, BDD는 그 인수 조건을 Given/When/Then 형식으로 표현하는 방식이다. TDD는 단위 테스트를 먼저 쓰는 개발 방식이라 초점이 다르다."},{"id":"F29","src":"F","no":29,"ch":4,"topic":"테스트 기법 선택","klevel":"K3","key":["Decision table testing","State transition testing","Test technique selection"],"q":"다음 상황에 가장 적합한 테스트 기법은?\n「자동차 구매 옵션 화면에서는 차종·엔진·변속기·색상의 조합에 따라 가격과 주문 가능 여부가 달라진다. 조합별 규칙이 많고, 특정 조합은 주문이 아예 불가능하다.」","opts":["상태 전이 테스팅","결정 테이블 테스팅","경계값 분석","탐색적 테스팅"],"answer":1,"why":"여러 조건의 조합에 따라 서로 다른 액션(가격·주문 가능 여부)이 결정되는 상황은 결정 테이블 테스팅이 가장 적합하다. 조합 규칙의 누락과 모순을 찾아낼 수 있다.","trap":"'주문이 불가능한 조합이 있다'는 표현 때문에 상태 전이를 떠올리기 쉽다. 상태 전이는 시간의 흐름에 따라 상태가 바뀌는 대상(주문→결제→배송)에 쓰고, 조건 조합이 결과를 정하는 경우는 결정 테이블이다. 차종·색상은 연속된 수치가 아니므로 경계값 분석도 아니다."},{"id":"F30","src":"F","no":30,"ch":5,"topic":"진입 기준 vs 출구 기준","klevel":"K2","key":["Entry criteria","Exit criteria","Definition of Done"],"q":"테스트 진입 기준(Entry criteria)과 출구 기준(Exit criteria)에 대한 설명으로 옳은 것은?","opts":["진입 기준은 테스트를 시작하기 전에 충족되어야 하는 조건이고, 출구 기준은 테스트를 완료했다고 판단하는 조건이다","진입 기준과 출구 기준은 모두 테스트가 끝난 뒤에 충족 여부를 평가한다","출구 기준은 테스트를 시작할 수 있는 환경·데이터·도구의 준비 상태를 뜻한다","진입 기준은 결함이 모두 수정되었는지를 확인하는 기준이고, 출구 기준은 실행한 테스트 케이스의 개수만을 뜻한다"],"answer":0,"why":"진입 기준은 테스트 활동을 시작하기 위한 전제 조건(테스트 베이시스 확보, 환경·도구 준비 등)이고, 출구 기준은 테스트를 마칠 수 있는지 판단하는 조건(커버리지 달성, 미해결 결함 수준, 잔여 리스크 등)이다.","trap":"환경·데이터·도구의 준비는 진입 기준이다. 출구 기준을 케이스 실행 개수로만 좁히는 설명도 틀린데, 커버리지·결함 밀도·잔여 리스크 수준 등이 함께 쓰인다. 두 기준 모두 계획 단계에서 정하고, 출구 기준의 충족 여부는 완료 보고서에 보고한다."},{"id":"F31","src":"F","no":31,"ch":5,"topic":"프로젝트 리스크 vs 제품 리스크","klevel":"K2","key":["Project risk","Product risk"],"q":"다음 중 **프로젝트 리스크(Project risk)** 에 해당하는 것은?","opts":["결제 모듈의 동시 접속 처리 성능이 요구 수준에 미치지 못할 수 있다","테스트 환경 서버를 제공하기로 한 협력 업체가 일정을 두 달 늦출 수 있다","주소 입력 화면이 해외 주소 형식을 처리하지 못할 수 있다","개인정보 마스킹이 누락되어 개인정보보호법을 위반할 수 있다"],"answer":1,"why":"프로젝트 리스크는 프로젝트와 테스트를 수행할 능력에 관한 리스크다(일정, 인력, 예산, 환경, 공급업체, 요구사항 변경 등). 테스트 환경 제공 지연은 테스트를 수행하지 못하게 만드는 프로젝트 리스크다.","trap":"성능 미달, 기능 미지원, 법규 위반은 모두 제품이 나빠지는 제품 리스크다. '테스트를 못 하게 되는가(프로젝트)'와 '제품이 나빠지는가(제품)'로 가른다."},{"id":"F32","src":"F","no":32,"ch":5,"topic":"3점 추정(PERT) 계산","klevel":"K3","key":["Three-point estimation","PERT","Standard deviation"],"q":"3점 추정으로 테스트 활동 기간을 추정했다. 낙관치 3일, 최빈치 6일, 비관치 21일일 때 **PERT 기대 기간**과 **표준편차**로 옳은 것은? (기대 기간 = (O + 4M + P) / 6, 표준편차 = (P − O) / 6)","opts":["기대 10일, 표준편차 3일","기대 8일, 표준편차 3일","기대 8일, 표준편차 18일","기대 9일, 표준편차 3일"],"answer":1,"why":"기대 기간 = (3 + 4×6 + 21) ÷ 6 = 48 ÷ 6 = 8일. 표준편차 = (21 − 3) ÷ 6 = 3일.","trap":"10일은 산술평균 (3+6+21)/3이다. 최빈치에 4를 곱하는 가중을 잊으면 이 값이 나온다. 표준편차 18일은 나누기 6을 빼먹은 계산이다. 두 공
