    계산 문제는 종이에 공식 → 대입 → 검산 3단계로.
    선택지는 <b>a·b·c·d</b>, PC에서는 키보드 <b>1~4 / ←→</b>로도 조작할 수 있어요.
  </div>`;
}

/* ============ render: chapter pick ============ */
function renderChapterPick(){
  S.screen = "chapterpick";
  stopTimer(); killNav(); setNav(false);
  const rows = [1,2,3,4,5,6].map(ch => {
    const n = QUESTIONS.filter(q => q.ch === ch).length;
    const st = chStats(ch);
    return `<button class="chitem" data-act="chapter" data-ch="${ch}">
      <div class="cno">${ch}</div>
      <div class="ct"><b>${CH_NAME[ch]}</b><i>${n}문항</i></div>
      <div class="acc">${st ? st.pct + "%" : "–"}</div>
    </button>`;
  }).join("");

  $view.innerHTML = `
    <div class="qbar"><div class="row">
      <button class="back" data-act="home">‹</button>
      <div class="prog">챕터별 골라 풀기</div>
      <div class="spacer"></div>
      <div class="mini">오답 <i>${wrongCount()}</i></div>
    </div></div>
    <div class="chlist" style="margin-top:10px">${rows}</div>
    <div class="footnote">문항 수는 D-1 파이널·실전 모의고사·Sample Exam A·v4.0 집중 훈련을 모두 합친 값이에요.
      실제 출제 비중은 Ch.4 11 · Ch.5 9 · Ch.1 8 · Ch.2 6 · Ch.3 4 · Ch.6 2 입니다.</div>`;
}

/* ============ quiz ============ */
function startQuiz(mode, chapter){
  const list = setFor(mode, chapter);
  if(!list.length){
    hint("해당하는 문항이 없어요");
    return;
  }
  S.screen = "quiz"; S.mode = mode; S.chapter = chapter || null;
  S.ids = list.map(q => q.id); S.idx = 0; S.ans = {};
  S.startedAt = Date.now();
  startTimer();
  renderQuiz();
  saveSession();
  window.scrollTo(0,0);
}
function resumeSession(){
  const s = store.session;
  if(!s || !s.ids) return renderHome();
  S.screen = "quiz"; S.mode = s.mode; S.chapter = s.chapter;
  S.ids = s.ids.filter(id => QBY_ID[id]);
  if(!S.ids.length) return renderHome();
  S.idx = Math.min(s.idx || 0, S.ids.length - 1);
  S.ans = s.ans || {};
  S.startedAt = s.startedAt || Date.now();
  startTimer();
  renderQuiz();
  window.scrollTo(0,0);
}

function renderQuiz(){
  const q = QBY_ID[S.ids[S.idx]];
  if(!q) return renderHome();
  const total = S.ids.length;
  const sel = S.ans[q.id];
  const answered = sel !== undefined && sel !== null;
  const correctN = S.ids.reduce((n,id) => n + (S.ans[id] === QBY_ID[id].answer ? 1 : 0), 0);
  const answeredN = S.ids.reduce((n,id) => n + (S.ans[id] !== undefined ? 1 : 0), 0);
  const accN = answeredN ? Math.round(correctN / answeredN * 100) : 0;
  const isLast = S.idx === total - 1;

  const opts = q.opts.map((o,i) => {
    let cls = "opt";
    let mark = "";
    if(answered){
      if(i === q.answer){ cls += " correct"; mark = "✓"; }
      else if(i === sel){ cls += " wrong"; mark = "✕"; }
      else cls += " dim";
    }
    return `<button class="${cls}" data-act="pick" data-i="${i}" ${answered ? "disabled" : ""}>
      <span class="lbl">${LETTER[i]}</span><span class="txt">${fmt(o)}</span>
      ${mark ? `<span class="mark">${mark}</span>` : ""}
    </button>`;
  }).join("");

  const inWrong = !!store.wrong[q.id];
  let expHTML = "";
  if(answered){
    const ok = sel === q.answer;
    expHTML = `
    <section class="exp" ${S.expOpen === false ? 'style="display:none"' : ""}>
      <div class="head ${ok ? "ok" : "no"}">
        ${ok ? "✓ 정답" : "✕ 오답"}
        <span class="sub">정답 ${LETTER[q.answer]} · ${CH_SHORT[q.ch]}</span>
      </div>
      <div class="body">
        <div class="blk"><h4>왜 정답</h4><p>${fmt(q.why)}</p></div>
        ${(q.optwhy && q.optwhy.length === 4) ? '<div class="blk"><h4>선지별 판정</h4><div class="owlist">' + q.opts.map(function(o,i){ return '<div class="ow ' + (i === q.answer ? "ok" : "no") + '"><span class="lbl">' + LETTER[i] + '</span><span class="tx"><b>' + (i === q.answer ? "정답" : "함정") + '</b> ' + fmt(q.optwhy[i]) + '</span></div>'; }).join("") + '</div></div>' : ""}
        <div class="blk trap"><h4>함정 포인트</h4><p>${fmt(q.trap)}</p></div>
        <div class="blk"><h4>핵심 영문 원어</h4>
          <div class="chips4">${(q.key || []).map(k => `<span>${esc(k)}</span>`).join("")}</div></div>
        <div class="blk"><h4>출제 영역</h4><p>${CH_SHORT[q.ch]} ${CH_NAME[q.ch]}${q.topic ? " · " + esc(q.topic) : ""}</p></div>
        ${inWrong && ok ? `<div class="rmrow">
            <button data-act="rmwrong" data-id="${q.id}">오답노트에서 빼기</button>
            <span class="hint">맞혔으니 빼도 돼요</span></div>` : ""}
      </div>
    </section>`;
  }

  const srcBadge = (S.mode === "chapter" || S.mode === "wrong")
    ? `<span class="badge">${SRC_NAME[q.src]}</span>` : "";

  $view.innerHTML = `
  <div class="qbar">
    <div class="row">
      <button class="back" data-act="exit">‹</button>
      <div class="prog">${S.idx + 1} <em>/ ${total}</em></div>
      <div class="spacer"></div>
      <div class="timer" id="timer">00:00</div>
      <div class="mini"><b>${answeredN ? accN + "%" : "–"}</b> · <i>${wrongCount()}</i></div>
    </div>
    <div class="pbar"><i style="width:${Math.round((S.idx + 1) / total * 100)}%"></i></div>
  </div>

  <section class="qcard">
    <div class="badges">
      <span class="badge ch">${CH_SHORT[q.ch]}</span>
      ${srcBadge}
      ${q.label ? `<span class="badge">${esc(q.label)}</span>` : `<span class="badge">${q.no}번</span>`}
      ${q.topic ? `<span class="badge tp">${esc(q.topic)}</span>` : ""}
    </div>
    <div class="qtext">${fmt(q.q)}</div>
    ${q.html ? `<div class="qhtml">${q.html}</div>` : ""}
  </section>

  <section class="opts ${answered ? "locked" : ""}" id="opts">${opts}</section>
  ${expHTML}
  `;

  const nav = document.createElement("div");
  nav.className = "nav";
  nav.innerHTML = `<div class="in">
    <button class="btn" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← 이전</button>
    <button class="btn" data-act="toggleExp" ${answered ? "" : "disabled"}>${S.expOpen === false ? "해설 펼치기" : "해설 접기"}</button>
    <button class="btn primary wide" data-act="next">${isLast ? "결과 보기" : "다음 →"}</button>
  </div>`;
  killNav();
  document.body.appendChild(nav);
  setNav(true);

  paint();
}
function paint(){
  if(S.screen !== "quiz") return;
  const q = QBY_ID[S.ids[S.idx]];
  if(!q) return;
  const sel = S.ans[q.id];
  const answered = sel !== undefined;
  const correctN = S.ids.reduce((n,id) => n + (S.ans[id] === QBY_ID[id].answer ? 1 : 0), 0);
  const answeredN = S.ids.reduce((n,id) => n + (S.ans[id] !== undefined ? 1 : 0), 0);
  const accN = answeredN ? Math.round(correctN / answeredN * 100) : 0;
  const mini = document.querySelector(".qbar .mini");
  if(mini) mini.innerHTML = `<b>${answeredN ? accN + "%" : "–"}</b> · <i>${wrongCount()}</i>`;
}

function answer(i){
  const q = QBY_ID[S.ids[S.idx]];
  if(!q || S.ans[q.id] !== undefined) return;
  S.ans[q.id] = i;
  S.expOpen = true;
  const ok = i === q.answer;
  // 통계
  store.stat.a += 1;
  if(ok) store.stat.c += 1;
  const cs = store.ch[q.ch] || (store.ch[q.ch] = {a:0, c:0});
  cs.a += 1; if(ok) cs.c += 1;
  // 오답노트
  if(!ok){
    const prev = store.wrong[q.id] || {n:0};
    store.wrong[q.id] = {n:(prev.n || 0) + 1, ts:Date.now()};
  }
  saveStore();
  saveSession();
  renderQuiz();
  const exp = document.querySelector(".exp");
  if(exp){
    const r = exp.getBoundingClientRect();
    if(r.bottom > window.innerHeight){
      window.scrollBy({top: Math.min(r.height, r.bottom - window.innerHeight + 24), behavior:"smooth"});
    }
  }
}

function goNext(){
  if(S.idx < S.ids.length - 1){
    S.idx += 1; S.expOpen = true;
    saveSession(); renderQuiz(); window.scrollTo(0,0);
  } else {
    renderResult();
  }
}
function goPrev(){
  if(S.idx > 0){
    S.idx -= 1; S.expOpen = true;
    saveSession(); renderQuiz(); window.scrollTo(0,0);
  }
}

/* ============ timer ============ */
function startTimer(){
  stopTimer();
  tickT = setInterval(() => {
    const el = document.getElementById("timer");
    if(!el) return;
    const s = Math.max(0, Math.floor((Date.now() - S.startedAt) / 1000));
    el.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  }, 500);
}
function stopTimer(){ if(tickT){ clearInterval(tickT); tickT = null; } }

/* ============ result ============ */
function renderResult(){
  stopTimer();
  S.screen = "result";
  killNav(); setNav(false);

  const total = S.ids.length;
  const items = S.ids.map(id => QBY_ID[id]);
  const missed = items.filter(q => S.ans[q.id] !== q.answer);
  const unanswered = items.filter(q => S.ans[q.id] === undefined).length;
  const correct = total - missed.length;
  const pct = Math.round(correct / total * 100);
  const passLine = total === 40 ? 26 : Math.ceil(total * 0.65);
  const passed = correct >= passLine;
  lastWrongIds = missed.map(q => q.id);

  const chs = [...new Set(items.map(q => q.ch))].sort();
  const bars = chs.map(ch => {
    const sub = items.filter(q => q.ch === ch);
    const ok = sub.filter(q => S.ans[q.id] === q.answer).length;
    const p = Math.round(ok / sub.length * 100);
    const cls = p < 50 ? "low" : p < 70 ? "mid" : "";
    return `<div class="bar">
      <div class="bl"><span>${CH_SHORT[ch]} ${CH_NAME[ch]}</span><span>${ok}/${sub.length} · ${p}%</span></div>
      <div class="bt"><i class="${cls}" style="width:${p}%"></i></div>
    </div>`;
  }).join("");

  const missRows = missed.map(q => {
    const tag = S.ans[q.id] === undefined ? "미응답" : "오답";
    const head = q.label ? q.label : (q.no + "번");
    return `<button class="wrongrow" data-act="review" data-id="${q.id}">
      <span class="wr-no">${tag}</span>
      <span class="wr-t"><b style="color:var(--ink2)">${esc(head)}</b> · ${esc(q.q.replace(/\*\*/g,"").replace(/\n/g," ")).slice(0,70)}</span>
    </button>`;
  }).join("");

  $view.innerHTML = `
  <div class="qbar"><div class="row">
    <button class="back" data-act="home">‹</button>
    <div class="prog">채점 결과</div><div class="spacer"></div>
    <div class="mini">정답 <b>${correct}</b> · 오답 <i>${missed.length}</i></div>
  </div></div>

  <div class="scorecard">
    <div class="verdict ${passed ? "pass" : "fail"}">${passed ? "합격선 통과" : "합격선 미달"}</div>
    <div class="bignum">${correct}<small> / ${total}</small></div>
    <div class="scoreline">정답률 <b style="color:${passed ? "var(--ok)" : "var(--bad)"}">${pct}%</b> · 합격 기준 ${passLine}/${total} (65%)${unanswered ? ` · 미응답 ${unanswered}` : ""}</div>
    <div class="bars">${bars}</div>
  </div>

  ${missed.length ? `
    <div class="sec-title"><h2>틀린 문제 · 미응답</h2><span>${missed.length}개</span></div>
    <div class="wronglist">${missRows}</div>` : `
    <div class="empty"><div class="ico">🎉</div><h3>전부 맞혔어요</h3><p>이 세트는 오답도 미응답도 없습니다.</p></div>`}

  <div class="center-actions">
    ${missed.length ? `<button class="btn primary" data-act="retrywrong">틀린 문제 ${missed.length}개 바로 재도전</button>` : ""}
    <button class="btn" data-act="again">같은 세트 다시 풀기</button>
    <button class="btn" data-act="home">처음으로</button>
  </div>`;

  clearSession();
  window.scrollTo(0,0);
}

/* ============ review one question from result ============ */
function startWith(ids, mode, idx){
  if(!ids || !ids.length){ hint("해당하는 문항이 없어요"); return; }
  S.screen = "quiz"; S.mode = mode; S.chapter = null;
  S.ids = ids.slice(); S.idx = Math.max(0, Math.min(idx || 0, ids.length - 1));
  S.ans = {}; S.expOpen = true; S.startedAt = Date.now();
  startTimer(); renderQuiz(); saveSession(); window.scrollTo(0,0);
}
function reviewOne(id){
  const pool = lastWrongIds.length ? lastWrongIds : [id];
  const i = pool.indexOf(id);
  startWith(pool, "wrong", i < 0 ? 0 : i);
}

/* ============ events ============ */

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "mode"){
    const m = el.dataset.mode;
    if(m === "wrong" && !wrongCount()){ hint("저장된 오답이 없어요"); return; }
    startQuiz(m, null);
    return;
  }
  if(act === "chapterpick"){ renderChapterPick(); return; }
  if(act === "chapter"){ startQuiz("chapter", el.dataset.ch); return; }
  if(act === "home"){ renderHome(); window.scrollTo(0,0); return; }
  if(act === "exit"){
    saveSession();
    renderHome(); window.scrollTo(0,0); return;
  }
  if(act === "resume"){ resumeSession(); return; }
  if(act === "pick"){ answer(Number(el.dataset.i)); return; }
  if(act === "next"){ goNext(); return; }
  if(act === "prev"){ goPrev(); return; }
  if(act === "toggleExp"){
    S.expOpen = S.expOpen === false ? true : false;
    saveSession();
    renderQuiz();
    return;
  }
  if(act === "rmwrong"){
    delete store.wrong[el.dataset.id];
    saveStore();
    hint("오답노트에서 뺐어요");
    renderQuiz();
    return;
  }
  if(act === "review"){ reviewOne(el.dataset.id); return; }
  if(act === "retrywrong"){
    const ids = lastWrongIds.filter(id => QBY_ID[id]);
    if(!ids.length){ hint("오답이 없어요"); return; }
    startWith(ids, "wrong", 0);
    return;
  }
  if(act === "again"){
    if(S.mode === "wrong"){ startWith(lastWrongIds, "wrong", 0); return; }
    startQuiz(S.mode, S.chapter);
    return;
  }
  if(act === "reset"){
    if(confirm("진도와 오답노트를 모두 지울까요? 되돌릴 수 없어요.")){
      store = {wrong:{}, ch:{}, stat:{a:0,c:0}};
      saveStore();
      hint("초기화했어요");
      renderHome();
    }
    return;
  }
});

document.addEventListener("keydown", (e) => {
  if(S.screen !== "quiz") return;
  const q = QBY_ID[S.ids[S.idx]];
  if(!q) return;
  const k = e.key;
  if(["1","2","3","4"].includes(k)){ answer(Number(k) - 1); }
  else if(["a","b","c","d"].includes(k.toLowerCase())){ answer(LETTER.indexOf(k.toLowerCase())); }
  else if(k === "ArrowRight"){ goNext(); }
  else if(k === "ArrowLeft"){ goPrev(); }
  else if(k === "Enter"){ goNext(); }
});

/* ============ boot ============ */
renderHome();
</script>
</body>
</html>
