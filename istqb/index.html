식 모두 분모가 6이라는 점을 기억하면 계산 실수가 줄어든다."},{"id":"F33","src":"F","no":33,"ch":5,"topic":"리스크 완화 활동","klevel":"K2","key":["Risk mitigation","Risk assessment","Risk identification"],"q":"리스크 수준(발생 가능성 × 영향)이 높게 평가된 항목에 대해 '테스트를 더 일찍, 더 깊게 수행하고 해당 영역에 경험 많은 테스터를 배치한다'는 조치를 결정했다. 이 활동에 해당하는 것은?","opts":["리스크 식별(Risk identification)","리스크 평가(Risk assessment)","리스크 완화(Risk mitigation)","리스크 모니터링(Risk monitoring)"],"answer":2,"why":"리스크 관리는 식별 → 분석(평가) → 완화(대응) → 모니터링 순으로 진행된다. 평가된 리스크 수준에 따라 테스트 범위·깊이·우선순위·자원을 조정하는 것은 완화 조치다.","trap":"리스크 수준을 산정해 우선순위를 정하는 단계는 평가(분석)다. 이 문제의 핵심은 '조치를 결정했다'이므로, 점수를 매기는 단계(평가)와 그에 따라 행동을 정하는 단계(완화)를 구분해야 한다."},{"id":"F34","src":"F","no":34,"ch":5,"topic":"테스트 추정 기법","klevel":"K2","key":["Planning poker","Expert judgment","Ratio-based estimation","Metric-based estimation"],"q":"테스트 추정 기법에 대한 설명으로 옳은 것은?","opts":["비율 기반 추정은 과거 여러 프로젝트의 데이터를 통계적으로 분석해 회귀식을 만드는 기법이다","메트릭 기반 추정은 테스터의 직관과 경험만으로 추정하는 기법이다","전문가 판단은 테스트 케이스 수와 실행 속도 같은 측정값만으로 추정하는 기법이다","계획 포커(Planning poker)는 팀원이 각자 추정치를 동시에 공개하고 합의에 이를 때까지 논의하는 전문가 기반 기법이다"],"answer":3,"why":"추정 기법은 전문가 기반(전문가 판단, 계획 포커, 델파이), 비율 기반(과거 유사 프로젝트의 비율), 메트릭 기반(측정 데이터·통계), 3점 추정 등으로 나뉜다. 계획 포커는 전문가 기반 기법으로, 동시 공개와 반복 합의로 편향을 줄인다.","trap":"나머지 보기는 각 기법의 정의를 서로 바꿔 놓았다. 비율 기반은 유사 프로젝트의 비율, 메트릭 기반은 측정 데이터, 전문가 판단은 경험과 지식이다. '직관'이 나오면 전문가 기반, '측정값·통계'가 나오면 메트릭 기반으로 구분한다."},{"id":"F35","src":"F","no":35,"ch":5,"topic":"테스트 모니터링 vs 테스트 제어","klevel":"K2","key":["Test monitoring","Test control","Test metrics"],"q":"테스트 모니터링(Test monitoring)과 테스트 제어(Test control)에 대한 설명으로 옳은 것은?","opts":["모니터링은 테스트 진행 상황에 대한 정보를 수집·보고하는 활동이고, 제어는 그 정보를 바탕으로 테스트 계획을 수정하거나 조치를 취하는 활동이다","모니터링은 결함을 수정하는 활동이고, 제어는 결함을 보고하는 활동이다","제어는 테스트 계획 단계에서만 수행되고, 모니터링은 테스트 완료 후에만 수행된다","모니터링과 제어는 같은 활동이며, 지표를 수집하면 계획이 자동으로 수정된다"],"answer":0,"why":"모니터링은 진행률, 결함 밀도, 커버리지 같은 지표를 수집해 실제 진행을 계획과 비교하는 활동이고, 제어는 비교 결과에 따라 우선순위·일정·범위·자원을 조정하는 후속 활동이다.","trap":"지표를 '수집하는 것'과 그에 따라 '바꾸는 것'을 구분해야 한다. 지표만 모으고 조치를 취하지 않으면 모니터링에서 끝난 것이다. 결함 수정은 테스터의 관리 활동이 아니라 디버깅(개발)이다."},{"id":"F36","src":"F","no":36,"ch":5,"topic":"추적성(Traceability)","klevel":"K2","key":["Traceability","Coverage","Impact analysis"],"q":"테스트에서 추적성(Traceability)에 대한 설명으로 옳은 것은?","opts":["테스트 베이스(요구사항)와 테스트 케이스, 테스트 결과, 결함 사이의 관계를 연결해 두는 것이다","테스트 케이스 실행 시간과 테스터의 작업 시간을 기록하는 것이다","결함이 몇 번 재발했는지 횟수를 세는 것이다","테스트 대상과 테스트 산출물의 버전을 식별하고 통제하는 것이다"],"answer":0,"why":"추적성은 요구사항(테스트 베이시스)과 테스트 케이스, 실행 결과, 결함을 연결하는 것이다. 이를 통해 요구사항 커버리지 확인, 변경의 영향 분석, 리스크 평가와 완료 보고가 가능해진다.","trap":"버전을 식별하고 통제하는 것은 형상 관리(configuration management)다. 추적성은 '무엇을 무엇으로 테스트했는가'의 연결 관계이고, 형상 관리는 산출물의 버전을 식별·통제하는 활동이다. 둘은 함께 쓰이지만 같은 개념이 아니다."},{"id":"F37","src":"F","no":37,"ch":5,"topic":"결함 보고서 필수 항목 · 버전 식별","klevel":"K2","key":["Defect report","Version identification","Test object"],"q":"다음 결함 보고서에서 빠져 있어 재현과 수정에 가장 문제가 되는 정보는?\n「제목: 장바구니에서 수량을 0으로 바꾸면 결제 버튼이 비활성화되지 않음\n재현 절차: 상품을 장바구니에 담고 수량을 0으로 변경\n기대 결과: 결제 버튼이 비활성화되어야 함\n실제 결과: 결제 버튼이 활성화됨\n심각도: 중간 · 우선순위: 높음 · 보고자: 김테스터」","opts":["결함의 제목(title)","재현 절차(steps to reproduce)","테스트 대상과 테스트 환경의 버전 식별 정보","심각도(severity)와 우선순위(priority)"],"answer":2,"why":"결함 보고서에는 결함 ID, 제목, 요약, 재현 절차, 기대·실제 결과, 심각도·우선순위, 보고자, 그리고 테스트 대상과 테스트 환경의 버전 식별 정보가 필요하다. 버전이 없으면 어떤 빌드에서 발생한 문제인지 확인할 수 없어 재현과 수정이 어렵다.","trap":"재현 절차와 기대·실제 결과는 이미 충분히 적혀 있어 함정이 없다. 결함 보고서 문제에서는 '어떤 버전에서'가 빠지기 쉽고, 이 항목이 없으면 개발자가 재현에 실패해 결함이 반려된다."},{"id":"F38","src":"F","no":38,"ch":5,"topic":"테스트 완료 활동","klevel":"K2","key":["Test completion","Lessons learned","Testware archiving"],"q":"테스트 완료(Test completion) 활동에 해당하지 **않는** 것은?","opts":["테스트 산출물을 정리해 다음 릴리스나 프로젝트에서 재사용할 수 있도록 아카이브한다","이해관계자에게 테스트 완료 보고서를 전달하고, 교훈(lessons learned)을 도출한다","테스트 진입 기준의 충족 여부를 확인하고 테스트 환경을 새로 구축한다","완료된 테스트 환경을 정리하고, 해결되지 않은 결함을 관련 담당자에게 인계한다"],"answer":2,"why":"테스트 완료 활동은 완료 보고서 작성, 테스트 산출물 아카이브, 테스트 환경 정리, 잔여 결함 인계, 교훈 정리 등이다. 진입 기준을 확인하고 환경을 구축하는 것은 테스트 계획·준비 단계의 일이다.","trap":"'환경'과 '기준'이 들어간 보기가 완료 활동처럼 보인다. 완료 단계에서는 환경을 '정리'하고, 준비 단계에서는 환경을 '구축'한다. 동사가 단계를 결정한다."},{"id":"F39","src":"F","no":39,"ch":6,"topic":"테스트 도구 도입 시 고려사항","klevel":"K2","key":["Tool adoption","Pilot project","Cost-benefit","Test automation"],"q":"테스트 도구를 도입할 때 고려해야 할 사항으로 **가장 거리가 먼** 것은?","opts":["도구의 사용 목적과 요구사항을 명확히 하고, 소규모 파일럿으로 먼저 평가한다","평가 시 라이선스 비용뿐 아니라 교육·유지보수·도구 통합 비용과 정착에 걸리는 시간을 함께 계산한다","도구가 수작업 테스트의 부담을 즉시 크게 줄여 주므로, 조직의 교육과 프로세스 변경은 생략해도 된다","도구 사용의 효과와 위험을 정기적으로 점검하고, 사용 방식을 지속적으로 개선한다"],"answer":2,"why":"도구는 교육과 프로세스 변경이 뒷받침되지 않으면 효과를 내기 어렵다. 도입 전 목적 정의와 파일럿 평가, 비용과 정착 시간 산정, 도입 후 정기적인 효과·위험 점검이 필요하다.","trap":"'수작업 부담을 즉시 줄인다'는 기대와 '교육·프로세스 변경은 필요 없다'는 결론을 한 보기에 붙여 놓았다. 도구 도입 실패의 가장 흔한 원인이 교육 부족, 비현실적 기대, 정착 시간 과소평가다."},{"id":"F40","src":"F","no":40,"ch":6,"topic":"테스트 도구 유형","klevel":"K2","key":["Static analysis tool","Configuration management tool","Test execution tool","Defect management tool"],"q":"테스트 도구의 유형과 역할의 연결로 **옳지 않은** 것은?","opts":["형상 관리 도구 — 테스트 대상과 테스트 산출물의 버전을 식별하고 통제한다","결함 관리 도구 — 결함의 기록·추적·상태 변경을 관리한다","테스트 실행 도구 — 테스트 스크립트를 실행하고 실제 결과를 기대 결과와 비교한다","정적 분석 도구 — 테스트 케이스를 실행해 런타임 성능을 측정한다"],"answer":3,"why":"정적 분석 도구는 소프트웨어를 실행하지 않고 코드와 문서를 분석한다. 실행 중 성능을 측정하는 것은 성능 측정 도구이자 동적 도구다.","trap":"'분석 도구'라는 이름에 성능 분석을 떠올리면 낚인다. 정적은 실행하지 않음, 동적은 실행함이다. 형상 관리 도구는 테스트 대상·산출물의 버전을 식별하는 데 쓰이므로 테스트 실행 도구나 결함 관리 도구와 구분한다."},{"id":"M01","src":"M","no":1,"ch":1,"topic":"테스팅의 목적","key":["Testing objectives"],"q":"다음 중 ISTQB에서 정의한 테스팅의 일반적인 목적으로 **가장 거리가 먼** 것은?","opts":["요구사항·사용자 스토리·설계·코드 등 작업 산출물을 평가하는 것","결함 및 결함의 원인을 발견하고 분석하는 것","소프트웨어에 결함이 존재하지 않음을 증명하는 것","계약·법적·규제 요구사항의 충족과 품질 게이트 기준의 충족을 입증하는 것"],"answer":2,"why":"테스팅의 목적은 작업 산출물 평가, 결함과 원인 발견, 커버리지 측정, 출시 위험 감소, 계약·법규·품질 게이트 충족 입증, 의사결정 정보 제공이다. '결함이 없음을 증명'은 목록에 없다.","trap":"'테스트를 철저히 하면 결함이 없다는 것을 입증할 수 있다'는 원칙 1(결함의 존재만 보여준다)에 정면 위배. '증명·보장·완전히'가 붙은 보기는 대부분 오답이다."},{"id":"M02","src":"M","no":2,"ch":1,"topic":"테스트웨어","key":["Testware","Test basis","Test object"],"q":"테스트웨어(Testware)에 대한 설명으로 옳은 것은?","opts":["테스트 대상이 되는 소프트웨어 컴포넌트를 말한다","테스트 케이스를 도출하는 근거가 되는 요구사항·설계 문서를 말한다","테스트 계획서·테스트 케이스·테스트 데이터·테스트 결과·결함 보고서 등 테스트 과정에서 생성되는 모든 산출물을 말한다","테스트를 자동화하는 상용 도구와 라이선스를 말한다"],"answer":2,"why":"테스트웨어는 테스트 과정에서 생성되는 모든 산출물이다. 계획서·케이스·데이터·스크립트·결과·결함 보고서·환경 설정까지 포함한다.","trap":"①은 테스트 대상(test object), ②는 테스트 베이스(test basis), ④는 테스트 도구의 정의다. 세 용어를 한 문제에 모아 서로 바꿔 놓는 것이 단골 패턴. '~등 모든 산출물'처럼 범위를 넓힌 보기가 정답인 경우가 많다."},{"id":"M03","src":"M","no":3,"ch":1,"topic":"7원칙 · 살충제 패러독스","key":["Pesticide paradox","Defect clustering"],"q":"어떤 팀이 3년 동안 동일한 회귀 테스트 세트를 변경 없이 반복 실행했다. 그 결과 최근 릴리스에서는 테스트로 발견되는 결함 수가 급격히 줄었고, 대신 고객이 먼저 결함을 발견하는 일이 늘었다. 이 상황과 가장 관련 있는 테스팅 원칙과 그에 대한 대응으로 옳은 것은?","opts":["결함 집중 — 결함이 많이 발견된 모듈에 테스트를 더 집중한다","살충제 패러독스 — 기존 테스트 케이스를 정기적으로 검토·갱신하고 새로운 테스트를 추가한다","전체 테스팅은 불가능하다 — 리스크 기반으로 테스트 우선순위를 정한다","조기 테스팅 — 요구사항 단계에서 정적 테스팅을 수행한다"],"answer":1,"why":"같은 테스트를 계속 반복하면 더 이상 새 결함을 찾지 못하는 현상이 살충제 패러독스(테스트는 망각에 취약하다)다. 대응은 테스트 케이스의 정기적 검토·갱신과 신규 테스트 추가다.","trap":"① 결함 집중은 '결함이 많은 모듈에 집중'이라는 다른 원칙. ③은 우선순위, ④는 시점 문제. 상황 문장에 '반복', '오래된 테스트', '새 결함 감소', '고객이 먼저 발견'이 나오면 살충제."},{"id":"M04","src":"M","no":4,"ch":1,"topic":"QA vs QC","key":["Quality Assurance","Quality Control"],"q":"테스팅과 품질 보증(QA)의 관계에 대한 설명으로 옳은 것은?","opts":["테스팅은 QA와 동일한 개념이므로 테스팅을 충분히 수행하면 QA 활동은 필요 없다","QA는 제품 중심 활동이고, 테스팅은 프로세스 중심 활동이다","QA는 테스트 실행 결과를 바탕으로 결함을 수정하는 활동이다","테스팅은 QC(품질 제어)의 한 형태로 제품의 결함을 발견하는 활동이며, QA는 프로세스를 개선하여 결함 발생 자체를 예방하는 활동이다"],"answer":3,"why":"테스팅은 QC(품질 제어)의 한 형태로 제품의 결함을 발견하고, QA는 프로세스를 개선해 결함 발생을 예방한다.","trap":"① '테스팅 = QA'는 가장 흔한 오답. ②는 주체를 정확히 반대로 뒤집었다. ③은 QA를 '결함 수정'으로 정의했는데 수정은 디버깅이다. QA=예방(프로세스), QC=발견(제품), 디버깅=수정."},{"id":"M05","src":"M","no":5,"ch":1,"topic":"확인 vs 검증","key":["Verification","Validation"],"q":"다음 중 **검증 테스팅(Validation testing)** 의 예로 가장 적절한 것은?","opts":["요구사항 명세서에 정의된 필드 길이와 상세 설계서의 정의가 일치하는지 검토한다","실제 사용자가 프로토타입을 사용하여 자신의 업무를 처리해 보고, 업무 목적을 달성하는지 평가한다","정적 분석 도구로 코딩 표준 위반 여부를 확인한다","테스트 계획서에 정의된 출구 기준의 충족 여부를 확인한다"],"answer":1,"why":"검증(Validation)은 '올바른 제품을 만들고 있는가' — 사용자가 실제 목적을 달성하는가를 확인한다. 실제 사용자가 프로토타입으로 업무를 처리해 보는 것은 전형적인 validation이다.","trap":"①·③·④는 모두 명세·표준·계획과의 일치 확인이므로 확인(Verification)이다. '명세서/설계서/표준/계획과 일치' = 확인, '사용자/업무/실사용/목적 달성' = 검증."},{"id":"M06","src":"M","no":6,"ch":1,"topic":"오류·결함·장애","key":["Error","Defect","Failure","Root cause"],"q":"다음 상황에서 **결함(defect)** 에 해당하는 것은?","html":"<div class='quote'>요구사항에는 \"1,000원 <b>이상</b> 구매 시 무료 배송\"으로 정의되어 있다. 개발자 김 씨는 이를 \"1,000원 <b>초과</b>\"로 잘못 읽고 조건문에 <code>&gt; 1000</code>을 사용했다. 그 결과 1,000원짜리 상품을 구매한 고객에게 배송비가 청구되었다.</div>","opts":["코드의 조건문 > 1000","개발자가 요구사항을 잘못 읽은 것","고객에게 배송비가 청구된 사건","요구사항에 경계 조건(이상/초과)이 명확히 정의되지 않은 것"],"answer":0,"why":"결함은 제품(산출물) 안의 흠이다. 코드의 > 1000 이라는 잘못된 조건이 결함이다.","trap":"②는 오류(사람의 실수), ③은 장애(실행 중 사건), ④는 근본 원인이다. 사람이 했으면 오류, 제품에 남아 있으면 결함, 실행되어 드러나면 장애, 왜 생겼나가 근본 원인."},{"id":"M07","src":"M","no":7,"ch":1,"topic":"테스트 독립성","key":["Test independence"],"q":"테스트 독립성에 대한 설명으로 **옳지 않은** 것은?","opts":["독립성이 높은 테스터는 개발자의 편견에서 벗어나 결함을 더 잘 찾을 수 있다","외부 조직이나 컨설턴트는 가장 높은 수준의 독립성을 가진다","독립성이 높을수록 개발팀과의 정보 공유가 줄어 의사소통 단절이 생길 수 있다","독립성이 높을수록 항상 더 나은 테스트가 보장되므로 가능한 가장 높은 수준을 선택해야 한다"],"answer":3,"why":"'독립성이 높을수록 항상 더 나은 테스트'는 틀렸다. 독립성은 편견을 줄이지만 의사소통 단절·제품 정보 부족·개발자 책임감 저하라는 대가가 있다.","trap":"①②③은 모두 옳은 문장이다. '항상/반드시 더 좋다'가 들어간 ④가 단정 오류. 독립성 문제에서 '항상' → 오답."},{"id":"M08","src":"M","no":8,"ch":1,"topic":"테스트 분석","key":["Test analysis","Test condition"],"q":"테스트 베이스의 각 항목을 검토하여 테스트할 조건을 식별하고, 리스크와 우선순위에 따라 순서를 정하는 테스트 프로세스 활동은?","opts":["테스트 계획","테스트 설계","테스트 분석","테스트 구현"],"answer":2,"why":"테스트 베이스를 분석해 테스트 조건(무엇을 테스트할지)을 식별하고 우선순위를 정하는 활동은 테스트 분석이다.","trap":"② 테스트 설계는 테스트 조건을 테스트 케이스·차터·커버리지 항목으로 구체화하는 단계다. '조건'이 나오면 분석, '케이스'가 나오면 설계. 분석=무엇(조건) / 설계=어떻게(케이스) / 구현=실행 준비(절차·환경)."},{"id":"M09","src":"M","no":9,"ch":2,"topic":"테스트 레벨 · 테스트 베이스","key":["Component integration testing","Test basis"],"q":"테스트 레벨과 테스트 베이스의 연결로 옳은 것은?","opts":["컴포넌트 테스팅 — 시스템 요구사항 명세서","컴포넌트 통합 테스팅 — 소프트웨어 설계(아키텍처)와 인터페이스 명세","시스템 테스팅 — 상세 설계서와 소스 코드","시스템 통합 테스팅 — 비즈니스 요구사항과 계약서"],"answer":1,"why":"컴포넌트 통합 테스팅의 베이스는 소프트웨어 설계(아키텍처)와 인터페이스 명세다.","trap":"①은 시스템 테스팅, ③은 컴포넌트 테스팅, ④는 인수 테스팅의 베이스다. 네 레벨의 베이스를 한 칸씩 밀어 배치한 전형적인 매칭 함정. 코드 → 아키텍처 → 시스템 요구사항 → 외부 연동 → 비즈니스/계약."},{"id":"M10","src":"M","no":10,"ch":2,"topic":"인수 테스팅 유형","key":["Beta testing","Alpha testing","OAT"],"q":"개발 조직이 통제할 수 없는 실제 사용 환경에서 잠재 사용자가 제품을 사용하고 피드백을 제공하는 인수 테스팅은?","opts":["알파 테스팅","운영 인수 테스팅(OAT)","베타 테스팅","규제 인수 테스팅"],"answer":2,"why":"'개발 조직이 통제할 수 없는 실제 사용 환경'이 결정적 표현이다 → 베타 테스팅.","trap":"① 알파는 개발사 장소에서 잠재 사용자가 수행하고 개발자가 관찰한다. ② OAT는 운영팀이 백업·복구 등 운영 준비를 확인하는 것. ④ 규제는 법규 준수 확인. 통제 밖·실사용 환경 = 베타 / 개발사 장소·관찰 = 알파."},{"id":"M11","src":"M","no":11,"ch":2,"topic":"리그레션 테스팅","key":["Regression testing","Confirmation testing"],"q":"다음 중 **리그레션 테스팅**으로 가장 적절한 것은?","opts":["보고된 결함을 재현하던 테스트를 그대로 실행하여 수정되었는지 확인한다","새로 합의된 요구사항에 대한 인수 조건을 검증한다","부하 테스트로 동시 사용자 1,000명 상황을 재현한다","신규 결제 모듈을 배포한 뒤, 기존 주문·배송·회원 기능의 테스트 스위트를 다시 실행한다"],"answer":3,"why":"새 모듈 배포 후 기존 기능이 깨지지 않았는지 기존 테스트 스위트를 다시 실행하는 것이 리그레션 테스팅이다.","trap":"①은 확인 테스팅(confirmation)이다. 이 둘을 바꿔 놓는 것이 최대 함정. ②는 인수 테스팅, ③은 비기능(부하) 테스팅. '수정 확인' = 확인 / '부작용·기존 기능 유지' = 리그레션."},{"id":"M12","src":"M","no":12,"ch":2,"topic":"테스트 레벨 특성","key":["Acceptance testing","Test basis"],"q":"테스트 레벨의 특성에 대한 설명으로 **옳지 않은** 것은?","opts":["인수 테스팅의 테스트 베이스는 상세 설계서와 소스 코드이며, 그 책임은 개발자에게 있다","시스템 테스팅은 완성된 시스템이 기능·비기능 요구사항을 충족하는지 엔드투엔드로 확인한다","시스템 통합 테스팅은 우리 시스템과 외부 시스템·서비스 간의 인터페이스를 확인한다","컴포넌트 통합 테스팅은 컴포넌트 간 인터페이스와 상호작용에서 발생하는 결함을 찾는다"],"answer":0,"why":"인수 테스팅의 베이스는 비즈니스 요구사항·사용자 요구·계약·법규이고, 책임은 사용자·고객·운영에 있다. '상세 설계서·소스 코드·개발자 책임'은 컴포넌트 테스팅이다.","trap":"②③④는 모두 옳은 설명이라 지우기 쉽다. 가장 구체적인 주체·대상이 들어간 보기가 오답인 경우가 많다. 인수 테스팅에 '코드'가 나오면 즉시 오답 후보."},{"id":"M13","src":"M","no":13,"ch":2,"topic":"ISO/IEC 25010 · 신뢰성","key":["Reliability","Performance efficiency"],"q":"다음 요구사항이 ISO/IEC 25010의 어느 품질 특성에 해당하는가?","html":"<div class='quote'>결제 서버에 장애가 발생해도 30초 이내에 정상 노드로 자동 전환되어 서비스가 중단되지 않아야 하며, 1년에 1회 이하의 서비스 중단만 허용된다.</div>","opts":["성능 효율성","신뢰성","사용성","유지보수성"],"answer":1,"why":"장애 후 자동 복구, 허용 가능한 중단 빈도는 신뢰성(Reliability)의 회복성·가용성 요구다.","trap":"① 성능 효율성은 응답 시간·처리량·자원 사용이다. '장애'라는 단어에 끌려 ①을 고르기 쉽지만 응답 시간 얘기가 없다. 시간·동시 사용자 = 성능 / 장애·복구·가용성 = 신뢰성 / 클릭·학습 = 사용성 / 수정·교체 = 유지보수성."},{"id":"M14","src":"M","no":14,"ch":2,"topic":"유지보수 테스팅","key":["Maintenance testing","Impact analysis"],"q":"유지보수 테스팅에 대한 설명으로 **옳지 않은** 것은?","opts":["데이터 마이그레이션과 서비스 은퇴(폐기)도 유지보수 테스팅의 트리거가 된다","영향 분석을 통해 변경이 미치는 범위를 파악하여 리그레션 테스트 범위를 정한다","변경된 부분만 테스트하면 되므로, 유지보수 시 리그레션 테스팅은 원칙적으로 불필요하다","운영 환경이나 플랫폼의 변경도 유지보수 테스팅을 유발한다"],"answer":2,"why":"유지보수 시에도 변경으로 인한 부작용을 확인해야 하므로 리그레션 테스팅은 필수다. '변경 부분만 테스트하면 충분하다'는 대표적인 오답 문장이다.","trap":"①에서 '은퇴·폐기'를 트리거로 인정하지 않는 사람이 많다(정답은 트리거 맞음). 트리거 = 수정 / 업그레이드·마이그레이션 / 은퇴·폐기 / 환경 변화."},{"id":"M15","src":"M","no":15,"ch":3,"topic":"정적 테스팅 대상","key":["Static testing","Dynamic testing"],"q":"정적 테스팅으로 검토할 수 **없는** 것은?","opts":["소스 코드","사용자 스토리와 인수 조건","실행 중인 애플리케이션의 평균 응답 시간","아키텍처 설계 모델"],"answer":2,"why":"정적 테스팅은 실행하지 않는다. 실행 중 응답 시간은 동적 테스팅으로만 측정된다.","trap":"② 사용자 스토리·인수 조건은 문서이므로 정적 검토 대상이다(많이 놓친다). 정적 = 실행 없음. '응답 시간·처리량·성능'이 나오면 동적."},{"id":"M16","src":"M","no":16,"ch":3,"topic":"리뷰 유형 · 인스펙션","key":["Inspection"],"q":"인스펙션(Inspection)의 특징으로 옳은 것은?","opts":["규칙·체크리스트·측정 지표를 사용하며, 작성자가 아닌 조정자가 주도하는 가장 공식적인 리뷰다","작성자가 주도하며 교육과 이해도 향상을 주목적으로 한다","형식이 정해져 있지 않고 필요할 때 수시로 수행한다","리뷰 결과를 기록으로 남기지 않는 것이 원칙이다"],"answer":0,"why":"인스펙션은 가장 공식적인 리뷰로 조정자가 주도하고 규칙·체크리스트·측정 지표를 사용하며 개별 준비가 필수다.","trap":"②는 워크스루(작성자 주도·교육), ③은 비공식 리뷰, ④는 어떤 리뷰에도 해당하지 않는 틀린 문장. 인스펙션 3종 세트 = 조정자 주도 + 체크리스트·측정 지표 + 개별 준비."},{"id":"M17","src":"M","no":17,"ch":3,"topic":"리뷰 역할","key":["Manager","Moderator","Review Leader","Scribe"],"q":"리뷰 역할에 대한 설명으로 **옳지 않은** 것은?","opts":["관리자(Manager)는 어떤 작업 산출물을 리뷰할지 결정하고 리뷰 자원과 일정을 배정한다","조정자(Moderator)는 리뷰 회의를 효과적으로 진행하고 참가자 간 의견 충돌을 중재한다","리더(Review Leader)는 리뷰 전반에 대한 책임을 지고 누가 어떤 역할을 맡을지 결정한다","기록자(Scribe)는 리뷰에서 발견된 결함을 수정할 책임과 수정 완료 여부를 판단할 책임을 진다"],"answer":3,"why":"기록자(Scribe)는 회의 내용·결함·결정 사항을 기록할 뿐 결함 수정 책임은 없다. 수정은 작성자의 몫이고, 수정 완료 판단은 조정자·리더가 한다.","trap":"①②③은 모두 옳다. 특히 조정자 = 회의 진행·중재, 리더 = 전반 책임·역할 배정을 서로 바꿔 놓으면 가장 많이 틀린다. 관리자=자원·일정 / 리더=전반·배정 / 조정자=진행·중재 / 기록자=기록 / 작성자=수정."},{"id":"M18","src":"M","no":18,"ch":3,"topic":"리뷰 프로세스","key":["Individual review"],"q":"다음 설명에 해당하는 리뷰 프로세스 활동은?","html":"<div class='quote'>리뷰어들이 각자 작업 산출물을 검토하면서 사전에 배포된 체크리스트를 사용해 결함·질문·의견을 기록한다.</div>","opts":["계획(Planning)","개별 리뷰(Individual review)","시작 회의(Kick-off)","이슈 커뮤니케이션과 분석"],"answer":1,"why":"리뷰어가 각자 체크리스트를 들고 검토해 결함·질문을 기록하는 단계는 개별 리뷰다.","trap":"③ 시작 회의(kick-off)는 목적 설명·역할 배정·방법 합의 단계다. ④는 발견 사항을 분류·심각도 판단하고 결함을 확정하는 단계. 계획→시작회의→개별리뷰→이슈분석→수정·보고 5단계에서 '각자 검토'는 3번째."},{"id":"M19","src":"M","no":19,"ch":4,"topic":"동등 분할","key":["Equivalence partitioning","Equivalence partition coverage"],"q":"동등 분할(Equivalence Partitioning)에 대한 설명으로 **옳지 않은** 것은?","opts":["유효 파티션과 무효 파티션을 모두 테스트해야 한다","같은 파티션에 속한 값은 시스템이 동일하게 처리한다고 가정한다","동등 분할 커버리지는 테스트된 파티션 수를 전체 파티션 수로 나누어 계산한다","각 파티션에서 대표값을 하나씩 선택하면 파티션 경계에서 발생하는 결함도 반드시 발견된다"],"answer":3,"why":"동등 분할은 대표값 1개로 파티션을 대표하므로 경계 결함은 잡지 못한다. 경계는 경계값 분석의 영역이다.","trap":"①②③은 모두 옳은 설명이다. ④는 '반드시 발견된다'는 단정이 들어가 함정임을 알 수 있다. 동등 분할=대표값, 경계값 분석=경계."},{"id":"M20","src":"M","no":20,"ch":4,"topic":"결정 테이블","key":["Decision table","Don't care"],"q":"결정 테이블 테스팅에 대한 설명으로 **옳지 않은** 것은?","opts":["조건의 조합과 그에 따른 액션을 표로 표현한다","무관 조건(don't care)을 사용한 결정 테이블은 조건 조합이 겹치는 규칙을 만들 수 있으므로, 불완전하거나 모순된 규칙을 찾는 데 사용할 수 없다","조건 n개가 각각 참/거짓의 두 값을 가지면 전체 조합은 2^n개다","무관 조건('-')을 사용하면 여러 조합을 하나의 규칙으로 축소할 수 있다"],"answer":1,"why":"결정 테이블은 불완전한 규칙(빠진 조합)과 모순된 규칙(같은 조합에 다른 액션)을 찾는 데 바로 쓰는 도구다. 무관 조건이 있어도 이 분석은 가능하다.","trap":"③(2^n)과 ④(축소 가능)는 옳은 문장이라 지우기 어렵다. ②는 '사용할 수 없다'는 가능성 부정이 들어간 틀린 문장. '~할 수 없다'로 끝나는 보기는 실제로 가능한 경우가 많아 오답이 잦다."},{"id":"M21","src":"M","no":21,"ch":4,"topic":"상태 전이 · 1-switch","key":["1-switch coverage","0-switch coverage"],"q":"상태 전이 테스팅의 **1-switch 커버리지**에 대한 설명으로 옳은 것은?","opts":["모든 상태를 최소 한 번 방문하는 것을 목표로 한다","다이어그램의 모든 유효 전이를 최소 한 번 실행하는 것을 목표로 한다","서로 연결된 유효 전이의 모든 쌍(길이 2의 전이 시퀀스)을 최소 한 번 실행하는 것을 목표로 한다","허용되지 않는 전이(무효 전이)를 모두 실행하는 것을 목표로 한다"],"answer":2,"why":"1-switch 커버리지는 서로 연결된 두 전이의 모든 쌍(길이 2 시퀀스)을 최소 한 번 실행하는 것이다. 0-switch보다 강하다.","trap":"②가 0-switch의 정의다. ①은 가장 약한 '모든 상태' 커버리지. ④ 무효 전이는 커버리지 목표가 아니라 오류 처리 확인용이다. 0-switch=전이 1개, 1-switch=전이 2개(쌍)."},{"id":"M22","src":"M","no":22,"ch":4,"topic":"구문 vs 분기 커버리지","key":["Statement coverage","Branch coverage"],"q":"구문 커버리지와 분기 커버리지의 관계로 옳은 것은?","opts":["분기 커버리지 100%를 달성하면 구문 커버리지도 100%가 된다","구문 커버리지 100%를 달성하면 분기 커버리지도 항상 100%가 된다","두 커버리지는 같은 대상을 측정하므로 값이 항상 동일하다","분기 커버리지는 실행된 코드 줄 수를 전체 코드 줄 수로 나누어 계산한다"],"answer":0,"why":"분기 커버리지 100% ⇒ 구문 커버리지 100%. 모든 분기를 지나면 모든 문장도 지나게 되기 때문이다.","trap":"②가 방향을 뒤집은 함정이다. else 없는 if가 대표 반례 — 문장은 1개 케이스로 100%지만 분기는 50%다. 화살표 방향은 분기 → 구문 한 방향만 성립."},{"id":"M23","src":"M","no":23,"ch":4,"topic":"탐색적 테스팅","key":["Exploratory testing","Charter","Time-box","Session sheet"],"q":"탐색적 테스팅(Exploratory testing)에 대한 설명으로 **옳지 않은** 것은?","opts":["테스팅 중 학습·테스트 설계·실행을 동시에 수행한다","차터(charter)에 따라 시간을 정해 놓고(time-box) 세션 단위로 수행하며, 세션 시트에 수행 내용을 기록한다","테스터의 경험·직관·도메인 지식이 중요하다","테스트 케이스를 사전에 상세히 작성하지 않으므로 테스트 커버리지를 측정하거나 기록할 수 없다"],"answer":3,"why":"탐색적 테스팅도 차터·세션 시트로 수행 내용과 커버리지를 기록·측정할 수 있다. '케이스를 미리 작성하지 않는다'와 '기록하지 않는다'는 다르다.","trap":"①②③은 교과서적 설명이라 모두 옳다. ④는 '미작성 → 기록 불가'로 비약한 문장. 탐색적 테스팅 3요소 = 차터 + 타임박스 + 세션 시트."},{"id":"M24","src":"M","no":24,"ch":4,"topic":"협업 기반 · 인수 조건","key":["Acceptance criteria","ATDD","BDD"],"q":"협업 기반 테스트 접근법에 대한 설명으로 **옳지 않은** 것은?","opts":["사용자 스토리의 인수 조건은 스토리가 완료되었다고 판단하는 기준이며 테스트 케이스 설계의 기반이 된다","인수 조건은 개발이 완료된 후 테스터가 단독으로 작성하는 것이 원칙이다","ATDD는 인수 테스트를 먼저 합의하고 그것을 통과하도록 개발하는 방식이다","BDD는 Given/When/Then 구조로 행위를 명세화하여 비기술 이해관계자도 읽을 수 있게 한다"],"answer":1,"why":"인수 조건은 개발이 시작되기 전에 고객·개발자·테스터(3 amigos)가 함께 작성한다. 완료 후 테스터 단독 작성은 틀렸다.","trap":"①③④는 모두 옳은 설명. ②는 시점(완료 후)과 주체(단독)를 동시에 비튼 문장이다. '개발 후', '테스터 단독' → 오답."},{"id":"M25","src":"M","no":25,"ch":4,"topic":"경계값 분석 · 2-value/3-value","key":["2-value BVA","3-value BVA","Boundary value analysis"],"q":"두 개의 입력 필드가 있다.\n· **필드 A(나이)**: 정수 19 이상 65 이하만 유효\n· **필드 B(보유 포인트)**: 정수 0 이상 (상한 없음)\n필드 A와 필드 B에 각각 경계값 분석을 적용할 때, **2-value와 3-value에서 필요한 테스트 값의 총 개수**로 옳은 것은?","opts":["2-value 4개, 3-value 6개","2-value 6개, 3-value 9개","2-value 6개, 3-value 12개","2-value 8개, 3-value 12개"],"answer":1,"why":"필드 A(19~65): 경계 2개 → 2-value 4개(18,19,65,66) / 3-value 6개(18,19,20,64,65,66). 필드 B(0 이상, 상한 없음): 경계 1개 → 2-value 2개(−1,0) / 3-value 3개(−1,0,1). 합계: 2-value 4+2 = 6개, 3-value 6+3 = 9개.","trap":"①은 필드 B에 상한이 있다고 착각한 답(4/6). ③은 B를 3-value에서 6개로 센 답. ④는 2-value를 경계당 4개로 착각한 답. '상한 없음'이라는 한 줄이 이 문제의 전부다. 경계 개수를 먼저 세고 ×2 또는 ×3."},{"id":"M26","src":"M","no":26,"ch":4,"topic":"BVA + 동등 분할 조합","key":["3-value BVA","Equivalence partitioning","Minimum test cases"],"q":"회원 가입 화면에 [나이]와 [등급] 필드가 있다. [나이]는 정수 1~120만 유효하고, [등급]은 일반/골드/VIP 중 하나를 선택한다. 나이에는 **3-value 경계값 분석**, 등급에는 **동등 분할**을 적용하여 테스트 케이스를 설계할 때, 필요한 **최소 테스트 케이스 수**와 **나이 필드에 사용되는 테스트 값의 개수**로 옳은 것은?","opts":["테스트 케이스 18개, 나이 테스트 값 6개","테스트 케이스 9개, 나이 테스트 값 6개","테스트 케이스 6개, 나이 테스트 값 6개","테스트 케이스 6개, 나이 테스트 값 4개"],"answer":2,"why":"나이 3-value: 0,1,2,119,120,121 → 6개 값. 등급 EP: 일반/골드/VIP → 3개 파티션. 최소 테스트 케이스 = max(6, 3) = 6개(한 케이스가 나이 값 1개 + 등급 값 1개를 동시에 커버).","trap":"① 18개 = 6×3 (곱셈 함정, 가장 많이 나옴). ② 9개 = 6+3 (덧셈 함정). ④ 4개는 2-value로 계산한 값. 여러 필드의 최소 케이스 = 최댓값(파티션 수가 적은 필드는 값이 재사용된다)."},{"id":"M27","src":"M","no":27,"ch":4,"topic":"구문·분기 커버리지 최소 케이스","key":["Statement coverage","Branch coverage","Minimum test cases"],"q":"다음 의사코드가 있다. 실행 가능한 문장은 3, 5, 7번이다. **구문 커버리지 100%** 와 **분기 커버리지 100%** 를 각각 달성하기 위해 필요한 **최소 테스트 케이스 수**로 옳은 것은?","html":"<pre class='code'>1  if (A &gt; 0) then\n2      if (B &gt; 0) then\n3          X = '둘 다 양수'\n4      end if\n5      Y = 'A는 양수'\n6  end if\n7  Z = '종료'</pre>","opts":["구문 1개, 분기 3개","구문 1개, 분기 2개","구문 2개, 분기 3개","구문 2개, 분기 4개"],"answer":0,"why":"구문 100%: A=1,B=1 → 3·5·7 모두 실행 → 1개 케이스로 100%. 분기 100%: (A>0) 참/거짓, (B>0) 참/거짓 4개 필요 → TC1 A=1,B=1 / TC2 A=1,B=0 / TC3 A=0 → 3개.","trap":"② '분기 2개'는 A거짓과 B거짓을 한 케이스로 커버할 수 있다고 착각한 답 — B는 A가 참일 때만 평가되므로 불가능. ③ '구문 2개'는 if의 참·거짓을 모두 봐야 문장 커버리지가 된다고 착각한 답. 구문은 한 경로로 충분할 수 있고, 분기는 각 결정의 양방향이 필요하다."},{"id":"M28","src":"M","no":28,"ch":4,"topic":"상태 전이 커버리지 계산","key":["0-switch coverage","Invalid transition"],"q":"어떤 로그인 시스템의 상태 전이 다이어그램에는 8개의 유효 전이가 있다. 테스터가 4개의 테스트 케이스를 실행했다. 이때 **유효 전이 커버리지(0-switch coverage)** 는?","html":"<table class='tbl'><tr><th>구분</th><th>전이</th><th>이벤트</th></tr><tr><td>T1</td><td>S1 → S2</td><td>정상 로그인</td></tr><tr><td>T2</td><td>S1 → S3</td><td>비밀번호 5회 오류</td></tr><tr><td>T3</td><td>S2 → S1</td><td>로그아웃</td></tr><tr><td>T4</td><td>S2 → S3</td><td>세션 중 권한 오류 3회</td></tr><tr><td>T5</td><td>S2 → S4</td><td>1년 미접속</td></tr><tr><td>T6</td><td>S3 → S1</td><td>관리자 잠금 해제</td></tr><tr><td>T7</td><td>S4 → S1</td><td>본인 인증 후 휴면 해제</td></tr><tr><td>T8</td><td>S3 → S4</td><td>잠금 후 30일 경과</td></tr></table><div class='quote'>TC1: S1 → S2 → S1 → S2 → S4<br>TC2: S1 → S3 → S1<br>TC3: S1 → S2 → S3<br>TC4: S3 → S2로 이동 시도 (시스템이 요청을 거부함)</div>","opts":["67%","87.5%","100%","75%"],"answer":3,"why":"TC1 = T1,T3,T5 / TC2 = T2,T6 / TC3 = T4 / TC4의 S3→S2는 유효 전이가 아니므로 제외. 커버된 유효 전이 6개 / 8개 = 75%.","trap":"① 67% = 6/9(무효 전이를 분모에 넣은 답). ② 87.5% = 7/8(TC4의 무효 시도를 유효 전이로 인정한 답). ③ 100%(TC1~TC3만 보고 다 커버했다고 착각). 무효 전이는 분자에도 분모에도 넣지 않는다."},{"id":"M29","src":"M","no":29,"ch":4,"topic":"결정 테이블 축소","key":["Decision table","Don't care","Minimum test cases"],"q":"자동차 보험 할인 규칙을 결정 테이블로 작성했다. 조건은 C1(운전 경력 3년 이상), C2(최근 3년 무사고), C3(VIP 회원)이고, 무관 조건은 '-'로 표시했다. 모든 규칙을 최소한의 테스트 케이스로 한 번 이상 커버하려면 몇 개의 테스트 케이스가 필요한가?","html":"<table class='tbl'><tr><th>규칙</th><th>C1</th><th>C2</th><th>C3</th><th>액션</th></tr><tr><td>R1</td><td>Y</td><td>Y</td><td>Y</td><td>20% 할인</td></tr><tr><td>R2</td><td>Y</td><td>Y</td><td>N</td><td>15% 할인</td></tr><tr><td>R3</td><td>Y</td><td>N</td><td>–</td><td>할인 없음</td></tr><tr><td>R4</td><td>N</td><td>–</td><td>Y</td><td>5% 할인</td></tr><tr><td>R5</td><td>N</td><td>–</td><td>N</td><td>할인 없음</td></tr></table>","opts":["5개","6개","8개","11개"],"answer":0,"why":"무관 조건('-')은 여러 조합을 하나의 규칙으로 축소한다. 최소 테스트 케이스 수 = 축소 후 규칙 수 = 5개(규칙당 케이스 1개).","trap":"③ 8개 = 2^3(무관 조건을 무시하고 전체 조합을 센 답, 최다 오답). ② 6개·④ 11개는 근거 없는 합산. 결정 테이블 최소 케이스 = 규칙 개수(2^n이 아니다)."},{"id":"M30","src":"M","no":30,"ch":5,"topic":"테스트 계획서","key":["Test plan"],"q":"테스트 계획서에 포함되는 내용으로 **가장 거리가 먼** 것은?","opts":["테스트 범위·목표·접근법","테스트 일정과 자원","출구 기준과 테스트 리스크","발견된 결함의 재현 절차와 실제 결과"],"answer":3,"why":"재현 절차·실제 결과는 결함 보고서(incident report) 항목이다. 계획서에는 범위·목표·접근법·일정·자원·출구 기준·리스크가 들어간다.","trap":"③ '출구 기준과 테스트 리스크'가 계획서 항목임을 모르면 ③을 고르기 쉽다. 결함 관련 상세 = 결함 보고서 / 일정·범위·기준 = 계획서 / 결과·잔여 리스크·종료 이유 = 완료 보고서."},{"id":"M31","src":"M","no":31,"ch":5,"topic":"애자일 테스팅 사분면","key":["Q1","Q2","Q3","Q4","Testing quadrants"],"q":"다음 4가지 테스트 활동을 애자일 테스팅 사분면(Q1~Q4)에 배치할 때, 바르게 연결한 것은?\n㉠ 컴포넌트 수준의 단위 테스트와 자동화 테스트\n㉡ 사용자 스토리의 인수 조건에 대한 기능 테스트\n㉢ 실제 사용자가 참여하는 사용성 테스트와 탐색적 테스팅\n㉣ 부하·성능·보안 테스트","opts":["㉠ Q1, ㉡ Q2, ㉢ Q3, ㉣ Q4","㉠ Q2, ㉡ Q1, ㉢ Q4, ㉣ Q3","㉠ Q1, ㉡ Q3, ㉢ Q2, ㉣ Q4","㉠ Q4, ㉡ Q2, ㉢ Q3, ㉣ Q1"],"answer":0,"why":"Q1(기술·팀 지원)=단위·컴포넌트 테스트 / Q2(비즈니스·팀 지원)=인수 조건 기능 테스트 / Q3(비즈니스·제품 비평)=사용성·탐색적·UAT / Q4(기술·제품 비평)=성능·부하·보안.","trap":"②는 Q1·Q2를 바꾼 답, ③은 Q2·Q3를 바꾼 답. 가로축(기술/비즈니스)과 세로축(팀 지원/제품 비평) 중 하나만 틀리게 만든다. 기술=단위·성능 / 비즈니스=기능·사용성, 팀 지원=개발자를 돕는다 / 제품 비평=제품을 비판한다."},{"id":"M32","src":"M","no":32,"ch":5,"topic":"제품 vs 프로젝트 리스크","key":["Product risk","Project risk"],"q":"다음 중 **제품 리스크(product risk)** 에 해당하는 것만 짝지은 것은?\n㉠ 요구사항 변경이 잦아 테스트 범위가 계속 늘어나는 것\n㉡ 결제 모듈이 동시 접속자 급증 시 응답 지연으로 실패할 수 있는 것\n㉢ 테스트 환경 대여 일정이 밀려 테스트 기간이 줄어드는 것\n㉣ 개인정보 마스킹이 누락되어 규정 위반이 발생할 수 있는 것\n㉤ 핵심 테스터가 퇴사하여 지식이 단절되는 것","opts":["㉠, ㉢","㉡, ㉣","㉢, ㉤","㉠, ㉡, ㉣"],"answer":1,"why":"제품 리스크는 제품의 품질에 관한 것 — ㉡(성능 실패), ㉣(보안·규정 위반)이다.","trap":"㉠(요구사항 변경), ㉢(환경 대여 지연), ㉤(인력 이탈)은 모두 프로젝트 리스크다. 특히 ㉣은 '규정 위반'이라는 말 때문에 프로젝트 리스크로 오해하기 쉽지만 개인정보 마스킹 누락은 제품의 보안 결함. '테스트를 못 하게 되는 것' = 프로젝트 / '제품이 나빠지는 것' = 제품."},{"id":"M33","src":"M","no":33,"ch":5,"topic":"리스크 관리 활동","key":["Risk analysis","Risk assessment"],"q":"'각 리스크의 발생 가능성과 영향을 평가하여 리스크 수준을 산정하고 우선순위를 정한다.' 이 활동에 해당하는 것은?","opts":["리스크 식별","리스크 계획(완화 대책 수립)","리스크 분석·평가","리스크 모니터링·제어"],"answer":2,"why":"확률과 영향을 평가해 리스크 수준을 산정하고 우선순위를 정하는 것은 리스크 분석·평가다.","trap":"① 식별은 '무엇이 리스크인가'를 찾는 단계, ② 계획은 완화책 수립, ④ 모니터링·제어는 재평가·추적이다. 식별 → 분석(확률×영향) → 계획(완화) → 구현 → 모니터링·제어."},{"id":"M34","src":"M","no":34,"ch":5,"topic":"모니터링 지표","key":["Test monitoring","Metrics","Defect density"],"q":"테스트 모니터링에서 수집하는 측정 지표로 **가장 거리가 먼** 것은?","opts":["요구사항 커버리지와 테스트 케이스 실행률","결함 밀도와 결함 검출률","잔여 리스크와 출구 기준 충족 정도","개발자의 근속 연수와 연봉 수준"],"answer":3,"why":"모니터링 지표는 커버리지·실행률·통과율·결함 밀도·검출률·잔여 리스크·출구 기준 충족도 등 테스트와 품질 상태를 보여주는 값이다. 개발자의 근속 연수·연봉은 무관하다.","trap":"② 결함 밀도·검출률은 실제로 쓰이는 핵심 지표다. 결함 밀도 = 결함 수 ÷ 규모(KLOC), 결함 검출률 = 테스트 중 발견 ÷ (테스트 중 + 운영 중)."},{"id":"M35","src":"M","no":35,"ch":5,"topic":"심각도 vs 우선순위","key":["Severity","Priority"],"q":"결함의 심각도(severity)와 우선순위(priority)에 대한 설명으로 옳은 것은?","opts":["심각도는 결함이 시스템에 미치는 영향의 정도이고, 우선순위는 수정 순서·시급성으로 비즈니스 상황이 반영될 수 있다","심각도가 높은 결함은 항상 우선순위도 높다","심각도는 비즈니스적 시급성으로, 우선순위는 기술적 영향의 크기로 결정된다","두 항목은 결함 보고서에 기록하지 않아도 되는 선택 항목이다"],"answer":0,"why":"심각도는 기술적 영향의 크기, 우선순위는 수정 순서·시급성이며 비즈니스 판단이 반영된다.","trap":"② '항상 같다'는 단정 오류(오탈자가 첫 화면에 있으면 심각도 낮음·우선순위 높음). ③은 두 개념을 정확히 반대로 뒤집었다. 심각도=기술, 우선순위=비즈니스."},{"id":"M36","src":"M","no":36,"ch":5,"topic":"3점 추정(PERT)","key":["PERT","Three-point estimation"],"q":"어떤 테스트 활동의 소요 기간을 3점 추정으로 계산했다. 낙관치 6일, 최빈치 9일, 비관치 24일일 때, **PERT 기법의 기대 기간**과 **표준편차(표준편차 = (비관치 − 낙관치) / 6)** 로 옳은 것은?","opts":["기대 11일, 표준편차 6일","기대 11일, 표준편차 3일","기대 13일, 표준편차 3일","기대 13일, 표준편차 4.5일"],"answer":1,"why":"기대 기간 = (a + 4m + b) / 6 = (6 + 36 + 24) / 6 = 11일. 표준편차 = (b − a) / 6 = 18 / 6 = 3일.","trap":"③ 13일은 산술평균 (6+9+24)/3 — PERT를 모르면 이 값이 나온다. ①은 기대값은 맞지만 표준편차를 (b−a)/3으로 계산한 답. ④는 둘 다 평균 기반. m(최빈치)에 4배 가중."},{"id":"M37","src":"M","no":37,"ch":5,"topic":"리스크 기반 테스트 우선순위","key":["Risk level","Risk-based testing"],"q":"제품 리스크 분석 결과가 다음과 같다(리스크 수준 = 발생 가능성 × 영향). 리스크 기반 테스트 우선순위에 따라 **가장 먼저** 테스트해야 할 대상 **두 개**를 순서대로 고른 것은?","html":"<table class='tbl'><tr><th>ID</th><th>리스크</th><th>가능성</th><th>영향</th></tr><tr><td>R1</td><td>결제 모듈에서 금액이 중복 청구됨</td><td>3</td><td>5</td></tr><tr><td>R2</td><td>관리자 화면의 정렬 순서가 잘못 표시됨</td><td>4</td><td>2</td></tr><tr><td>R3</td><td>동시 접속 500명에서 로그인 실패</td><td>5</td><td>4</td></tr><tr><td>R4</td><td>3년 된 데이터 마이그레이션 시 일부 항목 누락</td><td>2</td><td>5</td></tr><tr><td>R5</td><td>테스트 환경 서버 대여 지연</td><td>5</td><td>5</td></tr></table>","opts":["R3, R1","R5, R3","R3, R4","R1, R4"],"answer":0,"why":"R1=15, R2=8, R3=20, R4=10, R5=25(단 프로젝트 리스크). 제품 리스크 순위: R3(20) > R1(15) > R4(10) > R2(8) → 1·2순위 = R3, R1.","trap":"② R5가 총점 25로 가장 높아서 고르기 쉽다. 그러나 R5는 프로젝트 리스크이고 테스트 우선순위는 제품 리스크를 기준으로 정한다. ③ R4(10)는 R1(15)보다 낮다. 리스크 표가 주어지면 ①유형 분류 → ②점수 계산 → ③제품만 정렬."},{"id":"M38","src":"M","no":38,"ch":5,"topic":"결함 보고서","key":["Defect report","Reproducibility"],"q":"테스터가 로그인 화면에서 다음 결함을 발견했다. 비밀번호를 5회 연속 틀리면 '계정이 잠겼습니다'라는 안내가 표시되고 실제로도 30분간 로그인이 차단되어야 하지만, 안내만 표시되고 곧바로 다시 로그인을 시도할 수 있었다. 빌드는 v2.3.1, 브라우저는 Chrome 130이었다. 이 상황에서 작성한 결함 보고서로 **가장 적절한** 것은?","opts":["'로그인 잠금 기능이 동작하지 않습니다. 빨리 수정해 주세요.'","실제 결과만 기록하고 재현 절차와 기대 결과는 생략하며, 심각도만 '치명적'으로 기재한다","제목, 재현 절차, 기대 결과(30분간 로그인 차단), 실제 결과(즉시 재시도 가능), 환경(v2.3.1 / Chrome 130), 심각도·우선순위를 모두 기재한다","원인은 백엔드의 잠금 카운터 초기화 누락으로 추정되므로, 재현 절차 없이 추정 원인만 기록한다"],"answer":2,"why":"좋은 결함 보고서는 제목, 재현 절차, 기대 결과, 실제 결과, 환경(빌드·브라우저), 심각도·우선순위를 담아 누구나 재현할 수 있게 한다.","trap":"①은 감정적·모호('빨리'), ②는 재현 절차·기대 결과 누락(개발자가 재현 불가), ④는 추정 원인만 적고 재현 절차를 뺐다. 추정은 참고일 뿐, 재현 절차가 우선. 결함 보고서 필수 4종 = 재현 절차 / 기대 결과 / 실제 결과 / 환경."},{"id":"M39","src":"M","no":39,"ch":6,"topic":"테스트 관리 도구","key":["Test management tool","Traceability"],"q":"요구사항과 테스트 케이스의 추적성 관리, 테스트 계획·실행 결과의 기록과 보고를 지원하는 도구는?","opts":["테스트 관리 도구","정적 분석 도구","테스트 실행 도구","성능 테스팅 도구"],"answer":0,"why":"테스트 계획·케이스·추적성·실행 결과 기록·보고는 테스트 관리 도구의 기능이다.","trap":"② 정적 분석 도구는 코드·모델을 분석, ③ 실행 도구는 스크립트 실행·결과 비교, ④ 성능 도구는 부하 생성·응답 측정. '추적성'이라는 단어가 관리 도구의 결정적 표지. 추적성·계획·보고 = 관리 / 실행·커버리지 = 실행 / 부하·응답시간 = 비기능."},{"id":"M40","src":"M","no":40,"ch":6,"topic":"테스트 자동화","key":["Test automation","Maintenance cost"],"q":"테스트 자동화에 대한 설명으로 **옳지 않은** 것은?","opts":["반복적이고 안정된 회귀 테스트에서 자동화의 이득이 크다","스크립트 유지보수 비용과 도구·교육 비용이 증가할 수 있다","자동화 대상은 실행 빈도, 리스크, 안정성, 복잡도를 고려해 선정한다","자동화를 도입하면 수동 테스트가 완전히 대체되어 테스터의 역할이 사라진다"],"answer":3,"why":"자동화는 반복·회귀 테스트를 대체하지만 탐색적·사용성·창의적 판단은 사람의 몫이다. 테스터의 역할이 사라진다는 문장은 틀렸다.","trap":"②는 자동화의 대표 리스크라 옳은 문장이다. '리스크'라는 단어가 나오면 틀린 문장으로 오해하기 쉽다. ③도 옳은 선정 기준. '완전히 대체', '역할이 사라진다', '항상' → 오답."},{"id":"SA01","src":"A","no":1,"label":"Q1","ch":1,"topic":"테스트 컨디션","key":["Test condition"],"q":"다음 중 테스트 컨디션(Test condition)을 설명하고 있는 것은?","opts":["컴포넌트나 시스템의 특이성","테스팅의 베이시스로 파악된 컴포넌트나 시스템의 테스팅 가능한 측면","소프트웨어를 특정 조건에서 사용할 때 설명·제시된 필요 기능을 충족할 수 있는 소프트웨어 제품의 능력","조건의 조합에 따른 행동을 실행하도록 설계된 테스트 케이스"],"answer":1,"why":"테스트 컨디션 = 테스트 베이시스(요구사항·설계·명세)를 분석해 '테스트할 대상'으로 식별한 항목이다. 정의 문장을 그대로 외우면 바로 풀린다.","trap":"a는 특징(feature), c는 기능 적합성(functional suitability), d는 결정 테이블 테스팅의 정의다. 넷 다 글로서리 정의라 헷갈리기 쉽다."},{"id":"SA02","src":"A","no":2,"label":"Q2","ch":1,"topic":"테스팅의 목적","key":["Testing objectives"],"q":"다음 중 테스팅의 목적으로 바른 것은?","opts":["좋은 제품 개발을 위해 충분한 시간이 있도록 테스트는 가능한 늦게 시작해야 한다.","테스트 대상이 사용자와 다른 이해관계자들이 예상한 대로 작동하는지 검증한다.","모든 가능한 결함이 식별되었다는 것을 증명한다.","남아있는 결함이 장애를 일으키지 않을 것이라는 것을 증명한다."],"answer":1,"why":"테스팅의 목적: 요구사항·기대 충족 검증, 결함·장애 발견, 품질에 대한 확신 제공, 리스크 감소, 계약·법규 준수 확인 등.","trap":"c·d는 '모든/남은 결함 없음'을 증명한다는 표현 → '완벽한 테스팅은 불가능하다' 원칙 위배. a는 '조기 테스팅' 원칙 정면 위배."},{"id":"SA03","src":"A","no":3,"label":"Q3","ch":1,"topic":"테스팅 vs 디버깅","key":["Testing","Debugging","Failure"],"q":"다음 중 테스팅과 디버깅의 차이를 바르게 설명한 것은?","opts":["테스팅은 결함(defects)의 원인을 식별하고, 디버깅은 결함을 분석하고 예방 활동을 제안한다.","동적 테스팅은 결함으로 발생하는 장애(failures)를 보여주고, 디버깅은 장애의 원인인 결함을 제거한다.","테스팅은 결점(faults)을 제거하지만, 디버깅은 결점을 일으키는 결함을 제거한다.","동적 테스팅은 장애의 원인을 예방하고, 디버깅은 장애를 제거한다."],"answer":1,"why":"테스팅은 실행 결과로 '장애(증상)'를 드러내고, 디버깅은 그 장애의 원인인 결함을 찾아 분석·제거한다.","trap":"a는 '원인 식별'을 테스팅에 붙여 반대로 꼬았다. c는 fault/defect를 뒤바꿨고, d는 예방/제거를 뒤바꿨다. 결함(defect)-결점(fault)-장애(failure) 3단어 구분이 핵심."},{"id":"SA04","src":"A","no":4,"label":"Q4","ch":1,"topic":"장애(failure)","key":["Failure","Defect"],"q":"다음 중 테스팅이나 개발 과정에서 발견되는 가장 흔한 장애 상황을 설명하는 것은?","opts":["사용자가 대화상자에서 옵션을 선택할 때 화면 깨짐 현상이 발생했다.","빌드에 잘못된 버전의 소스코드 파일이 들어갔다.","계산 알고리즘에 잘못된 입력값을 사용했다.","개발자가 요구사항을 알고리즘으로 구현할 때 잘못 구현했다."],"answer":0,"why":"장애(failure)는 실행 중에 겉으로 드러나는 증상이다. '화면 깨짐'처럼 사용자가 관찰할 수 있는 결과가 장애다.","trap":"b(잘못된 소스 버전), c(잘못된 입력 변수), d(요구사항 오해)는 모두 결함이지 장애가 아니다. 장애/결함을 바꿔 놓는 것이 단골 함정."},{"id":"SA05","src":"A","no":5,"label":"Q5","ch":1,"topic":"7원칙 · 살충제 패러독스","key":["Pesticide paradox"],"q":"테스트 씨(Mr. Test)는 5년 동안 모바일 디바이스의 소프트웨어 애플리케이션을 테스트해 왔다. 그는 모바일 애플리케이션 테스트에 풍부한 경험을 갖고 있으며 다른 사람들보다 좋은 결과를 짧은 시간에 얻는다. 몇 달 동안 테스트 씨는 기존의 자동화된 테스트 케이스를 수정하지 않았고 새로운 테스트 케이스도 만들지 않았다. 그 결과 테스트를 수행하면서 발견되는 결함의 수가 점점 줄어들었다. 테스트 씨가 준수하지 않은 테스트 원칙은 무엇인가?","opts":["테스팅은 환경에 의존한다.","완벽한(exhaustive) 테스팅은 불가능하다.","동일한 테스트를 반복하면 새로운 결함을 발견할 수 없다.","결함은 서로 모여 있다(defect clustering)."],"answer":2,"why":"같은 테스트를 계속 돌리면 더 이상 새 결함이 나오지 않는다(살충제 역설). 테스트 케이스는 주기적으로 검토·갱신해야 한다.","trap":"'5년 경력'이라는 서사에 끌려 a(환경 의존)를 고르기 쉽다. 경력·환경은 이 이야기의 원인이 아니고 '케이스를 그대로 반복'이 핵심이다."},{"id":"SA06","src":"A","no":6,"label":"Q6","ch":1,"topic":"테스팅과 QA","key":["QA","Quality risk"],"q":"테스팅은 어떤 면에서 품질 보증(QA)의 일부가 될 수 있는가?","opts":["테스팅은 요구사항이 충분히 상세하다는 것을 보증한다.","테스팅은 소프트웨어 품질 저하 리스크 수준을 낮춰준다.","테스팅은 조직이 표준을 준수했다는 것을 보증한다.","테스팅은 실행한 테스트 케이스 수로 소프트웨어 품질을 측정한다."],"answer":1,"why":"테스팅은 제품 품질 관련 리스크를 줄이는 활동으로서 QA에 기여한다.","trap":"a·c는 QA(프로세스·표준)가 하는 일이라 테스팅이 '보증'할 수 없고, d는 케이스 수 = 품질이라는 오류."},{"id":"SA07","src":"A","no":7,"label":"Q7","ch":1,"topic":"테스트 프로세스 · 분석","key":["Test analysis","Test basis"],"q":"다음 중 테스트 프로세스의 주요 활동인 '테스트 분석(Test Analysis)'에 해당하는 활동은?","opts":["필요한 인프라(infrastructure)와 도구 식별","테스트 스크립트로 테스트 스위트 생성","프로세스 개선을 위한 교훈 도출","테스트 베이시스의 테스트 용이성 평가"],"answer":3,"why":"테스트 분석 = 테스트 베이시스 분석·평가, 테스트 컨디션 식별, 우선순위 결정.","trap":"a는 테스트 설계, b는 테스트 구현, c는 테스트 완료 활동. 분석-설계-구현-완료 4단계 매칭을 통째로 외우면 안 틀린다."},{"id":"SA08","src":"A","no":8,"label":"Q8","ch":1,"topic":"테스트웨어 용어","key":["Test suite","Test case","Test script","Test charter"],"q":"각각의 테스트 산출물(1-4번)과 그에 대한 설명(A-D)을 바르게 연결한 것은?","html":"<pre class='code'>1. 테스트 스위트    A. 특정 테스트 주기(test run)에서 실행해야 하는 테스트 스크립트 세트\n2. 테스트 케이스   B. 테스트 실행을 위한 일련의 지침\n3. 테스트 스크립트 C. 기대결과를 포함하고 있음\n4. 테스트 차터     D. 세션-기반 탐색적 테스팅에서의 테스트 활동 문서</pre>","opts":["1-A, 2-C, 3-B, 4-D","1-D, 2-B, 3-A, 4-C","1-A, 2-C, 3-D, 4-B","1-D, 2-C, 3-B, 4-A"],"answer":0,"why":"테스트 스위트=실행할 스크립트 묶음(1-A), 테스트 케이스=기대결과 포함(2-C), 테스트 스크립트=실행 지침(3-B), 테스트 차터=탐색적 테스팅 문서(4-D).","trap":"C(기대결과 포함)가 테스트 케이스를 가리킨다는 것만 잡으면 2-C로 절반이 정리되고, 남은 1과 3에서 '스위트=세트, 스크립트=지침'만 확인하면 된다."},{"id":"SA09","src":"A","no":9,"label":"Q9","ch":2,"topic":"인수 테스팅 · 화이트박스","key":["Acceptance testing","White-box testing","Business process"],"q":"인수 테스팅 중에 화이트박스 테스팅을 어떤 방식으로 적용할 수 있는가?","opts":["통합된 시스템 간에 많은 양의 데이터 전송이 가능한지 확인한다.","모든 코드 구문과 결정 경로가 실행됐는지 확인한다.","모든 업무 프로세스 흐름을 확인했는지 점검한다.","웹페이지의 모든 경로(navigations)를 확인한다."],"answer":2,"why":"인수 테스트에서 구조(화이트박스) 관점으로 볼 수 있는 것은 기능 요구사항에 정의된 업무 프로세스(워크플로우)를 모두 지나갔는지 여부다.","trap":"b는 컴포넌트/시스템 레벨의 구문·결정 커버리지라 인수 단계에 부적절. a는 통합 성능, d는 페이지 경로(블랙박스 성격)."},{"id":"SA10","src":"A","no":10,"label":"Q10","ch":2,"topic":"컴포넌트 vs 시스템 테스팅","key":["Component testing","System testing","Test basis"],"q":"다음 중 컴포넌트 테스팅과 시스템 테스팅을 비교한 설명 중 맞는 것은?","opts":["컴포넌트 테스팅은 소프트웨어 모듈, 프로그램 객체, 테스트 가능 단위로 구분된 클래스의 기능을 확인하는 것이고, 시스템 테스팅은 컴포넌트 간 인터페이스와 시스템의 각 부분 간 상호작용을 확인하는 것이다.","컴포넌트 테스팅의 테스트 케이스는 일반적으로 컴포넌트 명세서, 설계 명세서 또는 데이터 모델에서 도출하지만, 시스템 테스팅의 테스트 케이스는 요구사항 명세서나 유스케이스로부터 도출한다.","컴포넌트 테스팅은 기능적 측면에만 초점을 맞추지만 시스템 테스팅은 기능과 비기능 측면 모두에 초점을 맞춘다.","컴포넌트 테스팅은 테스터의 임무지만, 시스템 테스팅은 일반적으로 시스템 사용자들이 수행한다."],"answer":1,"why":"테스트 베이시스가 다르다: 컴포넌트는 컴포넌트 명세·상세 설계·데이터 모델 / 시스템은 요구사항 명세·유스케이스.","trap":"a는 시스템 테스팅 자리에 '통합 테스팅' 설명(인터페이스·상호작용)을 끼워 넣은 함정. c는 '컴포넌트는 기능만'이라 단정, d는 수행 주체를 반대로."},{"id":"SA11","src":"A","no":11,"label":"Q11","ch":2,"topic":"리그레션 vs 확인 테스팅","key":["Regression testing","Confirmation testing"],"q":"다음 중 리그레션 테스팅과 확인 테스팅에 대한 설명으로 맞는 것은?","opts":["리그레션 테스팅의 목적은 수정사항이 문제없이 구현됐는지 점검하는 것이고, 확인 테스팅의 목적은 수정사항에 따른 부작용이 없는지 확인하는 것이다.","리그레션 테스팅의 목적은 의도하지 않은 부작용을 찾는 것이고, 확인 테스팅의 목적은 시스템이 새로운 환경에서 잘 동작하는지 점검하는 것이다.","리그레션 테스팅의 목적은 의도하지 않은 부작용을 찾는 것이고, 확인 테스팅의 목적은 발견된 결함이 수정됐는지 점검하는 것이다.","리그레션 테스팅의 목적은 신규 기능이 동작하는지 점검하는 것이고, 확인 테스팅의 목적은 원래의(original) 결함이 수정됐는지 확인하는 것이다."],"answer":2,"why":"리그레션(회귀) = 변경으로 인해 다른 부분에 생긴 의도치 않은 부작용 탐지. 확인(재테스팅) = 보고된 결함이 실제로 고쳐졌는지 확인.","trap":"a는 두 목적을 서로 맞바꿨다. d는 앞문장만 신규 기능으로 왜곡(뒷문장은 맞아서 헷갈린다). 'purpose'가 앞·뒤 어디에 붙는지 끝까지 읽어야 한다."},{"id":"SA12","src":"A","no":12,"label":"Q12","ch":2,"topic":"SDLC 모델","key":["Incremental development model"],"q":"다음 중 점진적 개발 모델을 가장 잘 정의한 것은?","opts":["요구사항 정의, 소프트웨어 설계 및 테스팅은 각각의 단계에 시스템 조각이 추가되는 단계에서 수행한다.","개발 프로세스 단계는 이전 단계를 완료할 때 시작해야 한다.","테스팅은 개발을 완료한 후 수행하는 별도의 단계로 간주한다.","테스팅을 개발 활동의 일환으로 추가한다."],"answer":0,"why":"점진적(incremental) = 요구사항·설계·구현·테스트를 조각 단위로 반복하며 시스템을 점차 완성.","trap":"b는 순차(워터폴), c는 폭포식 '개발 후 테스트', d는 '테스팅을 증분으로 추가'라는 말장난."},{"id":"SA13","src":"A","no":13,"label":"Q13","ch":2,"topic":"유지보수 테스팅","key":["Maintenance testing","Trigger"],"q":"다음 중 유지보수 테스팅을 유발하는 요인이 아닌 것은?","opts":["소프트웨어의 유지보수성을 테스트하라고 했다.","시스템을 새로운 운영 플랫폼으로 마이그레이션한 후 테스트하라고 했다.","저장된 데이터가 검색 가능한지 테스트하라고 했다.","핫 픽스(hot fix) 후 테스트하라고 했다."],"answer":0,"why":"유지보수 테스팅 트리거: 수정(핫픽스·긴급 패치), 환경·플랫폼 마이그레이션, 데이터 마이그레이션, 아카이브 데이터 복원, 시스템 폐기(retirement) 등.","trap":"'유지보수성 테스트'는 트리거가 아니라 비기능 테스트(유지보수성 테스팅)다. b(마이그레이션)·c(아카이브 복원)·d(핫픽스)는 모두 교과서에 나오는 정식 트리거."},{"id":"SA14","src":"A","no":14,"label":"Q14","ch":3,"topic":"리뷰 역할","key":["Author","Moderator","Review Leader","Reviewer","Scribe"],"q":"다음 중 공식 리뷰의 역할 담당자들로 구성된 것은?","opts":["개발자, 중재자, 리뷰 리더, 리뷰어, 테스터","작성자, 중재자, 관리자, 리뷰어, 개발자","작성자, 관리자, 리뷰 리더, 리뷰어, 설계자","작성자, 중재자, 리뷰 리더, 리뷰어, 서기"],"answer":3,"why":"리뷰 역할: 관리자(manager), 작성자(author), 중재자(moderator), 리뷰 리더, 리뷰어, 서기(scribe).","trap":"'개발자·테스터·설계자'는 직무 이름이지 리뷰 역할이 아니다. 한 선택지에만 '서기'가 들어 있어 서기(scribe) 유무로 잘라도 된다."},{"id":"SA15","src":"A","no":15,"label":"Q15","ch":3,"topic":"리뷰 계획 단계","key":["Review planning","Entry criteria"],"q":"다음 중 공식 리뷰의 계획 단계에서 수행하는 활동은 무엇인가?","opts":["리뷰의 유효성 평가를 위한 메트릭 수집","참가자가 문의할 수 있는 질문에 응답","리뷰를 위한 시작 조건(entry criteria)의 정의 및 시작 조건의 충족 여부 확인","종료 조건(exit criteria)에 대한 리뷰 결과 평가"],"answer":2,"why":"계획 단계: 범위·목적·일정·참가자 정의, 입장/종료 조건 정의, 체크리스트 준비, 리뷰 대상 배포.","trap":"a-메트릭 수집은 '수정 및 보고', b-질문 응답은 리뷰 미팅(의사소통), d-종료 조건 대비 평가는 '이슈 분석·의사소통' 단계. 5단계 중 어디인지 묻는 문제."},{"id":"SA16","src":"A","no":16,"label":"Q16","ch":3,"topic":"리뷰 유형","key":["Inspection","Technical Review","Walkthrough","Informal Review"],"q":"다음 중 규정과 체크리스트에 기반한 공식 프로세스를 따라야 하는 리뷰 수행 시 선택할 수 있는 리뷰 유형으로 가장 적합한 것은?","opts":["비공식 리뷰(Informal Review)","기술적 리뷰(Technical Review)","인스펙션(Inspection)","워크스루(Walkthrough)"],"answer":2,"why":"'공식 프로세스 + 규칙 + 체크리스트'를 모두 요구하는 것은 인스펙션뿐이다.","trap":"기술적 리뷰도 문서화된 절차를 따르지만 체크리스트 사용이 선택이며, 워크스루는 작성자 주도·비공식에 가깝다. '규칙+체크리스트 = 인스펙션'으로 1:1 암기."},{"id":"SA17","src":"A","no":17,"label":"Q18","ch":3,"topic":"체크리스트 기반 리뷰","key":["Checklist-based review","Role","Entry criteria","Exit criteria"],"q":"당신은 리뷰에 초대될 것이다. 리뷰 대상 작업 산출물은 사내 문서 작성 프로세스에 대한 설명서다. 이 설명의 목적은 프로세스에 참여하는 여러 역할 간의 업무 분배를 누구나 명확히 이해할 수 있게 제시하는 것이다. 당신은 체크리스트 기반 리뷰에 초대될 예정이며, 체크리스트도 함께 전달받는다. 다음은 위 체크리스트로 검토해야 할 작업 결과의 발췌 내용이다. 다음 중 당신의 리뷰에 대한 설명으로 옳은 것은?","html":"<div class='quote'><b>체크리스트</b><br>i. 각 활동마다 그 활동을 수행하는 사람이 명확히 식별되는가?<br>ii. 각 활동마다 시작 조건(entry criteria)이 명확히 정의되는가?<br>iii. 각 활동마다 종료 조건(exit criteria)이 명확히 정의되는가?<br>iv. 각 활동마다 지원 역할과 그 업무 범위가 명확히 정의되는가?<br><br><b>발췌 내용</b><br>\"고객 문서의 완전성과 정확성을 확인한 후, 소프트웨어 아키텍트가 시스템 명세서를 작성한다. 소프트웨어 아키텍트가 시스템 명세서 작성을 완료하면 테스터와 검증자를 리뷰에 초대한다. 체크리스트가 리뷰 범위를 설명한다. 초대된 각 리뷰어는 필요하면 리뷰 코멘트를 작성하고, 공식적인 리뷰 완료 코멘트(review done-comment)로 리뷰를 마무리한다.\"</div>","opts":["체크리스트 항목 ii)를 위반했다. 리뷰에 초대하기 위해 어떤 조건이 충족되어야 하는지 명확하지 않기 때문이다.","테스터와 검증자 외에 확인자(validator)도 초대해야 한다는 것을 알았다. 이 항목은 체크리스트에 없으므로 별도 코멘트를 작성하지 않는다.","체크리스트 항목 iii)을 위반했다. 리뷰가 어떻게 완료되는지를 명확히 알 수 없기 때문이다.","체크리스트 항목 i)을 위반했다. 리뷰 초대를 위한 체크리스트를 '누가' 제공하는지 명확하지 않기 때문이다."],"answer":3,"why":"발췌문은 '체크리스트가 리뷰 범위를 설명한다'고만 하고 누가 그 체크리스트를 주는지 말하지 않는다. 항목 i)이 묻는 '역할 수행자 명확성'에 걸린다.","trap":"ii)는 '아키텍트가 명세 완료 후 초대'라는 시작 조건이 이미 서술돼 있고, iii)도 '리뷰 완료 코멘트'로 종료가 명시돼 위반이 아니다. b는 '체크리스트 밖 결함은 코멘트하지 않는다'는 체크리스트 기반 리뷰의 한계를 설명한 것이지 정답은 아니다."},{"id":"SA18","src":"A","no":18,"label":"Q19","ch":4,"topic":"경험 기반 기법","key":["Checklist-based testing","Error guessing","Exploratory testing"],"q":"체크리스트 기반 테스팅(Checklist-based Testing)이란?","opts":["과거 장애에 대한 테스터의 지식이나 장애에 대한 일반적 지식에 기반해 테스트를 도출하는 테스트 기법","컴포넌트나 시스템의 명세 분석을 기반으로 하는 테스트 기법","숙련된 테스터가 제품 검증에 필수적인 일련의 규칙이나 기준 또는 참고·확인·기억해야 하는 아이템 목록을 사용하는 경험 기반 테스트 기법","테스터가 자신의 지식, 테스트 항목의 탐구, 이전 테스트 결과를 기반으로 한 테스트를 적극적으로 설계하고 실행하는 테스팅 접근법"],"answer":2,"why":"체크리스트 기반 테스팅은 경험 기반 기법의 한 종류로, 숙련된 테스터가 체크리스트(항목 목록)로 제품을 검증한다.","trap":"a=오류 추측(error guessing), b=명세 기반(블랙박스), d=탐색적 테스팅. 경험 기반 3형제(오류 추측·탐색적·체크리스트)를 서로 섞어 놓는다."},{"id":"SA19","src":"A","no":19,"label":"Q20","ch":4,"topic":"블랙박스 기법","key":["Black-box testing"],"q":"다음 중 블랙-박스 테스트 기법으로 분류할 수 있는 것은?","opts":["아키텍처 분석에 기반한 기법","상세한 설계에 따라 테스트 대상이 작동하는지를 확인하는 기법","과거 결함에 대한 지식 또는 장애에 대한 일반적인 지식을 기반으로 하는 기법","공식 요구사항에 기반한 기법"],"answer":3,"why":"블랙박스 기법은 테스트 베이시스(공식 요구사항·명세·유스케이스·사용자 스토리) 분석에 기반한다.","trap":"a=아키텍처(구조) → 화이트박스, b=상세 설계 → 화이트박스, c=경험 기반(오류 추측). '블랙박스=요구사항·명세, 화이트박스=구조·코드, 경험=지식' 3분류로 자른다."},{"id":"SA20","src":"A","no":20,"label":"Q21","ch":4,"topic":"결정(분기) 커버리지","key":["Decision coverage","Branch coverage"],"q":"다음은 결정 커버리지에 대한 설명이다. \"코드에 하나의 'if' 문만 있고 다른 루프나 CASE 문이 없고 테스트를 중복 실행하지 않는 경우, 하나의 테스트 케이스 수행 시 50%의 결정 커버리지를 달성할 수 있다.\" 다음 설명 중 옳은 것은?","opts":["위 문장은 옳다. 하나의 테스트 케이스로 100% 구문 커버리지를 달성할 수 있으므로 결정 커버리지는 50%이다.","위 문장은 옳다. 하나의 테스트 케이스는 if 문의 참 또는 거짓 중 하나의 결과가 나올 것이다.","위 문장은 틀렸다. 이 경우 하나의 테스트 케이스는 결정 커버리지 25%만 보장한다.","위 문장은 틀렸다. 지나치게 광범위한 설명으로, 테스트하는 소프트웨어에 따라 참일 수도 있고 거짓일 수도 있다."],"answer":1,"why":"if가 하나면 결정 결과(참/거짓)는 2개. 단일 테스트 케이스는 그중 하나만 지나므로 결정 커버리지는 최대 50%. 문장 자체가 맞다.","trap":"a는 '100% 구문'이라는 사실이 맞아서 끌리지만 결론의 근거가 틀렸다. c의 25%는 아무 근거 없는 숫자, d는 '경우에 따라 다르다'는 회피형 오답. v4.0에서는 이 용어가 '분기 커버리지'로 바뀐다."},{"id":"SA21","src":"A","no":21,"label":"Q22","ch":4,"topic":"구문 커버리지","key":["Statement coverage"],"q":"다음 중 구문 커버리지에 대한 설명인 것은?","opts":["실행된 테스트 케이스 수(비율)를 측정하는 메트릭","소스 코드에서 실행된 구문의 비율을 측정하는 메트릭","통과한 테스트 케이스에 의해 실행된 소스 코드의 구문 수를 측정하는 메트릭","모든 구문이 커버되었는지 참/거짓으로 확인해주는 메트릭"],"answer":1,"why":"구문 커버리지 = (테스트로 실행된 구문 수) / (전체 실행 가능 구문 수) × 100.","trap":"c는 '통과한(passed) 케이스로 한정'이라는 조건이 붙어 정의를 왜곡했다 — 실패한 테스트도 코드는 실행됐다. d는 비율이 아니라 참/거짓 판정이라 틀림."},{"id":"SA22","src":"A","no":22,"label":"Q23","ch":4,"topic":"구문 vs 분기 커버리지","key":["Statement coverage","Branch coverage","Subsumption"],"q":"구문 커버리지와 결정 커버리지의 관계에 대한 설명 중 옳은 것은?","opts":["100% 결정 커버리지는 100% 구문 커버리지를 보장한다.","100% 구문 커버리지는 100% 결정 커버리지를 보장한다.","50% 결정 커버리지는 50% 구문 커버리지를 보장한다.","결정 커버리지는 100%에 도달할 수 없다."],"answer":0,"why":"결정 커버리지가 구문 커버리지를 포섭(subsumes)한다: 모든 결정 결과를 지나면 모든 구문도 실행된다.","trap":"역방향(b)이 대표 함정 — else가 없는 if에서 참만 실행하면 구문 100%·결정 50%가 된다. c처럼 백분율을 그대로 옮기는 것도 오류. v4.0은 이 관계를 '분기 커버리지' 용어로 정리했다."},{"id":"SA23","src":"A","no":23,"label":"Q24","ch":4,"topic":"탐색적 테스팅","key":["Exploratory testing"],"q":"다음 중 탐색적 테스팅(Exploratory Testing)이 적합한 상황은?","opts":["시간 압박 때문에 이미 정의된 테스트의 실행을 빠르게 진행해야 할 때","시스템이 점진적으로 개발되어 테스트 차터(charter)가 없을 때","유사한 애플리케이션과 기술에 대한 지식이 충분한 테스터가 있을 때","시스템에 대한 지식이 이미 충분히 있고 테스트를 집중적으로 수행해야 한다는 근거를 제공해야 할 때"],"answer":2,"why":"탐색적 테스팅은 테스터의 경험·도메인 지식·기술 이해가 받쳐줄 때 가장 효과적이다.","trap":"a는 '이미 정의된 테스트를 빨리 실행' = 탐색적이 아니라 일반 실행. b는 차터가 없을 때가 아니라 차터를 만들어 쓰는 기법이라 반대. d는 이미 충분히 아는 시스템의 재테스트/회귀 이야기."},{"id":"SA24","src":"A","no":24,"label":"Q25","ch":4,"topic":"동등 분할 · 최소 케이스","key":["Equivalence partitioning","Valid equivalence partition"],"q":"직원의 보너스를 계산하는 소프트웨어가 있다. 보너스는 음수(negative)는 될 수 없지만 0은 될 수 있다. 보너스는 근무 기간에 따라 산정한다.\n· 2년 이하\n· 2년 초과 5년 미만\n· 5년 이상 10년 이하 또는 10년 초과\n보너스를 계산하기 위해 모든 유효 동등 파티션(valid equivalence partitions)을 커버하는 최소 테스트 케이스 수는 몇 개인가?","opts":["3","5","2","4"],"answer":3,"why":"유효 동등 분할은 4개: (2년 이하) / (2년 초과~5년 미만) / (5년 이상~10년 이하) / (10년 초과). 분할마다 1개씩 → 4개.","trap":"교재 지면에서 3·4번째 분할이 '또는'으로 한 줄에 붙어 인쇄되어 3개로 세기 쉽다. '또는'은 두 분할을 뜻한다. 또 '0은 될 수 있다'는 보너스 값의 하한이지 근무기간 분할이 아니므로 5개로 늘리면 안 된다."},{"id":"SA25","src":"A","no":25,"label":"Q26","ch":4,"topic":"경계값 분석","key":["Boundary value analysis","Equivalence class"],"q":"속도 제어 및 알림 시스템이 다음과 같이 동작한다.\n· 50 km/h 이하로 주행 시 아무 일도 일어나지 않음\n· 50 km/h보다는 빠르지만 55 km/h 이하인 경우 경고 메시지 표시\n· 55 km/h보다는 빠르지만 60 km/h 이하로 주행 시 벌금 부과\n· 60 km/h보다 빠르게 주행 시 운전 면허 중지\n속도 단위(km/h)는 시스템에서 정수만 가능. 동등 클래스의 경계에 있는 값만을 선택하는 경계 값 분석을 적용해 식별할 수 있는 값 세트(km/h)로 가장 적절한 것은?","opts":["0, 49, 50, 54, 59, 60","50, 55, 60","49, 50, 54, 55, 60, 62","50, 51, 55, 56, 60, 61"],"answer":3,"why":"경계는 50, 55, 60. 정수이므로 각 경계의 양쪽 값(50/51, 55/56, 60/61)을 모두 잡아야 한다 → 50, 51, 55, 56, 60, 61.","trap":"b는 경계값만 나열(한쪽만)이라 '경계 양쪽' 조건 미충족. a는 0을 끼워 넣은 함정(하한은 비유효 영역), c는 49·54·62처럼 클래스 내부 값을 섞었다. 경계값 분석 = 경계의 위·아래 쌍."},{"id":"SA26","src":"A","no":26,"label":"Q27","ch":4,"topic":"결정 테이블 · 누락 규칙","key":["Decision table","Missing rule"],"q":"1년 이상 근무한 직원들에게 합의한 개별 성과 목표를 달성하면 보너스를 지급하는 회사가 있다. 이러한 사실을 결정 테이블로 표현할 수 있다. 다음 테스트 케이스 중 실제로 발생할 수 있는 경우지만, 위 결정 테이블에서 누락된 것은?","html":"<table class='tbl'><tr><th>테스트 ID</th><th></th><th>T1</th><th>T2</th><th>T3</th><th>T4</th></tr><tr><td>조건 1</td><td>1년 이상 근무 여부</td><td>YES</td><td>NO</td><td>NO</td><td>YES</td></tr><tr><td>조건 2</td><td>목표 합의 여부</td><td>NO</td><td>NO</td><td>YES</td><td>YES</td></tr><tr><td>조건 3</td><td>목표 달성 여부</td><td>NO</td><td>NO</td><td>YES</td><td>YES</td></tr><tr><td>예상결과</td><td>보너스 지급</td><td>NO</td><td>NO</td><td>NO</td><td>YES</td></tr></table>","opts":["조건 1 = YES, 조건 2 = NO, 조건 3 = YES, 예상 결과 = NO","조건 1 = YES, 조건 2 = YES, 조건 3 = NO, 예상 결과 = YES","조건 1 = NO, 조건 2 = NO, 조건 3 = YES, 예상 결과 = NO","조건 1 = NO, 조건 2 = YES, 조건 3 = NO, 예상 결과 = NO"],"answer":3,"why":"표에 없는 조합 중 실제로 일어날 수 있고 기대결과가 옳은 것은 d(근무 1년 미만·목표 합의함·미달성 → 보너스 없음)다.","trap":"a·c는 '합의하지 않은 목표를 달성했다'는 논리적으로 불가능한 조합. b는 조합은 가능하지만 기대결과가 YES로 틀렸다(미달성이면 지급 없음). 조합 가능성 + 기대결과 정확성을 동시에 봐야 한다."},{"id":"SA27","src":"A","no":27,"label":"Q28","ch":4,"topic":"상태 전이 · 유효 전이 커버리지","key":["State transition testing","Valid transition"],"q":"아래에 주어진 상태 전이 다이어그램과 테스트 케이스에 대한 설명 중 옳은 것은?","html":"<div class='quote'><b>상태</b>: S1 TV 끔 / S2 TV 대기 / S3 TV 실행<br>S1 →(전원 킴)→ S2 · S2 →(전원 끔)→ S1 · S2 →(리모컨 킴)→ S3 · S3 →(리모컨 끔)→ S2 · S3 →(전원 끔)→ S1</div><table class='tbl'><tr><th>테스트 케이스</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>시작 상태</td><td>S1</td><td>S2</td><td>S2</td><td>S3</td><td>S3</td></tr><tr><td>입력</td><td>전원 킴</td><td>전원 끔</td><td>리모컨 킴</td><td>리모컨 끔</td><td>전원 끔</td></tr><tr><td>예상 종료 상태</td><td>S2</td><td>S1</td><td>S3</td><td>S2</td><td>S1</td></tr></table>","opts":["위 테스트 케이스는 상태 전이 다이어그램의 유효 및 비유효 전이를 모두 커버하는 데 사용할 수 있다.","위 테스트 케이스는 상태 전이 다이어그램의 모든 가능한 유효 전이를 표현하고 있다.","위 테스트 케이스는 상태 전이 다이어그램의 유효 전이 중 몇 가지만 표현하고 있다.","위 테스트 케이스는 상태 전이 다이어그램에서 한 쌍의 전이를 표현하고 있다."],"answer":1,"why":"다이어그램의 유효 전이는 5개(S1→S2, S2→S1, S2→S3, S3→S2, S3→S1)이고, 테스트 케이스 1~5가 정확히 그 5개를 하나씩 커버한다.","trap":"a는 비유효 전이 테스트가 하나도 없는데 '모두 커버'라고 했고, c는 '일부'라 했지만 전부다. d의 '한 쌍(pair)'은 두 개 전이를 이어 붙이는 것이라 이 표(단일 전이)와 다르다."},{"id":"SA28","src":"A","no":28,"label":"Q29","ch":4,"topic":"동등 분할 · 이산값","key":["Equivalence partitioning"],"q":"다음은 비디오 애플리케이션의 요구사항이다: 이 애플리케이션은 다음과 같은 해상도에 따라 비디오를 재생한다.\n1. 640x480\n2. 1280x720\n3. 1600x1200\n4. 1920x1080\n다음 중 이 요구사항을 테스트하기 위해 동등분할 테스트 기법을 적용해 도출한 테스트 케이스 목록은 무엇인가?","opts":["애플리케이션이 1920x1080의 화면 사이즈로 비디오를 재생할 수 있는지 확인한다 (테스트 케이스 1개).","애플리케이션이 640x480과 1920x1080의 화면 사이즈로 비디오를 재생할 수 있는지 확인한다 (테스트 케이스 2개).","애플리케이션이 요구사항에 있는 각각의 화면 사이즈로 비디오를 재생할 수 있는지 확인한다 (테스트 케이스 4개).","애플리케이션이 요구사항에 있는 화면 사이즈 중 하나로 비디오를 재생할 수 있는지 확인한다 (테스트 케이스 1개)."],"answer":2,"why":"해상도 4개는 서로 대체할 수 없는 별개의 동등 분할이다(하나로 다른 하나를 대표할 수 없음). 분할마다 1개씩 → 4개.","trap":"'동등분할 = 대표값 하나'라는 공식만 기억하면 a나 d를 고른다. 값이 열거형·이산형이면 각 값이 곧 분할이라는 점이 포인트."},{"id":"SA29","src":"A","no":29,"label":"Q30","ch":5,"topic":"테스트 관리자 vs 테스터","key":["Test manager","Tester role"],"q":"다음 중 테스트 관리자와 테스터의 업무 분장을 가장 잘 설명한 것은?","opts":["테스트 관리자는 테스팅 활동을 계획하고 어떤 표준을 따를지 결정한다. 테스터는 사용할 도구와 가이드라인을 선택한다.","테스트 관리자는 테스팅 활동을 계획, 조정, 제어한다. 테스터는 테스트를 자동화한다.","테스트 관리자는 테스팅 활동을 계획, 모니터링하고 제어한다. 테스터는 테스트를 설계하고 테스트 완료를 결정한다.","테스트 관리자는 테스팅을 계획, 체계화하고 테스트 케이스를 작성한다. 테스터는 테스트 우선순위를 정하고 실행한다."],"answer":1,"why":"테스트 관리자 = 계획·모니터링·제어·완료 판단(관리 업무), 테스터 = 테스트 설계·구현·실행·자동화(기술 업무).","trap":"a는 도구·가이드라인 선택을 테스터에게 넘겼고(교과서상 관리자 몫), c는 테스트 완료(릴리스) 결정을 테스터에게 줬다. d는 케이스 작성/우선순위를 서로 바꿨다."},{"id":"SA30","src":"A","no":30,"label":"Q31","ch":5,"topic":"테스트 실행 모니터 지표","key":["Test execution monitoring","Metrics"],"q":"다음 중 테스트 실행 모니터에 가장 유용한 메트릭은?","opts":["실행된 테스트 케이스의 비율","테스트 실행에 참여한 평균 테스터 수","소스 코드에 의한 요구사항 커버리지","이미 작성되고 검토된 테스트 케이스의 비율"],"answer":0,"why":"테스트 실행 모니터링 지표는 실행 진행을 보여주는 것 — 실행/미실행 케이스 수, 통과/실패 수, 결함 수·밀도, 신뢰성 등.","trap":"d(작성·검토된 케이스 비율)는 테스트 준비(구현) 단계 지표라 실행 모니터에 부적합. b는 품질 정보가 없고, c는 실행 중 측정하는 값이 아니다."},{"id":"SA31","src":"A","no":31,"label":"Q32","ch":5,"topic":"테스트 계획 요소","key":["Test plan","Budget limitations"],"q":"다음 중 테스트 계획에 영향을 주면서 (초기) 테스트 계획의 일부인 것은?","opts":["예산의 제약(Budget limitations)","테스트 로그(Test log)","장애 발생률(Failure rate)","유스케이스(Use cases)"],"answer":0,"why":"예산 제약은 계획 수립에 직접 영향을 주고, '무엇을 테스트하고 무엇을 생략할지' 우선순위를 정하는 계획의 일부다.","trap":"b·c는 테스트 실행 중에 생기는 산출물·측정값, d는 테스트 베이시스(분석 대상)이지 계획 항목이 아니다."},{"id":"SA32","src":"A","no":32,"label":"Q33","ch":5,"topic":"완료 조건(출구 기준)","key":["Exit criteria","Entry criteria"],"q":"다음 중 테스트의 일반적인 완료 조건만 포함된 목록은 무엇인가?","opts":["측정된 신뢰성, 테스트 커버리지, 테스트 비용, 수정하는 결함과 잔존 리스크에 대한 상태와 일정","측정된 신뢰성, 테스트 커버리지, 테스터의 독립 수준 및 제품 완성도","측정된 신뢰성, 테스트 커버리지, 테스트 비용, 테스트 환경의 가용성, 출시 일정 및 제품 완성도","출시 일정, 결함, 테스터 자격, 테스트 가능한 유스케이스의 가용성, 테스트 커버리지 및 테스트 비용"],"answer":0,"why":"전형적 완료 조건(exit criteria): 측정된 신뢰성, 테스트 커버리지, 테스트 비용, 수정된 결함·잔존 리스크 상태, 일정.","trap":"'테스터 독립 수준', '테스터 자격'은 완료 조건이 아니고, '테스트 환경 가용성', '테스트 가능한 유스케이스 가용성'은 대표적인 시작(entry) 조건이다. 시작/종료 조건을 섞어 놓는 문제."},{"id":"SA33","src":"A","no":33,"label":"Q34","ch":5,"topic":"테스트 요약 보고서","key":["Test summary report","Test plan"],"q":"다음 중 테스트 요약 보고서에 들어가는 내용이 아닌 것은?","opts":["통과/실패 기준에 대한 정의, 테스팅의 목적","테스트 접근법과의 차이","완료 기준 대비 실제 진척률 측정","테스트 대상의 품질 평가"],"answer":0,"why":"'통과/실패 기준'과 '테스팅 목적'을 정의하는 것은 테스트 계획서의 내용이다. 요약 보고서에는 계획 대비 실적이 들어간다.","trap":"b의 '테스트 접근법과의 차이(deviations)'는 요약 보고서에 반드시 들어가는 항목이라 '아닌 것'이 아니다. 요약 보고서 = 완료 기준 대비 진척, 접근법과의 차이, 제품 품질 평가, 결함·리스크. 계획서 = 목적·범위·일정·기준 정의."},{"id":"SA34","src":"A","no":34,"label":"Q35","ch":5,"topic":"테스트 전략 유형","key":["Test strategy","Analytical","Consultative","Reactive"],"q":"프로젝트에서 '스마트' 난방 온도조절기를 개발한다. 테스트 관리자는 테스트 계획서에 ① 전체 시스템에 대한 인수 테스트는 경험 기반 테스트로 실행한다. ② 서버의 제어 알고리즘은 에너지 절약 규정의 표준에 맞춰 점검한다. ③ 온도조절기의 기능 테스트는 리스크 기반 테스팅으로 수행한다. ④ 인터넷을 통한 데이터·통신의 보안 테스트는 외부 보안 전문가와 함께 실행한다. 라는 전략을 정의했다. 구현한 네 가지 일반적인 테스트 전략·접근법 유형은?","opts":["방법론적, 분석적, 반응적 및 리그레션-기피","분석적, 표준 준수, 자문 및 반응적","모델 기반, 방법론적, 분석적 및 자문","리그레션-기피, 자문, 반응적 및 방법론적"],"answer":1,"why":"① 경험 기반 인수 테스트 → 반응적(reactive) / ② 에너지 절약 규정 준수 → 표준 준수(standard-compliant) / ③ 리스크 기반 기능 테스트 → 분석적(analytical) / ④ 외부 보안 전문가 → 자문(consultative).","trap":"a는 '외부 전문가와 협업'을 자문 대신 방법론적으로 바꿔 놓은 함정. c·d는 자문은 맞지만 나머지 조합이 틀렸다. v4.0에서는 이 8종 테스트 전략 체계가 CTFL 범위에서 빠진다."},{"id":"SA35","src":"A","no":35,"label":"Q36","ch":5,"topic":"추정 기법","key":["Metric-based estimation","Experience-based estimation"],"q":"다음 중 테스트 추정에서 메트릭 기반 접근법의 특징은?","opts":["과거의 유사한 테스트 프로젝트의 예산을 참고한다.","테스트 관리자를 인터뷰하여 전반적인 경험을 수집한다.","테스트 자동화를 위한 노력의 추정은 테스트팀에서 합의로 도출한다.","비즈니스 전문가가 수집한 계산의 평균치를 사용한다."],"answer":0,"why":"메트릭 기반(metric-based) 추정 = 과거 프로젝트의 실측 데이터·비율(사전 산정된 메트릭)을 근거로 규모와 노력을 계산.","trap":"b·c·d는 모두 '전문가 기반(experience-based)' 추정(의견·경험·합의·전문가 평균). v4.0에서도 추정 기법(메트릭 기반/전문가 기반)은 그대로 출제된다."},{"id":"SA36","src":"A","no":36,"label":"Q37","ch":5,"topic":"요구사항 의존성 · 일정","key":["Test scheduling","Dependency"],"q":"테스트 관리자로서 당신은 아래의 요구사항 부분들을 테스트해야 한다: R1 프로세스 이상 / R2 동기화 / R3 승인 / R4 문제 해결 / R5 회계 데이터 / R6 다이어그램 데이터 / R7 사용자 프로필 변경. 표기법 A → B는 B가 A에 의존적임을 의미한다. 다음 중 요구사항의 의존 관계에 따라 테스트 실행 일정을 구성한 것은?","html":"<div class='quote'><b>의존 관계</b><br>R1 → R3, R1 → R2, R3 → R2<br>R2 → R5, R2 → R6 (R5·R6는 R2 아래 점선 박스로 묶여 있음)<br>(R5·R6) → R4, (R5·R6) → R7</div>","opts":["R1 → R3 → R4 → R7 → R2 → R5 → R6","R1 → R3 → R2 → R4 → R7 → R5 → R6","R1 → R3 → R2 → R5 → R6 → R4 → R7","R1 → R2 → R5 → R6 → R3 → R4 → R7"],"answer":2,"why":"의존성: R1→R3, R1→R2, R3→R2, R2→R5, R2→R6, (R5·R6)→R4, (R5·R6)→R7. 따라서 R1, R3 다음 R2, 그다음 R5·R6, 마지막에 R4·R7.","trap":"b는 R4·R7을 R5·R6보다 먼저 두는데 위반. a는 R2가 R4 뒤에, d는 R3가 R2 뒤에 와서 위반. 앞에서부터 화살표 방향만 확인하면 걸러진다."},{"id":"SA37","src":"A","no":37,"label":"Q38","ch":5,"topic":"결함 보고서 필수 항목","key":["Defect report","Tested software version"],"q":"커피머신을 위한 신규 버전의 소프트웨어를 테스팅하고 있다. 커피머신은 4가지 범주(사이즈 S·M·L, 설탕 없음~4스푼, 우유 있음·없음, 향 시럽 없음·카라멜·헤이즐넛·바닐라)에 따라 커피를 준비한다. 당신은 다음과 같은 결함 보고서를 작성하고 있다. 다음 중 위의 결함 보고서에서 누락된 중요한 정보는 무엇인가?","html":"<div class='quote'>· 제목: 낮은 커피 온도<br>· 요약: 우유 추가 커피 선택 시, 커피 준비 시간이 너무 오래 걸리고 음료 온도가 너무 낮다 (40℃ 미만)<br>· 기대 결과: 커피 온도는 표준 온도로 제공되어야 한다 (약 75℃)<br>· 리스크 수준: 중간<br>· 우선순위: 보통</div>","opts":["실제 테스트 결과","테스트한 소프트웨어에 버전의 식별","결함 상태","테스트 케이스 개선 아이디어"],"answer":1,"why":"테스트한 소프트웨어의 '버전 식별(identification of the tested software version)'이 없다. 결함 보고서에는 어떤 빌드·버전에서 재현됐는지가 반드시 남아야 재현과 추적이 된다.","trap":"a(실제 결과)는 요약에 '40℃ 미만, 준비 시간 지연'으로 이미 서술돼 있어 빠진 정보가 아니다. c(결함 상태)는 결함 관리 도구가 부여하는 워크플로 값이고, d는 결함 보고서의 필수 항목이 아니다."},{"id":"SA38","src":"A","no":38,"label":"Q39","ch":6,"topic":"테스트 실행 도구","key":["Test execution tool","Configuration management"],"q":"다음 중 테스트 실행 도구의 가장 큰 이점은 무엇인가?","opts":["리그레션 테스트 생성이 용이하다.","테스트 자산의 버전 제어 유지가 용이하다.","보안 테스팅을 위한 테스트 설계에 용이하다.","리그레션 테스트 수행에 용이하다."],"answer":3,"why":"테스트 실행 도구의 최대 이점 = 반복적인 수동 작업 감소(야간 회귀 실행, 환경 설정·해체, 동일 데이터 재입력 등) → 시간 절감.","trap":"b(버전 제어)는 형상 관리 도구의 역할, c(보안 테스트 설계)는 전문 도구·전문성 필요, a(생성)는 '생성'보다 '실행'이 이점."},{"id":"SA39","src":"A","no":39,"label":"Q40","ch":6,"topic":"도구와 사용자","key":["Static analysis tool","Developer vs tester"],"q":"다음 테스트 도구 중 테스터보다는 개발자에게 보다 적합한 도구는?","opts":["요구사항 관리 도구","형상 관리 도구","정적 분석 도구","성능 테스팅 도구"],"answer":2,"why":"정적 분석 도구는 소스 코드를 실행 없이 분석해 코딩 표준·결함을 찾는 도구라 개발자에게 특히 적합하다.","trap":"요구사항·형상 관리 도구는 테스터에게도 똑같이 유용하고, 성능 테스팅 도구는 오히려 테스터의 주력 도구. '개발자용 = 코드를 다루는 도구'로 기억."},{"id":"SA40","src":"A","no":40,"label":"부록 Q1","ch":1,"topic":"테스트 케이스 정의","key":["Test case","Test oracle","Testware"],"q":"다음 중 테스트 케이스의 용어 정의를 설명하는 것은?","opts":["모든 값(value)이 명세 기반으로 동일하게 다루어질 것으로 예상되는 컴포넌트나 시스템 내 변수 값 영역의 부분집합(subset)","테스트 컨디션(test conditions)에 기초해 개발된 일련의 사전조건, 입력, 행동, 예상 결과 및 사후조건","테스팅 계획, 설계, 실행, 평가 및 보고에서 사용하기 위해 테스트 프로세스 동안 생산한 작업 산출물(work products)","테스트 중인 시스템의 실제 결과와 비교할 예상 결과를 결정하는 소스"],"answer":1,"why":"테스트 케이스 = 사전조건·입력·행동·예상 결과·사후조건의 집합.","trap":"a는 동등 분할(equivalence partition), c는 테스트웨어(testware), d는 테스트 오라클(test oracle)의 정의."},{"id":"SA41","src":"A","no":41,"label":"부록 Q2","ch":1,"topic":"테스팅의 목적","key":["Testing objectives"],"q":"다음 중 테스팅의 일반적인 목적 중 하나인 것은?","opts":["결함과 장애 발견","프로젝트 계획이 요구대로 진행되는지 확인","완전한 테스팅 보장","실제 결과와 예상 결과의 비교"],"answer":0,"why":"테스팅의 대표 목적은 결함·장애를 찾아내는 것.","trap":"b는 프로젝트 관리 업무, c는 '완전한 테스팅'이 불가능하다는 원칙에 위배, d는 테스트 실행의 '수단'이지 목적이 아니다."},{"id":"SA42","src":"A","no":42,"label":"부록 Q3","ch":1,"topic":"장애(failure) 판별","key":["Failure","Defect"],"q":"다음 중 자동차의 자동 주행속도 유지 시스템의 장애로 볼 수 있는 것은?","opts":["시스템 개발자가 잘라 붙이기(cut-and-paste) 후 변경된 부분에 대한 이름 수정을 잊어버렸다.","후진 시 경고음을 울리는 불필요한 코드가 시스템에 들어갔다.","라디오 볼륨을 키우거나 줄일 때 시스템이 설정 속도를 유지하지 못한다.","시스템의 설계 명세에 km/h 속도 단위가 잘못 표기되었다."],"answer":2,"why":"장애(failure) = 실행 중 시스템이 요구된 기능을 수행하지 못하는 것. 속도 유지 실패가 장애다.","trap":"a·b·d는 모두 결함(defect) — 코드 오류, 불필요 코드, 명세 오류. '실행 중 관찰되는가'가 장애/결함의 갈림길."},{"id":"V01","src":"V","no":1,"ch":1,"topic":"7원칙 · 결함 부재의 오류","key":["Absence-of-defects fallacy"],"q":"다음 중 테스팅의 7원칙에 대한 설명으로 **옳지 않은** 것은?","opts":["결함은 특정 모듈에 집중되는 경향이 있으므로 결함이 많이 발견된 모듈에 테스트를 집중하는 것이 효과적이다.","발견된 결함을 모두 수정했다면, 사용자와 비즈니스 요구를 충족하지 못하는 시스템도 성공한 제품이 된다.","테스팅은 개발 초기부터 시작할수록 시간과 비용을 절약할 수 있다.","테스팅 접근법은 안전 필수 시스템과 게임처럼 문맥에 따라 달라진다."],"answer":1,"why":"7원칙 중 '결함 부재의 오류(absence-of-defects fallacy)'다. 결함을 모두 수정했다는 사실은 요구사항 충족을 보장하지 않는다. 요구사항 자체가 틀렸다면 결함이 0인 실패한 제품이 된다.","trap":"b는 '결함을 모두 수정했다'는 문장에 끌려 정답처럼 보인다. 7원칙 7번은 '결함을 다 고쳐도 쓸모없는 시스템은 실패'라는 문장으로 외운다."},{"id":"V02","src":"V","no":2,"ch":1,"topic":"테스트 프로세스 · 모니터링·제어·완료","key":["Test monitoring","Test control","Test completion"],"q":"테스트 프로세스 활동에 대한 설명으로 옳은 것은?","opts":["테스트 모니터링은 계획 대비 실제 진척을 비교하고, 테스트 제어는 그 차이를 줄이기 위한 시정 조치를 취하는 활동이다.","테스트 제어는 계획과의 차이를 측정하는 활동이고, 모니터링은 측정 결과에 따라 자원을 재배치하는 활동이다.","테스트 완료 활동은 테스트 결과를 처음으로 기록하는 단계로, 결함 보고서를 작성하는 활동이다.","테스트 모니터링·제어는 테스트 실행이 모두 끝난 뒤에만 수행한다."],"answer":0,"why":"모니터링 = 측정·비교(진척, 커버리지, 결함 상태), 제어 = 차이를 줄이는 시정 조치(범위 조정·우선순위 변경·자원 재배치). 완료 활동 = 종료 판단, 완료 보고서, 테스트웨어 아카이빙, 교훈 도출.","trap":"b는 모니터링과 제어를 서로 뒤집었다. c는 '결함 보고서 작성'을 완료 활동이라고 했지만 그것은 테스트 실행 활동이다. d는 모니터링·제어가 프로젝트 내내 계속된다는 점을 비튼 문장."},{"id":"V03","src":"V","no":3,"ch":2,"topic":"시프트 레프트","key":["Shift Left"],"q":"시프트 레프트(Shift Left) 접근법에 대한 설명으로 **옳지 않은** 것은?","opts":["테스트 활동을 개발 수명주기의 이른 단계로 옮겨 결함을 조기에 발견하는 접근법이다.","정적 테스팅·리뷰·테스트 우선(TDD·ATDD) 개발 방식이 시프트 레프트의 예가 될 수 있다.","테스트를 개발 완료 후 릴리스 직전 단계에 집중시켜 테스트 비용을 낮춘다.","시프트 레프트를 위해서는 테스터가 요구사항·설계 단계부터 개발팀과 협업해야 한다."],"answer":2,"why":"시프트 레프트는 테스트를 수명주기의 왼쪽(이른 단계)으로 옮기는 것이다. 늦은 단계에 집중하는 것은 shift right이자 전통적 폭포수 모델의 특징이다.","trap":"c는 '테스트 비용을 낮춘다'는 결과만 옮겨 놓아 그럴듯하다. 방향(왼쪽 = 조기)이 뒤집혔는지 먼저 확인한다."},{"id":"V04","src":"V","no":4,"ch":2,"topic":"SDLC · 좋은 테스팅 관행","key":["Good testing practices","Retrospective"],"q":"다음 중 좋은 테스팅 관행(good testing practices)에 대한 설명으로 **옳지 않은** 것은?","opts":["각 테스트 레벨마다 고유한 목적과 테스트 베이스가 있으므로 레벨별 목표를 명확히 정의한다.","리스크 기반으로 테스트를 설계해 리스크가 높은 영역에 노력을 집중한다.","테스트 분석·설계는 개발이 모두 끝난 뒤 시작해 변경을 최소화하는 것이 가장 효율적이다.","회고(retrospective)를 통해 프로세스를 개선하고 테스트의 효과와 효율을 높인다."],"answer":2,"why":"좋은 관행은 레벨별 목표 정의, 리스크 기반 설계, 조기 테스트 분석·설계, 추적성 유지, 회고를 통한 개선이다. 테스트 분석·설계는 조기에 시작해 개발 진행에 맞춰 계속 갱신한다.","trap":"c는 '변경을 최소화'라는 그럴듯한 이유를 붙였다. '모두 끝난 뒤'라는 시점 표현이 나오면 오답 후보다."},{"id":"V05","src":"V","no":5,"ch":3,"topic":"리뷰 역할","key":["Author","Moderator","Scribe","Review Leader","Reviewer"],"q":"공식 리뷰의 역할에 대한 설명으로 옳은 것은?","opts":["작성자(Author)는 자신의 작업 산출물을 검토받으며, 리뷰에서 확인된 결함을 수정할 책임을 진다.","서기(Scribe)는 리뷰 회의를 진행하고 참가자 간의 의견 충돌을 중재한다.","조정자(Moderator)는 리뷰 대상 산출물과 리뷰 일정·자원을 결정한다.","리뷰 리더(Review Leader)는 회의 내용과 결정 사항을 기록하는 역할만 수행한다."],"answer":0,"why":"작성자 = 산출물 작성자이자 결함 수정 책임자. 서기 = 기록, 조정자 = 진행·중재, 리뷰 리더 = 전반 책임·역할 배정, 관리자 = 대상·자원·일정 결정, 리뷰어 = 검토·결함 제시.","trap":"b는 조정자의 일, c는 관리자의 일, d는 서기가 하는 일을 각각 다른 역할에 붙였다. 작성자-수정 / 조정자-진행·중재 / 리더-전반·배정 / 서기-기록 / 관리자-자원·일정 / 리뷰어-검토로 짝지어 외운다."},{"id":"V06","src":"V","no":6,"ch":3,"topic":"리뷰 유형 · 워크스루","key":["Walkthrough","Informal Review","Technical Review","Inspection"],"q":"다음 설명에 해당하는 리뷰 유형은?","html":"<div class='quote'>작성자가 자신의 작업 산출물을 참가자들에게 설명하고, 참가자들은 질문을 통해 이해를 높인다. 주된 목적은 교육과 이해도 향상 및 합의 도출이며, 격식 수준이 낮은 편이다.</div>","opts":["비공식 리뷰(Informal Review)","워크스루(Walkthrough)","기술 리뷰(Technical Review)","인스펙션(Inspection)"],"answer":1,"why":"워크스루 = 작성자 주도, 작성자가 설명하고 참가자가 질문, 목적은 교육·이해도 향상·합의. 네 유형 중 격식은 비공식 리뷰 다음으로 낮다.","trap":"'격식이 낮다'는 표현 때문에 비공식 리뷰를 고르기 쉽다. 비공식 리뷰는 절차·기록 없이 수시로 하는 것이고, '작성자가 직접 설명한다'가 워크스루의 결정적 표지다."},{"id":"V07","src":"V","no":7,"ch":3,"topic":"인스펙션 vs 기술 리뷰","key":["Inspection","Technical Review","Checklist"],"q":"다음 중 인스펙션(Inspection)과 기술 리뷰(Technical Review)의 차이로 옳은 것은?","opts":["인스펙션은 작성자가 주도하고, 기술 리뷰는 조정자가 주도한다.","인스펙션은 규칙·체크리스트·측정 지표를 사용하는 가장 공식적인 리뷰이고, 기술 리뷰는 기술 전문가(동료)가 참여해 기술적 결함과 합의를 도출하는 리뷰다.","기술 리뷰는 격식이 가장 낮아 절차와 기록을 남기지 않는다.","인스펙션은 교육과 이해도 향상을 주된 목적으로 한다."],"answer":1,"why":"인스펙션 = 가장 공식적, 조정자 주도, 개별 준비·체크리스트·측정 지표로 결함 발견 극대화. 기술 리뷰 = 동료 기술 전문가가 참여해 기술적 결함을 찾고 합의를 도출하며, 문서화된 절차를 따른다.","trap":"a는 주도자를 뒤집었다(인스펙션 = 조정자). c는 비공식 리뷰의 설명, d는 워크스루의 목적이다. 네 유형을 주도자·목적·격식 세 축으로 비교해 두면 섞이지 않는다."},{"id":"V08","src":"V","no":8,"ch":3,"topic":"리뷰 프로세스 5활동","key":["Issue communication and analysis","Individual review"],"q":"공식 리뷰 프로세스에서 '발견된 이상(결함·질문)을 분류하고 심각도를 판단하며, 결함으로 확정할지 결정한다'에 해당하는 활동은?","opts":["계획(Planning)","시작 회의(Kick-off)","개별 리뷰(Individual review)","이슈 커뮤니케이션과 분석(Issue communication and analysis)"],"answer":3,"why":"5활동은 계획 → 시작 회의 → 개별 리뷰 → 이슈 커뮤니케이션과 분석 → 수정·보고 순이다. '분류·심각도 판단·결함 확정'은 4번째 활동이다.","trap":"개별 리뷰(c)는 '각자 검토해 결함·질문을 기록'하는 데까지다. 기록된 이상을 모아 분류하고 결함으로 확정하는 것은 그 다음 단계."},{"id":"V09","src":"V","no":9,"ch":4,"topic":"경계값 분석 · 2-value/3-value","key":["2-value BVA","3-value BVA"],"q":"나이 입력 필드의 유효 범위가 '18 이상 70 이하(정수)'일 때, **2-value 경계값 분석**과 **3-value 경계값 분석**에서 각각 사용하는 테스트 값의 개수는?","opts":["2-value 4개, 3-value 6개","2-value 4개, 3-value 4개","2-value 6개, 3-value 6개","2-value 2개, 3-value 4개"],"answer":0,"why":"경계는 2개(18, 70). 2-value = 2 × 2 = 4개(17, 18, 70, 71). 3-value = 2 × 3 = 6개(17, 18, 19, 69, 70, 71).","trap":"②는 3-value를 경계 안쪽 값만 세어 4개로 만든 답. ④는 경계를 1개로 착각한 답. 값 개수 = 경계 개수 × 2 또는 × 3, 그리고 3-value는 경계 양옆(경계−1, 경계, 경계+1)을 모두 쓴다."},{"id":"V10","src":"V","no":10,"ch":4,"topic":"구문 vs 분기 커버리지 계산","key":["Statement coverage","Branch coverage"],"q":"다음 의사코드에서 테스트 케이스 **TC1(A=5, C=3) 하나만** 실행했다. 구문 커버리지와 분기 커버리지로 옳은 것은? (실행 가능한 문장은 2, 5, 7번)","html":"<pre class='code'>1  if (A &gt; 0) then\n2      B = 1\n3  end if\n4  if (C &gt; 0) then\n5      D = 2\n6  end if\n7  E = 3</pre>","opts":["구문 100%, 분기 100%","구문 100%, 분기 50%","구문 33%, 분기 25%","구문 100%, 분기 25%"],"answer":1,"why":"TC1은 A>0 참, C>0 참만 지나므로 문장 2·5·7이 모두 실행된다 → 구문 3/3 = 100%. 분기는 (A>0) 참·거짓, (C>0) 참·거짓 4개 중 2개만 실행 → 2/4 = 50%.","trap":"'문장을 다 지났으니 분기도 다 봤다'고 착각하면 ①. 분기 커버리지의 분모는 결정 지점 수가 아니라 분기 결과 수(결정 지점 × 2)다. 이 문제가 '구문 100%여도 분기 50%일 수 있다'의 반례다."},{"id":"V11","src":"V","no":11,"ch":4,"topic":"상태 전이 · 0-switch vs 1-switch","key":["0-switch coverage","1-switch coverage","Invalid transition"],"q":"상태 전이 테스팅의 커버리지에 대한 설명으로 **옳지 않은** 것은?","opts":["'모든 상태' 커버리지는 모든 상태를 최소 한 번 방문하는 가장 약한 수준이다.","0-switch 커버리지(유효 전이 커버리지)는 모든 유효 전이를 최소 한 번 실행하는 것이다.","1-switch 커버리지는 서로 연결된 두 개의 전이로 이루어진 모든 시퀀스를 최소 한 번 실행하는 것이다.","무효 전이 테스트는 커버리지를 높이는 데 쓰이므로 유효 전이 커버리지 계산의 분자에 포함한다."],"answer":3,"why":"무효 전이 시도는 오류 처리 확인용이며, 유효 전이 커버리지의 분자에도 분모에도 포함하지 않는다.","trap":"d는 '커버리지를 높이는 데 쓰인다'는 목적어가 자연스러워 보인다. 무효 전이는 커버리지 산정 대상이 아니라 오류 처리를 검증하는 별개의 테스트다."},{"id":"V12","src":"V","no":12,"ch":4,"topic":"결정 테이블 · 무관 조건","key":["Decision table","Don't care","Minimum test cases"],"q":"조건 3개(C1·C2·C3)로 이루어진 결정 테이블을 무관 조건(don't care, '–')으로 축소한 결과가 아래와 같다. 모든 규칙을 최소한의 테스트 케이스로 커버하는 데 필요한 테스트 케이스 수는?","html":"<table class='tbl'><tr><th>규칙</th><th>C1</th><th>C2</th><th>C3</th><th>액션</th></tr><tr><td>R1</td><td>Y</td><td>–</td><td>Y</td><td>A1</td></tr><tr><td>R2</td><td>Y</td><td>–</td><td>N</td><td>A2</td></tr><tr><td>R3</td><td>N</td><td>Y</td><td>–</td><td>A3</td></tr><tr><td>R4</td><td>N</td><td>N</td><td>–</td><td>A4</td></tr></table>","opts":["4개","8개","9개","16개"],"answer":0,"why":"축소 후 규칙이 4개이고 규칙끼리 겹치지 않으므로 규칙당 케이스 1개 = 4개. 각 규칙의 무관 조건 자리에는 어떤 값이든 넣을 수 있지만, 규칙 하나를 커버하는 데 케이스는 1개면 충분하다.","trap":"② 8개는 2^3으로 전체 조합을 센 답(무관 조건을 무시). ③ 9개는 조건 3개 × 값 3개 식의 잘못된 계산, ④ 16개는 2^4. 결정 테이블 최소 케이스 = 축소 후 규칙 수."},{"id":"V13","src":"V","no":13,"ch":4,"topic":"협업 기반 · ATDD","key":["ATDD","TDD","BDD","Acceptance criteria"],"q":"ATDD(인수 테스트 주도 개발)에 대한 설명으로 옳은 것은?","opts":["인수 조건을 개발 착수 전에 고객·개발자·테스터가 함께 합의하고, 그 인수 테스트를 통과하도록 개발을 진행하는 방식이다.","개발이 완료된 뒤 테스터가 단독으로 인수 테스트 케이스를 작성하고 실행하는 방식이다.","단위 테스트를 먼저 작성해 실패를 확인한 뒤 코드를 작성하는 방식이다.","Given/When/Then 형식으로 행위 시나리오를 작성하는 방식이다."],"answer":0,"why":"ATDD = 인수 조건(인수 테스트)을 먼저 합의하고 그것을 통과하도록 개발한다. 고객·개발자·테스터(3 amigos)가 함께 작성하는 것이 핵심이다.","trap":"③은 TDD, ④는 BDD다. ATDD=인수, TDD=단위, BDD=행위(Given/When/Then)로 구분한다. ②는 '개발 후·테스터 단독'이라 협업 기반 접근법의 정반대다."},{"id":"V14","src":"V","no":14,"ch":4,"topic":"상태 전이 · 1-switch 계산","key":["1-switch coverage","Transition pair"],"q":"어떤 상태 전이 다이어그램의 유효 전이가 4개다: S1→S2, S2→S3, S3→S1, S3→S2. **1-switch 커버리지**를 달성하기 위해 커버해야 하는 전이 쌍(길이 2 시퀀스)의 최소 개수는?","opts":["4개","5개","6개","8개"],"answer":1,"why":"각 전이의 도착 상태에서 나가는 전이 수를 세면 된다. S1→S2 뒤에는 S2→S3 하나(1쌍), S2→S3 뒤에는 S3→S1·S3→S2 둘(2쌍), S3→S1 뒤에는 S1→S2 하나(1쌍), S3→S2 뒤에는 S2→S3 하나(1쌍). 합계 1+2+1+1 = 5쌍.","trap":"① 4개는 전이 수를 그대로 쓴 답(0-switch). ④ 8개는 4×2로 모든 전이에 쌍이 2개씩 있다고 본 답. 1-switch는 '연결된(도달 가능한) 쌍'만 센다 — 도착 상태에서 나가는 전이가 없는 전이는 쌍을 만들지 못한다."},{"id":"V15","src":"V","no":15,"ch":5,"topic":"애자일 테스팅 사분면","key":["Q1","Q2","Q3","Q4","Technology","Business","Support the Team","Critique the Product"],"q":"애자일 테스팅 사분면(Q1~Q4)에 대한 설명으로 옳은 것은?","opts":["Q1은 기술 주도·팀 지원 영역으로 컴포넌트(단위) 테스트와 같은 자동화 테스트가 해당한다.","Q2는 기술 주도·제품 비평 영역으로 성능·보안 테스트가 해당한다.","Q3은 비즈니스 주도·팀 지원 영역으로 인수 조건에 대한 기능 테스트가 해당한다.","Q4는 비즈니스 주도·제품 비평 영역으로 사용성 테스트가 해당한다."],"answer":0,"why":"Q1 = 기술 주도·팀 지원(단위·컴포넌트 테스트), Q2 = 비즈니스 주도·팀 지원(인수 조건 기능 테스트), Q3 = 비즈니스 주도·제품 비평(사용성·탐색적·UAT), Q4 = 기술 주도·제품 비평(성능·부하·보안).","trap":"②는 Q4의 예를 Q2에, ③은 Q2의 예를 Q3에, ④는 Q3의 예를 Q4에 붙였다. 가로축(기술/비즈니스)만, 세로축(팀 지원/제품 비평)만 뒤집어도 오답이 된다."},{"id":"V16","src":"V","no":16,"ch":5,"topic":"제품 리스크 vs 프로젝트 리스크","key":["Product risk","Project risk","Risk-based testing"],"q":"제품 리스크(product risk)와 프로젝트 리스크(project risk)에 대한 설명으로 **옳지 않은** 것은?","opts":["제품 리스크는 제품의 품질(기능·성능·보안 등)과 관련된 리스크로, 발생하면 사용자·비즈니스가 피해를 본다.","프로젝트 리스크는 테스트나 프로젝트를 진행할 능력과 관련된 리스크로, 일정·인력·예산·환경 문제가 해당한다.","리스크 기반 테스팅에서는 제품 리스크 수준이 높은 영역부터 더 깊게 테스트한다.","프로젝트 리스크의 리스크 수준이 가장 높은 항목은 제품 리스크와 무관하게 항상 테스트 우선순위 1순위가 된다."],"answer":3,"why":"테스트 우선순위는 제품 리스크를 기준으로 정한다. 프로젝트 리스크는 그 자체로 완화 계획(자원·일정·환경 대응)을 세우는 대상이지, 제품 테스트 순서를 정하는 기준이 아니다.","trap":"④는 '가장 높은 항목'이라는 표현 때문에 낚인다. 점수 합계가 가장 높아도 유형이 프로젝트 리스크면 제품 우선순위에서는 제외한다. '테스트를 못 하게 되는 것' = 프로젝트 / '제품이 나빠지는 것' = 제품."},{"id":"V17","src":"V","no":17,"ch":5,"topic":"3점 추정(PERT)","key":["PERT","Three-point estimation","Standard deviation"],"q":"3점 추정으로 어떤 테스트 활동의 기간을 추정했다. 낙관치 4일, 최빈치 8일, 비관치 18일일 때, **PERT 기대 기간**과 **표준편차**로 옳은 것은? (표준편차 = (비관치 − 낙관치) / 6)","opts":["기대 9일, 표준편차 2.33일","기대 10일, 표준편차 2.33일","기대 9일, 표준편차 7일","기대 9일, 표준편차 2일"],"answer":0,"why":"기대 기간 = (4 + 4×8 + 18) / 6 = 54 / 6 = 9일. 표준편차 = (18 − 4) / 6 ≈ 2.33일.","trap":"②는 산술평균 (4+8+18)/3 = 10 — m에 4배 가중을 잊은 답. ③은 표준편차를 범위의 절반((18−4)/2)으로 계산한 답. ④는 (b−a)/7 또는 반올림 실수. 공식은 (O+4M+P)/6 과 (P−O)/6 두 줄뿐이다."},{"id":"V18","src":"V","no":18,"ch":5,"topic":"테스트 계획서 vs 완료 보고서","key":["Test plan","Test completion report"],"q":"테스트 완료(요약) 보고서에 반드시 포함되는 내용으로 **옳지 않은** 것은?","opts":["테스트 완료 기준(출구 기준) 대비 실제 진척","계획된 테스트 접근법과의 차이(deviations)","테스트 대상 제품의 품질 평가와 미해결 결함·잔여 리스크","테스트 목적·범위·일정·자원 및 사용할 테스트 기법의 정의"],"answer":3,"why":"④는 테스트 계획서의 내용이다. 완료 보고서에는 완료 기준 대비 진척, 접근법과의 차이, 제품 품질 평가, 미해결 결함·잔여 리스크, 종료 이유, 교훈이 들어간다.","trap":"①②③은 모두 완료 보고서 항목이라 지우기 어렵다. '정의한다'가 들어가면 계획서, '실적·평가·차이·잔여'가 들어가면 보고서로 갈라진다."},{"id":"V19","src":"V","no":19,"ch":5,"topic":"결함 보고서 필수 항목","key":["Defect report","Tested software version","Severity","Priority"],"q":"결함 보고서에 포함해야 할 필수 정보로 **가장 거리가 먼** 것은?","opts":["테스트한 소프트웨어의 버전(빌드) 식별과 테스트 환경","결함을 재현하는 절차, 실제 결과와 기대 결과","개발자가 추정한 결함 원인과 수정에 걸릴 소요 시간","결함의 심각도와 우선순위"],"answer":2,"why":"결함 보고서의 필수 정보는 식별자·제목·발견 일시와 발견자, 테스트 대상과 환경(빌드·버전), 재현 절차, 기대 결과, 실제 결과, 심각도, 우선순위, 상태, 참고 자료다. 추정 원인과 수정 소요 시간은 보조 정보다.","trap":"③은 '원인을 알면 도움이 되니 필수겠지'라고 생각하기 쉽다. 추정 원인은 참고일 뿐이며, 재현 절차와 버전 식별이 먼저다. 결함 보고서는 '누구나 재현할 수 있게'가 기준이다."},{"id":"V20","src":"V","no":20,"ch":6,"topic":"도구 유형별 역할","key":["Configuration management tool","Test execution tool","Static analysis tool","Performance testing tool"],"q":"다음 중 테스트 도구와 그 주된 역할의 연결로 **옳지 않은** 것은?","opts":["형상 관리 도구 — 테스트웨어와 테스트 대상의 버전 관리 및 변경 통제","테스트 실행 도구 — 테스트 스크립트를 실행하고 실제 결과와 기대 결과를 비교","정적 분석 도구 — 소스 코드를 실행하지 않고 코딩 표준 위반·도달 불가 코드를 탐지","테스트 관리 도구 — 부하를 생성해 응답 시간과 처리량을 측정"],"answer":3,"why":"부하 생성·응답 시간·처리량 측정은 비기능(성능) 테스팅 도구의 역할이다. 테스트 관리 도구는 계획·케이스·추적성·실행 결과 기록·보고·결함 연계를 지원한다.","trap":"'테스트 관리'라는 이름이 넓어 보여서 걸리기 쉽다. '부하·동시 사용자·응답 시간'이 나오면 성능 테스팅 도구, '추적성·계획·보고'가 나오면 관리 도구로 자른다."}];

/* ============ meta ============ */
const CH_NAME = {1:"테스팅의 기초",2:"SDLC와 테스팅",3:"정적 테스팅",4:"테스트 분석·설계",5:"테스트 활동 관리",6:"테스트 도구"};
const CH_SHORT = {1:"Ch.1",2:"Ch.2",3:"Ch.3",4:"Ch.4",5:"Ch.5",6:"Ch.6"};
const SRC_NAME = {H:"🔥 지옥 킬러",F:"D-1 파이널",M:"실전 모의고사",A:"Sample Exam A",V:"v4.0 집중"};
const EXAM_DATE = "2026-11-18";
const LS_KEY = "istqb-ctfl-v4-quiz-v2";
const LETTER = ["a","b","c","d"];

const QBY_ID = {};
QUESTIONS.forEach(q => { QBY_ID[q.id] = q; });

/* ============ storage (file:// safe) ============ */
let storeOK = true;
function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ storeOK = false; return null; }
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch(e){ storeOK = false; }
}
let store = loadStore() || {};
store.wrong = store.wrong || {};
store.ch = store.ch || {};
store.stat = store.stat || {a:0, c:0};

/* ============ utils ============ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(t){
  if(t == null) return "";
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}
const $view = document.getElementById("view");
const wrongCount = () => Object.keys(store.wrong).length;
function chStats(ch){
  const s = store.ch[ch];
  if(!s || !s.a) return null;
  return {a:s.a, c:s.c, pct:Math.round(s.c / s.a * 100)};
}
function overallPct(){
  const s = store.stat;
  if(!s.a) return null;
  return Math.round(s.c / s.a * 100);
}
function dday(){
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const [y,m,d] = EXAM_DATE.split("-").map(Number);
  const t1 = new Date(y, m-1, d);
  const diff = Math.round((t1 - t0) / 86400000);
  if(diff > 0) return "D-" + diff;
  if(diff === 0) return "D-Day";
  return "시험일 " + EXAM_DATE.replace(/-/g,".");
}
let hintT = null;
function hint(msg){
  const el = document.getElementById("hint");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(hintT);
  hintT = setTimeout(()=>el.classList.remove("on"), 1600);
}

/* ============ state ============ */
const S = { screen:"home", mode:null, chapter:null, ids:[], idx:0, ans:{}, startedAt:0, view:"home" };
let tickT = null;
let lastWrongIds = [];
function killNav(){ const n = document.querySelector(".nav"); if(n) n.remove(); }
function setNav(on){ document.getElementById("app").classList.toggle("has-nav", !!on); }

function saveSession(){
  if(S.screen !== "quiz") return;
  store.session = { mode:S.mode, chapter:S.chapter, ids:S.ids, idx:S.idx, ans:S.ans, startedAt:S.startedAt };
  saveStore();
}
function clearSession(){
  delete store.session; saveStore();
}

/* ============ mode sets ============ */
function setFor(mode, chapter){
  if(mode === "hell")   return QUESTIONS.filter(q => q.src === "H");
  if(mode === "final")  return QUESTIONS.filter(q => q.src === "F");
  if(mode === "mock")   return QUESTIONS.filter(q => q.src === "M");
  if(mode === "sample") return QUESTIONS.filter(q => q.src === "A");
  if(mode === "v4")     return QUESTIONS.filter(q => q.src === "V");
  if(mode === "chapter")return QUESTIONS.filter(q => q.ch === Number(chapter));
  if(mode === "wrong")  return Object.keys(store.wrong).map(id => QBY_ID[id]).filter(Boolean);
  return [];
}

/* ============ render: home ============ */
function renderHome(){
  S.screen = "home"; S.view = "home";
  stopTimer(); killNav(); setNav(false);

  const wc = wrongCount();
  const op = overallPct();
  const sess = store.session;

  let resumeHTML = "";
  if(sess && sess.ids && sess.ids.length && sess.ans && Object.keys(sess.ans).length){
    const name = sess.mode === "chapter" ? (CH_SHORT[sess.chapter] + " 골라 풀기")
              : sess.mode === "hell" ? "🔥 지옥 난이도 킬러 40문항"
              : sess.mode === "final" ? "D-1 파이널 40문항"
              : sess.mode === "mock" ? "전체 실전 모의고사"
              : sess.mode === "sample" ? "Sample Exam A"
              : sess.mode === "v4" ? "v4.0 집중 훈련" : "오답노트";
    const done = Object.keys(sess.ans).length;
    resumeHTML = `
      <div class="sec-title"><h2>이어서</h2><span>자동 저장됨</span></div>
      <button class="mode resume" data-act="resume">
        <div class="num">▶</div>
        <div class="body"><div class="t">${name} 이어서 풀기</div>
          <div class="s">${sess.idx + 1} / ${sess.ids.length}번째 · ${done}문항 응답함</div></div>
        <div class="cnt">이어서</div>
      </button>`;
  }

  $view.innerHTML = `
  <div class="hero">

    <div class="num" style="background:var(--bad-soft);color:var(--bad);font-size:17px">🔥</div>

      <div class="s">번역투 함정 · 선지별 반박 · 계산형 폭격 · K3 60% · 40문항</div></div>
    <div class="cnt" style="background:var(--bad-soft);color:var(--bad)">40</div>

    <div class="num">2</div>
    <div class="body"><div class="t">D-1 파이널 40문항 (B세트)</div>
      <div class="s">시험 전날 최종 점검 · 번역투 함정·계산형 강화 · 40문항</div></div>
    <div class="cnt">40</div>
  </button>

  <button class="mode" data-act="mode" data-mode="mock">
    <div class="num">3</div>
    <div class="body"><div class="t">전체 실전 모의고사</div>
      <div class="s">Ch.1~6 균형 배분 · 실제 시험 난이도 상향 · 40문항</div></div>
    <div class="cnt">40</div>
  </button>

  <button class="mode" data-act="mode" data-mode="sample">
    <div class="num">4</div>
    <div class="body"><div class="t">Sample Exam A 기출 변형/원본</div>
      <div class="s">ISTQB 공식 Sample Exam A 원문 + 부록 3문항 · 42문항</div></div>
    <div class="cnt">42</div>
  </button>

  <button class="mode" data-act="mode" data-mode="v4">
    <div class="num">5</div>
    <div class="body"><div class="t">v4.0 핵심·취약 집중 훈련</div>
      <div class="s">Ch.3 리뷰 역할/유형 · Ch.4 커버리지·결정표 · Ch.5 4분면·PERT·지표 · 20문항</div></div>

  <button class="mode ${wc ? "" : "disabled"}" data-act="mode" data-mode="wrong">

      <div class="s">${wc ? "틀린 문항 " + wc + "개 · 맞히면 오답노트에서 뺄 수 있어요" : "아직 저장된 오답이 없어요"}</div></div>

      <div class="s">Ch.1 ~ Ch.6 원하는 장만 골라서</div></div>
    <div class="cnt">6</div>
  </button>

  <div class="sec-title" style="margin-top:26px"><h2>내 기록</h2><span>이 기기에 저장</span></div>
  <div class="statrow">

    <div class="stat"><div class="v">${store.stat.a}</div><div class="k">푼 문항</div></div>
    <div class="stat"><div class="v" style="color:var(--bad)">${wc}</div><div class="k">오답노트</div></div>
  </div>

  <div class="resetline"><button data-act="reset">진도·오답노트 초기화</button></div>
  ${storeOK ? "" : `<div class="footnote" style="text-align:center">※ 이 브라우저에서는 저장이 제한되어, 앱을 닫으면 진도가 사라질 수 있어요.</div>`}
  <div class="footnote">
    <b>합격 기준</b> 40문항 중 26문항(65%) 이상.
